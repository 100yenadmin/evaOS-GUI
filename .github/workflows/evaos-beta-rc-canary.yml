name: evaOS Beta RC Canary

on:
  workflow_dispatch:
    inputs:
      beta_rc_ack:
        description: 'Type evaos-beta-rc to acknowledge this canary installs and launches the candidate, then locally starts Full Access and Ask Permission without performing desktop actions.'
        required: true
        type: string
      tag:
        description: 'Existing non-dev evaOS beta release tag to verify.'
        required: true
        type: string
      fallback_release_repo:
        description: 'Repository containing the currently released fallback macOS app.'
        required: true
        type: string
      fallback_release_tag:
        description: 'Release tag for the currently released fallback macOS app.'
        required: true
        type: string
      fallback_asset_pattern:
        description: 'gh release download pattern for the fallback macOS app asset. ZIP and DMG are supported.'
        required: true
        default: '*.zip'
        type: string
      fallback_app_name:
        description: 'Installed fallback app bundle name, for example evaOS Workbench.app.'
        required: true
        type: string
      broker_session_proof_ref:
        description: 'Non-secret issue/packet reference proving broker login/session fallback state.'
        required: true
        type: string
      trusted_manifest_run_id:
        description: 'Optional workflow run id that uploaded the trusted release manifest artifact. Required for local-signed-dmg-fallback releases.'
        required: false
        type: string
      local_signed_dmg_fallback_ack:
        description: 'Type evaos-local-signed-dmg only when verifying locally finalized DMGs.'
        required: false
        default: ''
        type: string
      release_target_platforms:
        description: 'Release target platforms for asset verification: all keeps Windows/macOS/Linux; macos verifies x64+arm64 macOS; macos-arm64 verifies only Apple Silicon macOS.'
        required: false
        default: macos-arm64
        type: choice
        options:
          - all
          - macos
          - macos-arm64

permissions:
  contents: read
  actions: read

env:
  EVAOS_RELEASE_TARGET_PLATFORMS: ${{ inputs.release_target_platforms || vars.EVAOS_RELEASE_TARGET_PLATFORMS || 'macos-arm64' }}

jobs:
  rc-canary:
    name: Signed macOS arm64 RC proof
    runs-on: macos-14
    timeout-minutes: 45
    env:
      BETA_APP_NAME: evaOS Workbench.app
      PROOF_DIR: rc-proof
    steps:
      - name: Validate canary inputs
        env:
          ACK: ${{ github.event.inputs.beta_rc_ack }}
          TAG: ${{ github.event.inputs.tag }}
          BROKER_SESSION_PROOF_REF: ${{ github.event.inputs.broker_session_proof_ref }}
          LOCAL_SIGNED_DMG_FALLBACK_ACK: ${{ github.event.inputs.local_signed_dmg_fallback_ack }}
        run: |
          set -euo pipefail
          if [ "$ACK" != "evaos-beta-rc" ]; then
            echo "::error::Wrong RC canary acknowledgement. Type evaos-beta-rc."
            exit 1
          fi
          if [[ "$TAG" != evaos-beta-* ]]; then
            echo "::error::Refusing non-evaOS beta tag: $TAG"
            exit 1
          fi
          if [[ "$TAG" == *"-dev" || "$TAG" == *"-dev-"* || "$TAG" == *"-dev."* ]]; then
            echo "::error::Refusing development beta tag: $TAG"
            exit 1
          fi
          VERSION="${TAG#evaos-beta-}"
          VERSION="${VERSION#v}"
          if [[ "$VERSION" != *evaos-beta* ]]; then
            echo "::error::Refusing tag without evaos-beta version marker: $TAG"
            exit 1
          fi
          if [ -z "$BROKER_SESSION_PROOF_REF" ] || [[ "$BROKER_SESSION_PROOF_REF" == *"Bearer "* ]]; then
            echo "::error::broker_session_proof_ref must be a non-secret issue or packet reference."
            exit 1
          fi
          if [ -n "$LOCAL_SIGNED_DMG_FALLBACK_ACK" ] && [ "$LOCAL_SIGNED_DMG_FALLBACK_ACK" != "evaos-local-signed-dmg" ]; then
            echo "::error::Wrong local signed DMG fallback acknowledgement. Type evaos-local-signed-dmg."
            exit 1
          fi
          if [ "$(uname -m)" != "arm64" ]; then
            echo "::error::This RC canary is the macOS arm64 proof lane and must run on an arm64 runner."
            exit 1
          fi

      - name: Checkout release refs
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate release branch provenance
        id: provenance
        env:
          TAG: ${{ github.event.inputs.tag }}
          EVAOS_BETA_RELEASE_BRANCH: ${{ vars.EVAOS_BETA_RELEASE_BRANCH }}
        run: |
          set -euo pipefail
          if [ -z "${EVAOS_BETA_RELEASE_BRANCH:-}" ]; then
            echo "::error::EVAOS_BETA_RELEASE_BRANCH must be set before RC proof."
            exit 1
          fi

          git fetch origin "refs/tags/${TAG}:refs/tags/${TAG}" "refs/heads/${EVAOS_BETA_RELEASE_BRANCH}:refs/remotes/origin/${EVAOS_BETA_RELEASE_BRANCH}"
          TAG_COMMIT=$(git rev-list -n 1 "$TAG")
          if ! git merge-base --is-ancestor "$TAG_COMMIT" "origin/${EVAOS_BETA_RELEASE_BRANCH}"; then
            echo "::error::Tag $TAG ($TAG_COMMIT) is not reachable from approved release branch ${EVAOS_BETA_RELEASE_BRANCH}."
            exit 1
          fi

          echo "tag_commit=$TAG_COMMIT" >> "$GITHUB_OUTPUT"
          echo "Validated $TAG at $TAG_COMMIT against ${EVAOS_BETA_RELEASE_BRANCH}."

      - name: Download release assets
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || github.token }}
          TAG: ${{ github.event.inputs.tag }}
          TRUSTED_MANIFEST_RUN_ID: ${{ github.event.inputs.trusted_manifest_run_id }}
          LOCAL_SIGNED_DMG_FALLBACK_ACK: ${{ github.event.inputs.local_signed_dmg_fallback_ack }}
        run: |
          set -euo pipefail
          mkdir -p release-assets
          case "${EVAOS_RELEASE_TARGET_PLATFORMS}" in
            all)
              patterns=(
                --pattern "*.dmg"
                --pattern "*.exe"
                --pattern "*.msi"
                --pattern "*.deb"
                --pattern "*.zip"
                --pattern "*.yml"
                --pattern "evaos-beta-release-manifest.json"
              )
              ;;
            macos)
              patterns=(
                --pattern "*.dmg"
                --pattern "*.zip"
                --pattern "latest-mac.yml"
                --pattern "latest-arm64-mac.yml"
                --pattern "evaos-beta-release-manifest.json"
              )
              ;;
            macos-arm64)
              patterns=(
                --pattern "*arm64*.dmg"
                --pattern "*arm64*.zip"
                --pattern "latest-arm64-mac.yml"
                --pattern "evaos-beta-release-manifest.json"
              )
              ;;
            *)
              echo "::error::Unsupported EVAOS_RELEASE_TARGET_PLATFORMS: ${EVAOS_RELEASE_TARGET_PLATFORMS}"
              exit 1
              ;;
          esac
          gh release download "$TAG" \
            --repo "${{ github.repository }}" \
            --dir release-assets \
            "${patterns[@]}"
          ls -la release-assets

      - name: Download trusted release manifest artifact
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || github.token }}
          TAG: ${{ github.event.inputs.tag }}
          TRUSTED_MANIFEST_RUN_ID: ${{ github.event.inputs.trusted_manifest_run_id }}
          LOCAL_SIGNED_DMG_FALLBACK_ACK: ${{ github.event.inputs.local_signed_dmg_fallback_ack }}
        run: |
          set -euo pipefail
          if [ ! -f release-assets/evaos-beta-release-manifest.json ]; then
            echo "::error::Release is missing evaOS beta release manifest."
            exit 1
          fi

          RELEASE_RUN_ID=$(node -e "const fs=require('fs'); const m=JSON.parse(fs.readFileSync('release-assets/evaos-beta-release-manifest.json','utf8')); process.stdout.write(String(m.releaseRunId || ''));")
          RELEASE_PROVENANCE_MODE=$(node -e "const fs=require('fs'); const m=JSON.parse(fs.readFileSync('release-assets/evaos-beta-release-manifest.json','utf8')); process.stdout.write(String(m.releaseProvenance?.mode || 'github-release-workflow'));")
          if [ -z "$RELEASE_RUN_ID" ]; then
            echo "::error::Release manifest is missing releaseRunId."
            exit 1
          fi
          DOWNLOAD_RUN_ID="$RELEASE_RUN_ID"
          if [ "$RELEASE_PROVENANCE_MODE" = "local-signed-dmg-fallback" ]; then
            if [ "$LOCAL_SIGNED_DMG_FALLBACK_ACK" != "evaos-local-signed-dmg" ]; then
              echo "::error::Local signed DMG fallback release requires local_signed_dmg_fallback_ack=evaos-local-signed-dmg."
              exit 1
            fi
            if [ -z "$TRUSTED_MANIFEST_RUN_ID" ]; then
              echo "::error::Local signed DMG fallback release requires trusted_manifest_run_id."
              exit 1
            fi
            DOWNLOAD_RUN_ID="$TRUSTED_MANIFEST_RUN_ID"
          fi

          mkdir -p trusted-manifest
          gh run download "$DOWNLOAD_RUN_ID" \
            --repo "${{ github.repository }}" \
            --name "evaos-beta-release-manifest-${TAG}" \
            --dir trusted-manifest
          TRUSTED_MANIFEST_PATH=$(find trusted-manifest -type f -name evaos-beta-release-manifest.json | head -n 1)
          if [ -z "$TRUSTED_MANIFEST_PATH" ]; then
            echo "::error::Trusted manifest artifact did not contain evaos-beta-release-manifest.json."
            exit 1
          fi
          if [ "$TRUSTED_MANIFEST_PATH" != "trusted-manifest/evaos-beta-release-manifest.json" ]; then
            cp "$TRUSTED_MANIFEST_PATH" trusted-manifest/evaos-beta-release-manifest.json
          fi

      - name: Validate release manifest
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || github.token }}
          EXPECTED_RELEASE_COMMIT: ${{ steps.provenance.outputs.tag_commit }}
          EVAOS_BETA_TRUSTED_MANIFEST_PATH: trusted-manifest/evaos-beta-release-manifest.json
          EVAOS_BETA_LOCAL_SIGNED_DMG_FALLBACK_ACK: ${{ github.event.inputs.local_signed_dmg_fallback_ack }}
          EVAOS_RELEASE_TARGET_PLATFORMS: ${{ env.EVAOS_RELEASE_TARGET_PLATFORMS }}
        run: |
          set -euo pipefail
          TAG="${{ github.event.inputs.tag }}"
          VERSION="${TAG#evaos-beta-}"
          VERSION="${VERSION#v}"
          INCLUDE_WEB_CLI_ASSETS=0 MOCK_VERSION="$VERSION" bash scripts/verify-release-assets.sh release-assets
          node scripts/evaosBetaReleaseGate.js verify-manifest release-assets "${{ github.event.inputs.tag }}"

      - name: Download released fallback app
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || github.token }}
          FALLBACK_REPO: ${{ github.event.inputs.fallback_release_repo }}
          FALLBACK_TAG: ${{ github.event.inputs.fallback_release_tag }}
          FALLBACK_PATTERN: ${{ github.event.inputs.fallback_asset_pattern }}
        run: |
          set -euo pipefail
          mkdir -p fallback-assets
          gh release download "$FALLBACK_TAG" \
            --repo "$FALLBACK_REPO" \
            --dir fallback-assets \
            --pattern "$FALLBACK_PATTERN"
          FALLBACK_ASSET=$(find fallback-assets -type f \( -name "*.dmg" -o -name "*.zip" \) | sort | head -n 1)
          if [ -z "$FALLBACK_ASSET" ]; then
            echo "::error::Fallback release did not provide a ZIP or DMG with pattern $FALLBACK_PATTERN."
            exit 1
          fi
          echo "FALLBACK_ASSET=$FALLBACK_ASSET" >> "$GITHUB_ENV"
          ls -la fallback-assets

      - name: Prepare RC proof directory
        id: prepare_proof
        env:
          TAG: ${{ github.event.inputs.tag }}
        run: |
          set -euo pipefail
          {
            echo "RC_PHASE=prepare_proof"
            echo "RC_CONNECTOR_START_INVOKED=false"
            echo "RC_CONNECTOR_PROCESS_RUNNING=false"
            echo "RC_CONNECTOR_PROCESS_EXIT_CODE="
            echo "RC_CONNECTOR_ATTEMPTS=0"
            echo "RC_CONNECTOR_TOKEN_EXISTS=false"
            echo "RC_CONNECTOR_TOKEN_REGULAR=false"
            echo "RC_CONNECTOR_TOKEN_OWNER_MATCH=false"
            echo "RC_CONNECTOR_TOKEN_MODE_600=false"
            echo "RC_CONNECTOR_TOKEN_NONEMPTY=false"
            echo "RC_CONNECTOR_HEALTH_REACHABLE=false"
            echo "RC_CONNECTOR_READINESS_CLASSIFICATION=not_started"
            echo "RC_QA_STARTED=false"
            echo "RC_QA_SUCCEEDED=false"
            echo "RC_CONNECTOR_CLEANUP_ATTEMPTED=false"
            echo "RC_CONNECTOR_CLEANUP_SUCCEEDED=false"
            echo "RC_WORKBENCH_CLEANUP_ATTEMPTED=false"
            echo "RC_WORKBENCH_CLEANUP_SUCCEEDED=false"
            echo "RC_FALLBACK_LAUNCH_VERIFIED=false"
            echo "RC_ROLLBACK_ATTEMPTED=false"
            echo "RC_ROLLBACK_SUCCEEDED=false"
          } >> "$GITHUB_ENV"
          rm -rf "$PROOF_DIR"
          mkdir -p "$PROOF_DIR/release-assets" "$PROOF_DIR/trusted-manifest"
          cp release-assets/evaos-beta-release-manifest.json "$PROOF_DIR/release-assets/evaos-beta-release-manifest.json"
          find release-assets -maxdepth 1 -type f -name "*.yml" -exec cp {} "$PROOF_DIR/release-assets/" \;
          cp trusted-manifest/evaos-beta-release-manifest.json "$PROOF_DIR/trusted-manifest/evaos-beta-release-manifest.json"
          node - release-assets/evaos-beta-release-manifest.json "$PROOF_DIR/release-assets/release-assets-reference.json" <<'NODE'
          const fs = require('fs');
          const [manifestPath, outputPath] = process.argv.slice(2);
          const manifest = JSON.parse(fs.readFileSync(manifestPath, 'utf8'));
          const reference = {
            schema: 'evaos-beta-release-assets-reference/v1',
            tag: manifest.tag,
            repository: manifest.repository,
            releaseRunId: manifest.releaseRunId,
            releaseCommit: manifest.releaseCommit,
            assets: (manifest.assets || []).map((asset) => ({
              name: asset.name,
              size: asset.size,
              sha256: asset.sha256,
            })),
          };
          fs.writeFileSync(outputPath, `${JSON.stringify(reference, null, 2)}\n`);
          NODE
          node scripts/evaosBetaReleaseGate.js write-rc-proof-template "$PROOF_DIR" "$TAG"

      - name: Verify updater ZIP signature and notarization
        env:
          TAG: ${{ github.event.inputs.tag }}
          TAG_COMMIT: ${{ steps.provenance.outputs.tag_commit }}
        run: |
          set -euo pipefail
          echo "RC_PHASE=verify_updater_zip" >> "$GITHUB_ENV"
          ZIP_NAME_PATH="$RUNNER_TEMP/evaos-updater-zip-name.txt"
          node - release-assets/latest-arm64-mac.yml "$ZIP_NAME_PATH" <<'NODE'
          const fs = require('fs');
          const [metadataPath, outputPath] = process.argv.slice(2);
          const text = fs.readFileSync(metadataPath, 'utf8');
          const refs = [];
          for (const line of text.split(/\r?\n/)) {
            const match = line.match(/^\s*(?:-\s*)?(?:path|url):\s*(.+?)\s*$/);
            if (!match) continue;
            let ref = match[1].trim().replace(/^['"]|['"]$/g, '');
            if (/^https?:\/\//i.test(ref)) ref = new URL(ref).pathname.split('/').pop();
            if (ref?.endsWith('.zip')) refs.push(ref);
          }
          const unique = [...new Set(refs)];
          if (unique.length !== 1 || !/arm64/i.test(unique[0])) {
            throw new Error('latest-arm64-mac.yml must identify exactly one arm64 updater ZIP.');
          }
          fs.writeFileSync(outputPath, unique[0], 'utf8');
          NODE
          ZIP_NAME=$(cat "$ZIP_NAME_PATH")
          UPDATER_ZIP="release-assets/$ZIP_NAME"
          if [ ! -f "$UPDATER_ZIP" ]; then
            echo "::error::Updater metadata references missing arm64 ZIP: $ZIP_NAME"
            exit 1
          fi
          EXPECTED_SHA_PATH="$RUNNER_TEMP/evaos-updater-zip-expected-sha.txt"
          node - release-assets/evaos-beta-release-manifest.json "$ZIP_NAME" "$EXPECTED_SHA_PATH" <<'NODE'
          const fs = require('fs');
          const [manifestPath, assetName, outputPath] = process.argv.slice(2);
          const manifest = JSON.parse(fs.readFileSync(manifestPath, 'utf8'));
          const asset = (manifest.assets || []).find((candidate) => candidate.name === assetName);
          if (!asset || !/^[0-9a-f]{64}$/i.test(String(asset.sha256 || ''))) {
            throw new Error(`Trusted manifest does not bind updater ZIP ${assetName}.`);
          }
          fs.writeFileSync(outputPath, String(asset.sha256).toLowerCase(), 'utf8');
          NODE
          EXPECTED_SHA=$(cat "$EXPECTED_SHA_PATH")
          ACTUAL_SHA=$(shasum -a 256 "$UPDATER_ZIP" | awk '{print $1}')
          if [ "$ACTUAL_SHA" != "$EXPECTED_SHA" ]; then
            echo "::error::Updater ZIP checksum does not match the trusted release manifest."
            exit 1
          fi

          EXTRACT_DIR="$RUNNER_TEMP/evaos-updater-zip-arm64"
          rm -rf "$EXTRACT_DIR"
          mkdir -p "$EXTRACT_DIR"
          ditto -x -k "$UPDATER_ZIP" "$EXTRACT_DIR"
          ZIP_APP="$EXTRACT_DIR/$BETA_APP_NAME"
          APP_ROOT_COUNT=$(find "$EXTRACT_DIR" -mindepth 1 -maxdepth 1 -type d -name '*.app' -print | wc -l | tr -d ' ')
          if [ ! -d "$ZIP_APP" ] || [ "$APP_ROOT_COUNT" != "1" ]; then
            echo "::error::Updater ZIP did not contain $BETA_APP_NAME."
            exit 1
          fi
          INFO_PLIST="$ZIP_APP/Contents/Info.plist"
          if [ ! -f "$INFO_PLIST" ]; then
            echo "::error::Updater ZIP is missing the canonical app Info.plist."
            exit 1
          fi
          /usr/libexec/PlistBuddy -c Print "$INFO_PLIST" >/dev/null
          if [[ ! "$TAG" =~ ^evaos-beta-v?([0-9]+\.[0-9]+\.[0-9]+)-evaos-beta(\.[0-9]+)?$ ]]; then
            echo "::error::Unable to derive the updater app version from tag $TAG."
            exit 1
          fi
          EXPECTED_VERSION="${BASH_REMATCH[1]}"
          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$INFO_PLIST")
          PRODUCT_NAME=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleName' "$INFO_PLIST")
          SHORT_VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$INFO_PLIST")
          BUNDLE_VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$INFO_PLIST")
          if [ "$BUNDLE_ID" != "com.evaos.workbench" ] || [ "$PRODUCT_NAME" != "evaOS Workbench" ] || [ "$SHORT_VERSION" != "$EXPECTED_VERSION" ] || [ "$BUNDLE_VERSION" != "$EXPECTED_VERSION" ]; then
            echo "::error::Updater ZIP app identity does not match the RC tag and canonical Workbench identity."
            exit 1
          fi

          codesign --verify --deep --strict --verbose=2 "$ZIP_APP" > "$PROOF_DIR/codesign-updater-zip-macos-arm64.txt" 2>&1
          xcrun stapler validate "$ZIP_APP" > "$PROOF_DIR/stapler-updater-zip-macos-arm64.txt" 2>&1
          spctl --assess --type execute --verbose "$ZIP_APP" > "$PROOF_DIR/spctl-updater-zip-macos-arm64.txt" 2>&1
          node - "$PROOF_DIR/updater-zip-macos-arm64.json" "$TAG" "$TAG_COMMIT" "$ZIP_NAME" "$ACTUAL_SHA" "$BETA_APP_NAME" "$BUNDLE_ID" "$PRODUCT_NAME" "$SHORT_VERSION" "$BUNDLE_VERSION" <<'NODE'
          const fs = require('fs');
          const [outputPath, tag, releaseCommit, assetName, sha256, appName, bundleId, productName, shortVersion, bundleVersion] = process.argv.slice(2);
          fs.writeFileSync(
            outputPath,
            `${JSON.stringify(
              {
                schema: 'evaos-updater-zip-trust/v2',
                tag,
                releaseCommit,
                assetName,
                sha256,
                appName,
                bundleId,
                productName,
                shortVersion,
                bundleVersion,
                codesignVerified: true,
                staplerVerified: true,
                gatekeeperVerified: true,
              },
              null,
              2
            )}\n`
          );
          NODE
          rm -rf "$EXTRACT_DIR"

      - name: Install fallback and beta apps
        id: install_apps
        env:
          FALLBACK_APP_NAME: ${{ github.event.inputs.fallback_app_name }}
        run: |
          set -euo pipefail
          echo "RC_PHASE=install_candidate" >> "$GITHUB_ENV"
          install_app_from_dmg() {
            local dmg="$1"
            local app_name="$2"
            local mount_dir="$3"

            rm -rf "$mount_dir"
            mkdir -p "$mount_dir"
            hdiutil attach "$dmg" -nobrowse -quiet -mountpoint "$mount_dir"
            local app_path
            app_path=$(find "$mount_dir" -maxdepth 2 -type d -name "$app_name" | head -n 1)
            if [ -z "$app_path" ]; then
              echo "::error::DMG $dmg did not contain $app_name."
              hdiutil detach "$mount_dir" -quiet || true
              exit 1
            fi
            rm -rf "/Applications/$app_name"
            ditto "$app_path" "/Applications/$app_name"
            hdiutil detach "$mount_dir" -quiet
          }

          install_app_from_zip() {
            local zip="$1"
            local app_name="$2"
            local extract_dir="$3"

            rm -rf "$extract_dir"
            mkdir -p "$extract_dir"
            ditto -x -k "$zip" "$extract_dir"
            local app_path
            app_path=$(find "$extract_dir" -maxdepth 4 -type d -name "$app_name" | head -n 1)
            if [ -z "$app_path" ]; then
              echo "::error::ZIP $zip did not contain $app_name."
              exit 1
            fi
            rm -rf "/Applications/$app_name"
            ditto "$app_path" "/Applications/$app_name"
            rm -rf "$extract_dir"
          }

          install_fallback_app() {
            local asset="$1"
            local app_name="$2"

            case "$asset" in
              *.dmg)
                FALLBACK_ASSET_KIND=dmg
                echo "FALLBACK_ASSET_KIND=dmg" >> "$GITHUB_ENV"
                install_app_from_dmg "$asset" "$app_name" "$RUNNER_TEMP/fallback-dmg"
                ;;
              *.zip)
                FALLBACK_ASSET_KIND=zip
                echo "FALLBACK_ASSET_KIND=zip" >> "$GITHUB_ENV"
                install_app_from_zip "$asset" "$app_name" "$RUNNER_TEMP/fallback-zip"
                ;;
              *)
                echo "::error::Unsupported fallback asset type: $asset"
                exit 1
                ;;
            esac
          }

          echo "mutation_started=true" >> "$GITHUB_OUTPUT"
          install_fallback_app "$FALLBACK_ASSET" "$FALLBACK_APP_NAME"

          FALLBACK_PLIST="/Applications/$FALLBACK_APP_NAME/Contents/Info.plist"
          if [ ! -f "$FALLBACK_PLIST" ]; then
            echo "::error::Installed fallback app is missing Info.plist."
            exit 1
          fi
          FALLBACK_EXPECTED_BUNDLE_ID=$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$FALLBACK_PLIST")
          FALLBACK_EXPECTED_PRODUCT_NAME=$(/usr/libexec/PlistBuddy -c 'Print CFBundleName' "$FALLBACK_PLIST")
          FALLBACK_EXPECTED_SHORT_VERSION=$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$FALLBACK_PLIST")
          FALLBACK_EXPECTED_BUNDLE_VERSION=$(/usr/libexec/PlistBuddy -c 'Print CFBundleVersion' "$FALLBACK_PLIST")
          FALLBACK_EXPECTED_EXECUTABLE=$(/usr/libexec/PlistBuddy -c 'Print CFBundleExecutable' "$FALLBACK_PLIST")
          if [[ ! "$FALLBACK_EXPECTED_BUNDLE_ID" =~ ^[A-Za-z0-9.-]+$ ]] || \
            [[ ! "$FALLBACK_EXPECTED_PRODUCT_NAME" =~ ^[A-Za-z0-9._\ -]+$ ]] || \
            [[ ! "$FALLBACK_EXPECTED_SHORT_VERSION" =~ ^[A-Za-z0-9._+-]+$ ]] || \
            [[ ! "$FALLBACK_EXPECTED_BUNDLE_VERSION" =~ ^[A-Za-z0-9._+-]+$ ]] || \
            [[ ! "$FALLBACK_EXPECTED_EXECUTABLE" =~ ^[A-Za-z0-9._\ -]+$ ]]; then
            echo "::error::Installed fallback app has unsafe or incomplete bundle identity metadata."
            exit 1
          fi
          {
            echo "FALLBACK_EXPECTED_BUNDLE_ID=$FALLBACK_EXPECTED_BUNDLE_ID"
            echo "FALLBACK_EXPECTED_PRODUCT_NAME=$FALLBACK_EXPECTED_PRODUCT_NAME"
            echo "FALLBACK_EXPECTED_SHORT_VERSION=$FALLBACK_EXPECTED_SHORT_VERSION"
            echo "FALLBACK_EXPECTED_BUNDLE_VERSION=$FALLBACK_EXPECTED_BUNDLE_VERSION"
            echo "FALLBACK_EXPECTED_EXECUTABLE=$FALLBACK_EXPECTED_EXECUTABLE"
          } >> "$GITHUB_ENV"

          SAME_APP_UPGRADE=false
          if [ "$FALLBACK_APP_NAME" = "$BETA_APP_NAME" ]; then
            SAME_APP_UPGRADE=true
          fi
          echo "SAME_APP_UPGRADE=$SAME_APP_UPGRADE" >> "$GITHUB_ENV"
          FALLBACK_REINSTALL_REQUIRED=false
          if [ "$SAME_APP_UPGRADE" != "true" ] && [ "$FALLBACK_APP_NAME" = "evaOS Workbench Beta.app" ]; then
            FALLBACK_REINSTALL_REQUIRED=true
          fi
          echo "FALLBACK_REINSTALL_REQUIRED=$FALLBACK_REINSTALL_REQUIRED" >> "$GITHUB_ENV"

          BETA_DMG=$(find release-assets \( -name "*mac-arm64*.dmg" -o -name "*arm64*.dmg" \) -type f | sort | head -n 1)
          if [ -z "$BETA_DMG" ]; then
            echo "::error::Release assets do not include a macOS arm64 DMG."
            exit 1
          fi
          install_app_from_dmg "$BETA_DMG" "$BETA_APP_NAME" "$RUNNER_TEMP/beta-dmg"

          if [ "$SAME_APP_UPGRADE" != "true" ] && [ ! -d "/Applications/$FALLBACK_APP_NAME" ]; then
            echo "::error::Installing beta removed the released fallback app."
            exit 1
          fi
          if [ "$FALLBACK_REINSTALL_REQUIRED" = "true" ]; then
            rm -rf "/Applications/$FALLBACK_APP_NAME"
          fi
          if [ ! -d "/Applications/$BETA_APP_NAME" ]; then
            echo "::error::Beta app did not install."
            exit 1
          fi

          {
            if [ "$SAME_APP_UPGRADE" = "true" ]; then
              echo "PASS: beta DMG copied to /Applications/$BETA_APP_NAME as a same-app upgrade over the released fallback app."
            else
              echo "PASS: beta DMG copied to /Applications/$BETA_APP_NAME without replacing the released fallback app."
            fi
            echo "Fallback app: /Applications/$FALLBACK_APP_NAME"
            echo "Fallback asset: $FALLBACK_ASSET"
            echo "Fallback asset kind: ${FALLBACK_ASSET_KIND:-unknown}"
            echo "Beta app: /Applications/$BETA_APP_NAME"
            echo "Same-app upgrade: $SAME_APP_UPGRADE"
            echo "Fallback reinstall required: $FALLBACK_REINSTALL_REQUIRED"
          } > "$PROOF_DIR/install-smoke.md"

      - name: Verify signing and Gatekeeper
        run: |
          set -euo pipefail
          echo "RC_PHASE=verify_signing" >> "$GITHUB_ENV"
          BETA_APP="/Applications/$BETA_APP_NAME"
          BETA_DMG=$(find release-assets \( -name "*mac-arm64*.dmg" -o -name "*arm64*.dmg" \) -type f | sort | head -n 1)
          if [ -z "$BETA_DMG" ]; then
            echo "::error::Release assets do not include a macOS arm64 DMG."
            exit 1
          fi
          codesign --verify --verbose=2 "$BETA_DMG" > "$PROOF_DIR/codesign-dmg-macos-arm64.txt" 2>&1
          xcrun stapler validate "$BETA_DMG" > "$PROOF_DIR/stapler-dmg-macos-arm64.txt" 2>&1
          spctl --assess --type open --context context:primary-signature --verbose "$BETA_DMG" > "$PROOF_DIR/spctl-dmg-macos-arm64.txt" 2>&1
          codesign --verify --deep --strict --verbose=2 "$BETA_APP" > "$PROOF_DIR/codesign-macos-arm64.txt" 2>&1
          xcrun stapler validate "$BETA_APP" > "$PROOF_DIR/stapler-macos-arm64.txt" 2>&1
          spctl --assess --type execute --verbose "$BETA_APP" > "$PROOF_DIR/spctl-macos-arm64.txt" 2>&1

      - name: Launch beta and audit feed isolation
        env:
          TAG_COMMIT: ${{ steps.provenance.outputs.tag_commit }}
        run: |
          set -euo pipefail
          echo "RC_PHASE=launch_candidate" >> "$GITHUB_ENV"
          BETA_APP="/Applications/$BETA_APP_NAME"
          BETA_PLIST="$BETA_APP/Contents/Info.plist"
          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$BETA_PLIST")
          PRODUCT_NAME=$(/usr/libexec/PlistBuddy -c 'Print CFBundleName' "$BETA_PLIST")
          SHORT_VERSION=$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$BETA_PLIST")
          BUNDLE_VERSION=$(/usr/libexec/PlistBuddy -c 'Print CFBundleVersion' "$BETA_PLIST")
          CONNECTOR_PID=""
          CONNECTOR_STATE_DIR="$RUNNER_TEMP/evaos-rc-connector-state"
          CONNECTOR_START_STDOUT="$RUNNER_TEMP/evaos-rc-connector-start.stdout.txt"
          CONNECTOR_START_STDERR="$RUNNER_TEMP/evaos-rc-connector-start.stderr.txt"
          PRE_CANARY_STDOUT="$RUNNER_TEMP/evaos-installed-candidate-pre-canary.stdout.json"
          PRE_CANARY_STDERR="$RUNNER_TEMP/evaos-installed-candidate-pre-canary.stderr.txt"
          CONNECTOR_CANARY_STDOUT="$RUNNER_TEMP/evaos-installed-candidate-connector.stdout.json"
          CONNECTOR_CANARY_STDERR="$RUNNER_TEMP/evaos-installed-candidate-connector.stderr.txt"
          WORKBENCH_PROCESS_SNAPSHOT="$RUNNER_TEMP/evaos-workbench-processes.txt"

          write_exact_app_process_pids() {
            local app_path="$1"
            local process_snapshot="$2"
            local pid_output="$3"

            if ! /bin/ps -ww -axo pid=,comm= > "$process_snapshot"; then
              rm -f "$process_snapshot" "$pid_output"
              return 1
            fi
            if node - "$process_snapshot" "$app_path" "$pid_output" <<'NODE'
          const fs = require('fs');
          const [snapshotPath, appPath, outputPath] = process.argv.slice(2);
          if (!appPath.startsWith('/Applications/') || !appPath.endsWith('.app')) process.exit(2);
          const prefix = `${appPath}/Contents/`;
          const pids = [];
          for (const line of fs.readFileSync(snapshotPath, 'utf8').split(/\r?\n/)) {
            const match = line.match(/^\s*(\d+)\s+(.+)$/);
            if (match && match[2].startsWith(prefix)) pids.push(Number(match[1]));
          }
          const unique = [...new Set(pids)].sort((left, right) => left - right);
          fs.writeFileSync(outputPath, unique.length > 0 ? `${unique.join('\n')}\n` : '', { mode: 0o600 });
          NODE
            then
              rm -f "$process_snapshot"
            else
              rm -f "$process_snapshot" "$pid_output"
              return 1
            fi
          }

          terminate_exact_app_processes() {
            local app_path="$1"
            local state_prefix="$2"
            local process_snapshot="${state_prefix}.snapshot"
            local pid_output="${state_prefix}.pids"
            local process_id

            if ! write_exact_app_process_pids "$app_path" "$process_snapshot" "$pid_output"; then
              rm -f "$process_snapshot" "$pid_output"
              return 1
            fi
            while IFS= read -r process_id; do
              if [[ "$process_id" =~ ^[0-9]+$ ]]; then
                kill "$process_id" >/dev/null 2>&1 || true
              fi
            done < "$pid_output"

            for _workbench_cleanup_attempt in 1 2 3 4 5; do
              if ! write_exact_app_process_pids "$app_path" "$process_snapshot" "$pid_output"; then
                rm -f "$process_snapshot" "$pid_output"
                return 1
              fi
              if [ ! -s "$pid_output" ]; then
                break
              fi
              sleep 1
            done

            if [ -s "$pid_output" ]; then
              while IFS= read -r process_id; do
                if [[ "$process_id" =~ ^[0-9]+$ ]]; then
                  kill -9 "$process_id" >/dev/null 2>&1 || true
                fi
              done < "$pid_output"
              sleep 1
            fi
            if ! write_exact_app_process_pids "$app_path" "$process_snapshot" "$pid_output"; then
              rm -f "$process_snapshot" "$pid_output"
              return 1
            fi
            if [ -s "$pid_output" ]; then
              rm -f "$process_snapshot" "$pid_output"
              return 1
            fi
            rm -f "$process_snapshot" "$pid_output"
          }

          connector_job_is_active() {
            local job_pid
            local job_snapshot

            CONNECTOR_JOB_PROBE_FAILED=false
            if ! job_snapshot=$(jobs -p); then
              CONNECTOR_JOB_PROBE_FAILED=true
              return 1
            fi
            for job_pid in $job_snapshot; do
              if [ "$job_pid" = "$CONNECTOR_PID" ]; then
                return 0
              fi
            done
            return 1
          }

          cleanup_candidate_processes() {
            local exit_status="$1"
            local cleanup_failed=0
            trap - EXIT INT TERM
            if [ -n "${CONNECTOR_PID:-}" ]; then
              echo "RC_CONNECTOR_CLEANUP_ATTEMPTED=true" >> "$GITHUB_ENV"
              if connector_job_is_active; then
                kill "$CONNECTOR_PID" >/dev/null 2>&1 || true
              elif [ "$CONNECTOR_JOB_PROBE_FAILED" = true ]; then
                cleanup_failed=1
              fi
              if [ "$cleanup_failed" -eq 0 ]; then
                for _cleanup_attempt in 1 2 3 4 5; do
                  if ! connector_job_is_active; then
                    if [ "$CONNECTOR_JOB_PROBE_FAILED" = true ]; then
                      cleanup_failed=1
                    fi
                    break
                  fi
                  sleep 1
                done
              fi
              if [ "$cleanup_failed" -eq 0 ]; then
                if connector_job_is_active; then
                  kill -9 "$CONNECTOR_PID" >/dev/null 2>&1 || true
                elif [ "$CONNECTOR_JOB_PROBE_FAILED" = true ]; then
                  cleanup_failed=1
                fi
              fi
              if [ "$cleanup_failed" -eq 0 ]; then
                for _cleanup_attempt in 1 2 3 4 5; do
                  if ! connector_job_is_active; then
                    if [ "$CONNECTOR_JOB_PROBE_FAILED" = true ]; then
                      cleanup_failed=1
                    fi
                    break
                  fi
                  sleep 1
                done
              fi
              if [ "$cleanup_failed" -eq 0 ]; then
                if connector_job_is_active; then
                  cleanup_failed=1
                elif [ "$CONNECTOR_JOB_PROBE_FAILED" = true ]; then
                  cleanup_failed=1
                else
                  set +e
                  wait "$CONNECTOR_PID" >/dev/null 2>&1
                  set -e
                fi
              fi
              if [ "$cleanup_failed" -eq 0 ]; then
                echo "RC_CONNECTOR_CLEANUP_SUCCEEDED=true" >> "$GITHUB_ENV"
              else
                echo "RC_CONNECTOR_CLEANUP_SUCCEEDED=false" >> "$GITHUB_ENV"
              fi
            fi
            echo "RC_WORKBENCH_CLEANUP_ATTEMPTED=true" >> "$GITHUB_ENV"
            if terminate_exact_app_processes "$BETA_APP" "$RUNNER_TEMP/evaos-rc-candidate-cleanup"; then
              echo "RC_WORKBENCH_CLEANUP_SUCCEEDED=true" >> "$GITHUB_ENV"
            else
              echo "RC_WORKBENCH_CLEANUP_SUCCEEDED=false" >> "$GITHUB_ENV"
              cleanup_failed=1
            fi
            rm -f "$CONNECTOR_START_STDOUT" "$CONNECTOR_START_STDERR" \
              "$PRE_CANARY_STDOUT" "$PRE_CANARY_STDERR" \
              "$CONNECTOR_CANARY_STDOUT" "$CONNECTOR_CANARY_STDERR" \
              "$WORKBENCH_PROCESS_SNAPSHOT"
            if [ -n "${PRE_CANARY_DIR:-}" ]; then
              rm -rf "$PRE_CANARY_DIR"
            fi
            if [ -n "${CONNECTOR_CANARY_DIR:-}" ]; then
              rm -rf "$CONNECTOR_CANARY_DIR"
            fi
            rm -rf "$CONNECTOR_STATE_DIR"
            if [ "$cleanup_failed" -ne 0 ]; then
              echo "::error::Harness-owned connector or exact candidate Workbench cleanup did not complete safely."
              if [ "$exit_status" -eq 0 ]; then
                echo "RC_CONNECTOR_READINESS_CLASSIFICATION=cleanup_failed" >> "$GITHUB_ENV"
                exit_status=1
              fi
            fi
            exit "$exit_status"
          }
          trap 'cleanup_candidate_processes $?' EXIT
          trap 'cleanup_candidate_processes 130' INT
          trap 'cleanup_candidate_processes 143' TERM

          if [ "$BETA_APP" != "/Applications/evaOS Workbench.app" ]; then
            echo "::error::RC canary must install the candidate at /Applications/evaOS Workbench.app, got $BETA_APP"
            exit 1
          fi
          if [ "$BUNDLE_ID" != "com.evaos.workbench" ]; then
            echo "::error::Unexpected beta bundle id: $BUNDLE_ID"
            exit 1
          fi
          if [ "$PRODUCT_NAME" != "evaOS Workbench" ]; then
            echo "::error::Unexpected beta product name: $PRODUCT_NAME"
            exit 1
          fi
          if [[ ! "$SHORT_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::CFBundleShortVersionString must be numeric X.Y.Z, got $SHORT_VERSION"
            exit 1
          fi
          if [[ ! "$BUNDLE_VERSION" =~ ^[0-9]+(\.[0-9]+){0,2}$ ]]; then
            echo "::error::CFBundleVersion must be numeric, got $BUNDLE_VERSION"
            exit 1
          fi

          URL_SCHEMES=$(node - "$BETA_PLIST" <<'NODE'
          const { execFileSync } = require('child_process');
          const plistPath = process.argv[2];
          const raw = execFileSync('/usr/bin/plutil', ['-extract', 'CFBundleURLTypes', 'json', '-o', '-', plistPath], {
            encoding: 'utf8',
          });
          const urlTypes = JSON.parse(raw);
          const schemes = urlTypes.flatMap((entry) =>
            Array.isArray(entry.CFBundleURLSchemes) ? entry.CFBundleURLSchemes : []
          );
          process.stdout.write(schemes.join('\n'));
          NODE
          )
          if ! printf '%s\n' "$URL_SCHEMES" | grep -Fx 'evaos-workbench' >/dev/null; then
            echo "::error::Installed app does not declare evaos-workbench protocol scheme."
            printf '%s\n' "$URL_SCHEMES"
            exit 1
          fi
          if printf '%s\n' "$URL_SCHEMES" | grep -Fx 'evaos-workbench-beta' >/dev/null; then
            echo "::error::Installed app still declares stale evaos-workbench-beta protocol scheme."
            exit 1
          fi
          if [ -d "/Applications/evaOS Workbench Beta.app" ]; then
            echo "::error::Stale /Applications/evaOS Workbench Beta.app exists in RC canary."
            exit 1
          fi
          STALE_INDEXED_APPS="$(mdfind 'kMDItemCFBundleIdentifier == "com.evaos.workbench.beta"' || true)"
          if printf '%s\n' "$STALE_INDEXED_APPS" | grep -F '/Volumes/LEXAR/Codex/' >/dev/null; then
            echo "::error::Spotlight indexes stale Workbench beta apps under /Volumes/LEXAR/Codex."
            printf '%s\n' "$STALE_INDEXED_APPS"
            exit 1
          fi

          node - "$BETA_APP/Contents/Resources" "$RUNNER_TEMP/upstream-feed-grep.txt" <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const root = process.argv[2];
          const output = process.argv[3];
          const matches = [];
          const pattern = /github\.com\/iOfficeAI\/AionUi|iOfficeAI\/AionUi|aionui\.com/i;

          function walk(dir) {
            for (const name of fs.readdirSync(dir)) {
              const file = path.join(dir, name);
              const stat = fs.statSync(file);
              if (stat.isDirectory()) {
                if (name === 'Frameworks') continue;
                if (name === 'bundled-aioncore') continue;
                walk(file);
                continue;
              }
              if (!stat.isFile() || name.endsWith('.node') || stat.size > 100 * 1024 * 1024) continue;
              const text = fs.readFileSync(file, 'utf8');
              if (pattern.test(text)) matches.push(file);
            }
          }

          walk(root);
          fs.writeFileSync(output, matches.join('\n'));
          if (matches.length > 0) {
            console.error(`Beta app bundle still references upstream AionUi feed/support text:\n${matches.join('\n')}`);
            process.exit(1);
          }
          NODE

          open -n "$BETA_APP"
          sleep 8
          /bin/ps -ww -axo pid=,comm= > "$WORKBENCH_PROCESS_SNAPSHOT"
          set +e
          node - "$WORKBENCH_PROCESS_SNAPSHOT" <<'NODE'
          const fs = require('fs');
          const snapshotPath = process.argv[2];
          const canonicalApp = '/Applications/evaOS Workbench.app';
          try {
            const lines = fs.readFileSync(snapshotPath, 'utf8').split(/\r?\n/);
            let canonicalMainCount = 0;
            for (const line of lines) {
              const command = line.replace(/^\s*\d+\s+/, '');
              const match = command.match(/^(.+?\.app)\/Contents\/MacOS\/(?:evaOS Workbench|EvaOSWorkbench)$/);
              if (match && match[1] !== canonicalApp) process.exit(2);
              if (match) canonicalMainCount += 1;
            }
            if (canonicalMainCount === 0) process.exit(4);
          } catch {
            process.exit(3);
          }
          NODE
          WORKBENCH_PROCESS_AUDIT_EXIT=$?
          set -e
          rm -f "$WORKBENCH_PROCESS_SNAPSHOT"
          if [ "$WORKBENCH_PROCESS_AUDIT_EXIT" -eq 4 ]; then
            echo "::error::Beta app did not launch its exact canonical main process."
            exit 1
          elif [ "$WORKBENCH_PROCESS_AUDIT_EXIT" -ne 0 ]; then
            echo "::error::A noncanonical Workbench app process is running during installed-candidate proof."
            exit 1
          fi

          BRIDGE_COMMAND="$BETA_APP/Contents/Resources/Bridge/evaos-desktop-bridge"
          if [ ! -x "$BRIDGE_COMMAND" ]; then
            echo "::error::Installed Workbench bridge launcher is missing or not executable."
            exit 1
          fi
          PRE_CANARY_DIR="$RUNNER_TEMP/evaos-installed-candidate-pre-canary"
          CONNECTOR_CANARY_DIR="$RUNNER_TEMP/evaos-installed-candidate-connector"
          rm -rf "$PRE_CANARY_DIR" "$CONNECTOR_CANARY_DIR"
          echo "RC_PHASE=pre_canary" >> "$GITHUB_ENV"
          set +e
          "$BRIDGE_COMMAND" pre-canary \
            --json \
            --control-surface bridge-peekaboo \
            --expected-version "$SHORT_VERSION" \
            --expected-build "$BUNDLE_VERSION" \
            --expected-source-commit "$TAG_COMMIT" \
            --canary-artifact-root "$RUNNER_TEMP" \
            --artifact-dir "$PRE_CANARY_DIR" \
            > "$PRE_CANARY_STDOUT" \
            2> "$PRE_CANARY_STDERR"
          PRE_CANARY_EXIT=$?
          set -e
          PRE_CANARY_REPORT="$PRE_CANARY_DIR/qa-report.json"
          if [ "$PRE_CANARY_EXIT" -ne 0 ]; then
            echo "Pre-canary exit code: $PRE_CANARY_EXIT"
            if [ -f "$PRE_CANARY_REPORT" ]; then
              set +e
              node - "$PRE_CANARY_REPORT" <<'NODE'
          const fs = require('fs');
          const reportPath = process.argv[2];
          try {
            const MAX_SANITIZED_CHECKS = 20;
            const report = JSON.parse(fs.readFileSync(reportPath, 'utf8'));
            const checks = Array.isArray(report.checks) ? report.checks : [];
            const failedChecks = checks.filter((check) => check && check.status === 'fail');
            const sanitizedChecks = failedChecks.map((check) => ({
              code:
                typeof check.code === 'string' && /^[a-z0-9_.-]{1,96}$/i.test(check.code)
                  ? check.code
                  : 'invalid_check_code',
              status: ['fail', 'warn'].includes(check.status) ? check.status : 'unknown',
              // Never echo report-provided messages. They are free-form and
              // can contain credentials, network coordinates, or local paths.
              message: 'Installed candidate did not satisfy this pre-canary check.',
            }));
            if (sanitizedChecks.length === 0) {
              console.error('Pre-canary failed without a non-passing sanitized check.');
            } else {
              for (const check of sanitizedChecks.slice(0, MAX_SANITIZED_CHECKS)) {
                console.error(`Pre-canary sanitized check: ${JSON.stringify(check)}`);
              }
              if (sanitizedChecks.length > MAX_SANITIZED_CHECKS) {
                console.error('Additional pre-canary failed checks were omitted from the sanitized log.');
              }
            }
          } catch {
            // The shell emits one fixed fallback message. Never let a parser
            // exception echo malformed report bytes into the Actions log.
            process.exitCode = 1;
          }
          NODE
              PRE_CANARY_SANITIZER_EXIT=$?
              set -e
              if [ "$PRE_CANARY_SANITIZER_EXIT" -ne 0 ]; then
                echo "Pre-canary report could not be reduced to a sanitized check summary."
              fi
            else
              echo "Pre-canary failed without a report that can be summarized safely."
            fi
            echo "::error::Installed candidate pre-canary failed; see the sanitized check summary above."
            exit "$PRE_CANARY_EXIT"
          fi
          cp "$PRE_CANARY_REPORT" "$PROOF_DIR/installed-candidate-pre-canary.json"

          write_connector_start_summary() {
            node - "$PROOF_DIR/installed-candidate-connector-start.json" "$@" <<'NODE'
          const fs = require('fs');
          const [
            outputPath,
            okRaw,
            classification,
            startInvokedRaw,
            processRunningRaw,
            processExitCodeRaw,
            attemptsRaw,
            tokenExistsRaw,
            tokenRegularRaw,
            tokenOwnerMatchRaw,
            tokenMode600Raw,
            tokenNonemptyRaw,
            healthReachableRaw,
          ] = process.argv.slice(2);
          const classifications = new Set([
            'ready',
            'preexisting_state',
            'preexisting_listener',
            'process_exited',
            'token_missing',
            'token_invalid',
            'health_unreachable',
          ]);
          const parseBoolean = (value) => {
            if (value !== 'true' && value !== 'false') throw new Error('invalid boolean');
            return value === 'true';
          };
          if (!classifications.has(classification)) throw new Error('invalid readiness classification');
          const attempts = Number(attemptsRaw);
          if (!Number.isInteger(attempts) || attempts < 0 || attempts > 100) throw new Error('invalid attempt count');
          const processExitCode = processExitCodeRaw === '' ? null : Number(processExitCodeRaw);
          if (
            processExitCode !== null &&
            (!Number.isInteger(processExitCode) || processExitCode < 0 || processExitCode > 255)
          ) {
            throw new Error('invalid process exit code');
          }
          const payload = {
            schema: 'evaos-installed-connector-harness-start/v1',
            ok: parseBoolean(okRaw),
            classification,
            mode: 'harness-owned-loopback',
            startInvoked: parseBoolean(startInvokedRaw),
            processRunning: parseBoolean(processRunningRaw),
            processExitCode,
            attempts,
            token: {
              atomicRead: classification === 'ready',
              exists: parseBoolean(tokenExistsRaw),
              regularFile: parseBoolean(tokenRegularRaw),
              ownerMatchesRunner: parseBoolean(tokenOwnerMatchRaw),
              mode0600: parseBoolean(tokenMode600Raw),
              nonempty: parseBoolean(tokenNonemptyRaw),
            },
            health: { reachable: parseBoolean(healthReachableRaw) },
          };
          fs.writeFileSync(outputPath, `${JSON.stringify(payload, null, 2)}\n`, { mode: 0o600 });
          NODE
          }

          read_connector_token_state() {
            TOKEN_EXISTS=false
            TOKEN_REGULAR=false
            TOKEN_OWNER_MATCH=false
            TOKEN_MODE_600=false
            TOKEN_NONEMPTY=false
            if [ -e "$TOKEN_FILE" ] || [ -L "$TOKEN_FILE" ]; then
              TOKEN_EXISTS=true
            fi
            if [ -f "$TOKEN_FILE" ] && [ ! -L "$TOKEN_FILE" ]; then
              TOKEN_REGULAR=true
              if [ "$(stat -f '%u' "$TOKEN_FILE" 2>/dev/null || true)" = "$(id -u)" ]; then
                TOKEN_OWNER_MATCH=true
              fi
              if [ "$(stat -f '%Lp' "$TOKEN_FILE" 2>/dev/null || true)" = "600" ]; then
                TOKEN_MODE_600=true
              fi
              if [ -s "$TOKEN_FILE" ]; then
                TOKEN_NONEMPTY=true
              fi
            fi
          }

          read_connector_token_atomically() {
            node - "$TOKEN_FILE" <<'NODE'
          const fs = require('fs');
          const tokenPath = process.argv[2];
          const noFollow = fs.constants.O_NOFOLLOW;
          let descriptor;
          try {
            if (!Number.isInteger(noFollow) || noFollow <= 0 || typeof process.getuid !== 'function') process.exit(2);
            descriptor = fs.openSync(tokenPath, fs.constants.O_RDONLY | noFollow);
            const before = fs.fstatSync(descriptor);
            if (
              !before.isFile() ||
              before.uid !== process.getuid() ||
              (before.mode & 0o777) !== 0o600 ||
              before.size < 32 ||
              before.size > 129
            ) {
              process.exit(2);
            }
            const buffer = Buffer.alloc(130);
            const bytesRead = fs.readSync(descriptor, buffer, 0, buffer.length, 0);
            if (bytesRead === buffer.length || bytesRead !== before.size) process.exit(2);
            const raw = buffer.subarray(0, bytesRead).toString('utf8');
            const after = fs.fstatSync(descriptor);
            if (
              before.dev !== after.dev ||
              before.ino !== after.ino ||
              before.size !== after.size ||
              before.mtimeMs !== after.mtimeMs ||
              !/^[A-Za-z0-9_-]{32,128}\n?$/.test(raw)
            ) {
              process.exit(2);
            }
            process.stdout.write(raw.trimEnd());
          } catch {
            process.exitCode = 2;
          } finally {
            if (descriptor !== undefined) fs.closeSync(descriptor);
          }
          NODE
          }

          publish_connector_state() {
            {
              echo "RC_CONNECTOR_PROCESS_RUNNING=$CONNECTOR_PROCESS_RUNNING"
              echo "RC_CONNECTOR_PROCESS_EXIT_CODE=$CONNECTOR_PROCESS_EXIT_CODE"
              echo "RC_CONNECTOR_ATTEMPTS=$CONNECTOR_ATTEMPTS"
              echo "RC_CONNECTOR_TOKEN_EXISTS=$TOKEN_EXISTS"
              echo "RC_CONNECTOR_TOKEN_REGULAR=$TOKEN_REGULAR"
              echo "RC_CONNECTOR_TOKEN_OWNER_MATCH=$TOKEN_OWNER_MATCH"
              echo "RC_CONNECTOR_TOKEN_MODE_600=$TOKEN_MODE_600"
              echo "RC_CONNECTOR_TOKEN_NONEMPTY=$TOKEN_NONEMPTY"
              echo "RC_CONNECTOR_HEALTH_REACHABLE=$CONNECTOR_HEALTH_REACHABLE"
              echo "RC_CONNECTOR_READINESS_CLASSIFICATION=$CONNECTOR_READINESS_CLASSIFICATION"
            } >> "$GITHUB_ENV"
          }

          echo "RC_PHASE=connector_start" >> "$GITHUB_ENV"
          rm -rf "$CONNECTOR_STATE_DIR"
          mkdir -p "$CONNECTOR_STATE_DIR"
          chmod 700 "$CONNECTOR_STATE_DIR"
          TOKEN_FILE="$CONNECTOR_STATE_DIR/connector.token"
          CONNECTOR_ATTEMPTS=0
          CONNECTOR_PROCESS_RUNNING=false
          CONNECTOR_PROCESS_EXIT_CODE=""
          CONNECTOR_HEALTH_REACHABLE=false
          CONNECTOR_READINESS_CLASSIFICATION=not_started
          read_connector_token_state
          if [ "$TOKEN_EXISTS" = true ]; then
            CONNECTOR_READINESS_CLASSIFICATION=preexisting_state
            publish_connector_state
            write_connector_start_summary false preexisting_state false false "" 0 \
              "$TOKEN_EXISTS" "$TOKEN_REGULAR" "$TOKEN_OWNER_MATCH" "$TOKEN_MODE_600" "$TOKEN_NONEMPTY" false
            echo "::error::The isolated connector harness did not begin from an empty token state."
            exit 1
          fi
          if /usr/sbin/lsof -nP -iTCP:8765 -sTCP:LISTEN >/dev/null 2>&1; then
            CONNECTOR_READINESS_CLASSIFICATION=preexisting_listener
            publish_connector_state
            write_connector_start_summary false preexisting_listener false false "" 0 \
              false false false false false false
            echo "::error::The connector canary loopback endpoint was already occupied before harness start."
            exit 1
          fi

          EVAOS_DESKTOP_BRIDGE_STATE_DIR="$CONNECTOR_STATE_DIR" \
          EVAOS_DESKTOP_BRIDGE_MODE=customer-mac-connector \
          EVAOS_DESKTOP_BRIDGE_MANAGED_BY=workbench-session \
          EVAOS_DESKTOP_BRIDGE_RESPONSIBLE_BUNDLE_ID=com.evaos.workbench \
          EVAOS_DESKTOP_BRIDGE_RESPONSIBLE_APP_PATH="$BETA_APP" \
            "$BRIDGE_COMMAND" serve \
              --host 127.0.0.1 \
              --port 8765 \
              --token-file "$TOKEN_FILE" \
              > "$CONNECTOR_START_STDOUT" \
              2> "$CONNECTOR_START_STDERR" &
          CONNECTOR_PID=$!
          echo "RC_CONNECTOR_START_INVOKED=true" >> "$GITHUB_ENV"

          CONNECTOR_DEADLINE=$((SECONDS + 45))
          while [ "$SECONDS" -lt "$CONNECTOR_DEADLINE" ]; do
            CONNECTOR_ATTEMPTS=$((CONNECTOR_ATTEMPTS + 1))
            read_connector_token_state
            if ! kill -0 "$CONNECTOR_PID" >/dev/null 2>&1; then
              set +e
              wait "$CONNECTOR_PID" >/dev/null 2>&1
              CONNECTOR_PROCESS_EXIT_CODE=$?
              set -e
              CONNECTOR_PID=""
              CONNECTOR_PROCESS_RUNNING=false
              CONNECTOR_READINESS_CLASSIFICATION=process_exited
              {
                echo "RC_CONNECTOR_CLEANUP_ATTEMPTED=true"
                echo "RC_CONNECTOR_CLEANUP_SUCCEEDED=true"
              } >> "$GITHUB_ENV"
              publish_connector_state
              write_connector_start_summary false process_exited true false "$CONNECTOR_PROCESS_EXIT_CODE" \
                "$CONNECTOR_ATTEMPTS" "$TOKEN_EXISTS" "$TOKEN_REGULAR" "$TOKEN_OWNER_MATCH" \
                "$TOKEN_MODE_600" "$TOKEN_NONEMPTY" false
              echo "::error::The harness-owned installed connector exited before becoming ready."
              exit 1
            fi
            CONNECTOR_PROCESS_RUNNING=true
            if [ "$TOKEN_REGULAR" = true ] && [ "$TOKEN_OWNER_MATCH" = true ] && \
              [ "$TOKEN_MODE_600" = true ] && [ "$TOKEN_NONEMPTY" = true ] && \
              curl --fail --silent --max-time 2 http://127.0.0.1:8765/health >/dev/null 2>&1; then
              CONNECTOR_HEALTH_REACHABLE=true
              break
            fi
            sleep 1
          done

          read_connector_token_state
          CONNECTOR_TOKEN=""
          ATOMIC_TOKEN_EXIT=1
          if [ "$TOKEN_REGULAR" = true ] && [ "$TOKEN_OWNER_MATCH" = true ] && \
            [ "$TOKEN_MODE_600" = true ] && [ "$TOKEN_NONEMPTY" = true ]; then
            set +e
            CONNECTOR_TOKEN=$(read_connector_token_atomically 2>/dev/null)
            ATOMIC_TOKEN_EXIT=$?
            set -e
          fi
          if [ "$TOKEN_EXISTS" != true ]; then
            CONNECTOR_READINESS_CLASSIFICATION=token_missing
          elif [ "$TOKEN_REGULAR" != true ] || [ "$TOKEN_OWNER_MATCH" != true ] || \
            [ "$TOKEN_MODE_600" != true ] || [ "$TOKEN_NONEMPTY" != true ] || \
            [ "$ATOMIC_TOKEN_EXIT" -ne 0 ] || [ -z "$CONNECTOR_TOKEN" ]; then
            CONNECTOR_READINESS_CLASSIFICATION=token_invalid
          elif [ "$CONNECTOR_HEALTH_REACHABLE" != true ]; then
            CONNECTOR_READINESS_CLASSIFICATION=health_unreachable
          else
            CONNECTOR_READINESS_CLASSIFICATION=ready
          fi
          publish_connector_state
          write_connector_start_summary \
            "$([ "$CONNECTOR_READINESS_CLASSIFICATION" = ready ] && printf true || printf false)" \
            "$CONNECTOR_READINESS_CLASSIFICATION" true "$CONNECTOR_PROCESS_RUNNING" "" \
            "$CONNECTOR_ATTEMPTS" "$TOKEN_EXISTS" "$TOKEN_REGULAR" "$TOKEN_OWNER_MATCH" \
            "$TOKEN_MODE_600" "$TOKEN_NONEMPTY" "$CONNECTOR_HEALTH_REACHABLE"
          if [ "$CONNECTOR_READINESS_CLASSIFICATION" != ready ]; then
            CONNECTOR_TOKEN=""
            unset CONNECTOR_TOKEN
            echo "::error::The harness-owned installed connector did not become safely ready."
            exit 1
          fi
          {
            echo "RC_PHASE=connector_qa"
            echo "RC_QA_STARTED=true"
          } >> "$GITHUB_ENV"
          set +e
          EVAOS_DESKTOP_BRIDGE_STATE_DIR="$CONNECTOR_STATE_DIR" \
          EVAOS_DESKTOP_BRIDGE_TOKEN="$CONNECTOR_TOKEN" \
            "$BRIDGE_COMMAND" qa-canary \
            --connector-url http://127.0.0.1:8765 \
            --artifact-dir "$CONNECTOR_CANARY_DIR" \
            --version-under-test "$SHORT_VERSION" \
            --build-under-test "$BUNDLE_VERSION" \
            --source-commit-under-test "$TAG_COMMIT" \
            --surface connector \
            --suite control_start \
            --operator-ack-live-control \
            > "$CONNECTOR_CANARY_STDOUT" \
            2> "$CONNECTOR_CANARY_STDERR"
          QA_CANARY_EXIT=$?
          set -e
          if [ -f "$CONNECTOR_CANARY_DIR/qa-report.json" ]; then
            cp "$CONNECTOR_CANARY_DIR/qa-report.json" "$PROOF_DIR/installed-candidate-connector.json"
          fi
          TOKEN_SCAN_EXIT=0
          LC_ALL=C grep -R -F -- "$CONNECTOR_TOKEN" "$PROOF_DIR" >/dev/null 2>&1 || TOKEN_SCAN_EXIT=$?
          if [ "$TOKEN_SCAN_EXIT" -eq 0 ]; then
            echo "::error::Installed candidate proof leaked the connector token."
            unset CONNECTOR_TOKEN
            exit 1
          fi
          if [ "$TOKEN_SCAN_EXIT" -ne 1 ]; then
            echo "::error::Installed candidate proof token scan could not complete safely."
            unset CONNECTOR_TOKEN
            exit 1
          fi
          unset CONNECTOR_TOKEN
          if [ "$QA_CANARY_EXIT" -ne 0 ]; then
            {
              echo "RC_QA_SUCCEEDED=false"
              echo "RC_CONNECTOR_READINESS_CLASSIFICATION=qa_failed"
            } >> "$GITHUB_ENV"
            echo "::error::Installed candidate connector canary failed; inspect the sanitized proof artifact."
            exit 1
          fi
          echo "RC_QA_SUCCEEDED=true" >> "$GITHUB_ENV"

          {
            echo "PASS: evaOS Workbench launched with stable Workbench identity and no upstream AionUi feed."
            echo "Bundle id: $BUNDLE_ID"
            echo "Product name: $PRODUCT_NAME"
            echo "Short version: $SHORT_VERSION"
            echo "Bundle version: $BUNDLE_VERSION"
            echo "Protocol scheme: evaos-workbench"
          } > "$PROOF_DIR/launch-smoke.md"

          {
            echo "PASS: protocol scheme evaos-workbench is declared by com.evaos.workbench."
            echo "Bundle id: $BUNDLE_ID"
            echo "Protocol scheme: evaos-workbench"
            echo "Declared schemes:"
            printf '%s\n' "$URL_SCHEMES"
          } > "$PROOF_DIR/protocol-identity.md"

          {
            echo "PASS: exact app path /Applications/evaOS Workbench.app used for RC canary install and launch."
            echo "PASS: no stale indexed Workbench apps under Lexar proof trees."
            echo "PASS: no stale running Workbench apps outside /Applications/evaOS Workbench.app."
            echo "PASS: Computer Use exact path rule recorded; signed installed-app product proof must still target /Applications/evaOS Workbench.app."
            echo "PASS: OpenClaw bridge tools selected unless Computer Use is explicitly mounted in that runtime."
          } > "$PROOF_DIR/installed-app-path-hygiene.md"

          {
            echo "PASS: update repo is 100yenadmin/evaOS-GUI and iOfficeAI/AionUi blocked for beta assets."
            echo "Artifact grep found no upstream feed/support references in app resources."
          } > "$PROOF_DIR/updater-feed-audit.md"

      - name: Roll back beta and verify fallback
        id: rollback_candidate
        if: ${{ always() && steps.install_apps.outputs.mutation_started == 'true' }}
        env:
          FALLBACK_APP_NAME: ${{ github.event.inputs.fallback_app_name }}
          BROKER_SESSION_PROOF_REF: ${{ github.event.inputs.broker_session_proof_ref }}
          PRIOR_JOB_STATUS: ${{ job.status }}
          INSTALL_STEP_OUTCOME: ${{ steps.install_apps.outcome }}
        run: |
          set -euo pipefail
          echo "RC_ROLLBACK_ATTEMPTED=true" >> "$GITHUB_ENV"
          if [ "$PRIOR_JOB_STATUS" = "success" ]; then
            echo "RC_PHASE=rollback" >> "$GITHUB_ENV"
          fi
          FALLBACK_APP="/Applications/$FALLBACK_APP_NAME"
          BETA_APP="/Applications/$BETA_APP_NAME"
          ROLLBACK_SAME_APP=false
          if [ "$FALLBACK_APP_NAME" = "$BETA_APP_NAME" ]; then
            ROLLBACK_SAME_APP=true
          fi

          install_app_from_dmg() {
            local dmg="$1"
            local app_name="$2"
            local mount_dir="$3"

            rm -rf "$mount_dir"
            mkdir -p "$mount_dir"
            hdiutil attach "$dmg" -nobrowse -quiet -mountpoint "$mount_dir"
            local app_path
            app_path=$(find "$mount_dir" -maxdepth 2 -type d -name "$app_name" | head -n 1)
            if [ -z "$app_path" ]; then
              echo "::error::Fallback DMG $dmg did not contain $app_name."
              hdiutil detach "$mount_dir" -quiet || true
              exit 1
            fi
            rm -rf "/Applications/$app_name"
            ditto "$app_path" "/Applications/$app_name"
            hdiutil detach "$mount_dir" -quiet
          }

          install_app_from_zip() {
            local zip="$1"
            local app_name="$2"
            local extract_dir="$3"

            rm -rf "$extract_dir"
            mkdir -p "$extract_dir"
            ditto -x -k "$zip" "$extract_dir"
            local app_path
            app_path=$(find "$extract_dir" -maxdepth 4 -type d -name "$app_name" | head -n 1)
            if [ -z "$app_path" ]; then
              echo "::error::Fallback ZIP $zip did not contain $app_name."
              exit 1
            fi
            rm -rf "/Applications/$app_name"
            ditto "$app_path" "/Applications/$app_name"
          }

          write_exact_app_process_pids() {
            local app_path="$1"
            local process_snapshot="$2"
            local pid_output="$3"

            if ! /bin/ps -ww -axo pid=,comm= > "$process_snapshot"; then
              rm -f "$process_snapshot" "$pid_output"
              return 1
            fi
            if node - "$process_snapshot" "$app_path" "$pid_output" <<'NODE'
          const fs = require('fs');
          const [snapshotPath, appPath, outputPath] = process.argv.slice(2);
          if (!appPath.startsWith('/Applications/') || !appPath.endsWith('.app')) process.exit(2);
          const prefix = `${appPath}/Contents/`;
          const pids = [];
          for (const line of fs.readFileSync(snapshotPath, 'utf8').split(/\r?\n/)) {
            const match = line.match(/^\s*(\d+)\s+(.+)$/);
            if (match && match[2].startsWith(prefix)) pids.push(Number(match[1]));
          }
          const unique = [...new Set(pids)].sort((left, right) => left - right);
          fs.writeFileSync(outputPath, unique.length > 0 ? `${unique.join('\n')}\n` : '', { mode: 0o600 });
          NODE
            then
              rm -f "$process_snapshot"
            else
              rm -f "$process_snapshot" "$pid_output"
              return 1
            fi
          }

          write_exact_app_main_pids() {
            local app_path="$1"
            local executable_name="$2"
            local process_snapshot="$3"
            local pid_output="$4"

            if ! /bin/ps -ww -axo pid=,comm= > "$process_snapshot"; then
              rm -f "$process_snapshot" "$pid_output"
              return 1
            fi
            if node - "$process_snapshot" "$app_path" "$executable_name" "$pid_output" <<'NODE'
          const fs = require('fs');
          const [snapshotPath, appPath, executableName, outputPath] = process.argv.slice(2);
          if (
            !appPath.startsWith('/Applications/') ||
            !appPath.endsWith('.app') ||
            !/^[A-Za-z0-9._ -]+$/.test(executableName)
          ) {
            process.exit(2);
          }
          const executablePath = `${appPath}/Contents/MacOS/${executableName}`;
          const pids = [];
          for (const line of fs.readFileSync(snapshotPath, 'utf8').split(/\r?\n/)) {
            const match = line.match(/^\s*(\d+)\s+(.+)$/);
            if (match && match[2] === executablePath) {
              pids.push(Number(match[1]));
            }
          }
          const unique = [...new Set(pids)].sort((left, right) => left - right);
          fs.writeFileSync(outputPath, unique.length > 0 ? `${unique.join('\n')}\n` : '', { mode: 0o600 });
          NODE
            then
              rm -f "$process_snapshot"
            else
              rm -f "$process_snapshot" "$pid_output"
              return 1
            fi
          }

          terminate_exact_app_processes() {
            local app_path="$1"
            local state_prefix="$2"
            local process_snapshot="${state_prefix}.snapshot"
            local pid_output="${state_prefix}.pids"
            local process_id

            if ! write_exact_app_process_pids "$app_path" "$process_snapshot" "$pid_output"; then
              rm -f "$process_snapshot" "$pid_output"
              return 1
            fi
            while IFS= read -r process_id; do
              if [[ "$process_id" =~ ^[0-9]+$ ]]; then
                kill "$process_id" >/dev/null 2>&1 || true
              fi
            done < "$pid_output"

            for _workbench_cleanup_attempt in 1 2 3 4 5; do
              if ! write_exact_app_process_pids "$app_path" "$process_snapshot" "$pid_output"; then
                rm -f "$process_snapshot" "$pid_output"
                return 1
              fi
              if [ ! -s "$pid_output" ]; then
                break
              fi
              sleep 1
            done

            if [ -s "$pid_output" ]; then
              while IFS= read -r process_id; do
                if [[ "$process_id" =~ ^[0-9]+$ ]]; then
                  kill -9 "$process_id" >/dev/null 2>&1 || true
                fi
              done < "$pid_output"
              sleep 1
            fi
            if ! write_exact_app_process_pids "$app_path" "$process_snapshot" "$pid_output"; then
              rm -f "$process_snapshot" "$pid_output"
              return 1
            fi
            if [ -s "$pid_output" ]; then
              rm -f "$process_snapshot" "$pid_output"
              return 1
            fi
            rm -f "$process_snapshot" "$pid_output"
          }

          echo "RC_WORKBENCH_CLEANUP_ATTEMPTED=true" >> "$GITHUB_ENV"
          if ! terminate_exact_app_processes "$BETA_APP" "$RUNNER_TEMP/evaos-rollback-candidate-cleanup"; then
            echo "RC_WORKBENCH_CLEANUP_SUCCEEDED=false" >> "$GITHUB_ENV"
            echo "::error::Exact candidate Workbench processes survived bounded rollback cleanup."
            exit 1
          fi
          if [ "$FALLBACK_APP" != "$BETA_APP" ] && \
            ! terminate_exact_app_processes "$FALLBACK_APP" "$RUNNER_TEMP/evaos-rollback-fallback-prelaunch-cleanup"; then
            echo "RC_WORKBENCH_CLEANUP_SUCCEEDED=false" >> "$GITHUB_ENV"
            echo "::error::Exact fallback Workbench processes survived bounded prelaunch cleanup."
            exit 1
          fi
          echo "RC_WORKBENCH_CLEANUP_SUCCEEDED=true" >> "$GITHUB_ENV"

          rm -rf "$BETA_APP"
          if [ "$INSTALL_STEP_OUTCOME" != "success" ] || [ "$ROLLBACK_SAME_APP" = "true" ] || \
            [ "${FALLBACK_REINSTALL_REQUIRED:-false}" = "true" ] || [ ! -d "$FALLBACK_APP" ]; then
            case "${FALLBACK_ASSET:-}" in
              *.dmg)
                install_app_from_dmg "$FALLBACK_ASSET" "$FALLBACK_APP_NAME" "$RUNNER_TEMP/rollback-fallback-dmg"
                ;;
              *.zip)
                install_app_from_zip "$FALLBACK_ASSET" "$FALLBACK_APP_NAME" "$RUNNER_TEMP/rollback-fallback-zip"
                ;;
              *)
                echo "::error::Unsupported fallback asset for rollback reinstall: ${FALLBACK_ASSET:-missing}"
                exit 1
                ;;
            esac
          fi

          if [ "$ROLLBACK_SAME_APP" != "true" ] && [ -d "$BETA_APP" ]; then
            echo "::error::Beta app is still present after rollback removal."
            exit 1
          fi

          if [ ! -d "$FALLBACK_APP" ]; then
            echo "::error::Released fallback app is missing after rollback."
            exit 1
          fi

          FALLBACK_PLIST="$FALLBACK_APP/Contents/Info.plist"
          if [ ! -f "$FALLBACK_PLIST" ]; then
            echo "::error::Restored fallback app is missing Info.plist."
            exit 1
          fi
          ACTUAL_FALLBACK_BUNDLE_ID=$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$FALLBACK_PLIST")
          ACTUAL_FALLBACK_PRODUCT_NAME=$(/usr/libexec/PlistBuddy -c 'Print CFBundleName' "$FALLBACK_PLIST")
          ACTUAL_FALLBACK_SHORT_VERSION=$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$FALLBACK_PLIST")
          ACTUAL_FALLBACK_BUNDLE_VERSION=$(/usr/libexec/PlistBuddy -c 'Print CFBundleVersion' "$FALLBACK_PLIST")
          ACTUAL_FALLBACK_EXECUTABLE=$(/usr/libexec/PlistBuddy -c 'Print CFBundleExecutable' "$FALLBACK_PLIST")
          if [[ ! "$ACTUAL_FALLBACK_BUNDLE_ID" =~ ^[A-Za-z0-9.-]+$ ]] || \
            [[ ! "$ACTUAL_FALLBACK_PRODUCT_NAME" =~ ^[A-Za-z0-9._\ -]+$ ]] || \
            [[ ! "$ACTUAL_FALLBACK_SHORT_VERSION" =~ ^[A-Za-z0-9._+-]+$ ]] || \
            [[ ! "$ACTUAL_FALLBACK_BUNDLE_VERSION" =~ ^[A-Za-z0-9._+-]+$ ]] || \
            [[ ! "$ACTUAL_FALLBACK_EXECUTABLE" =~ ^[A-Za-z0-9._\ -]+$ ]]; then
            echo "::error::Restored fallback app has unsafe or incomplete bundle identity metadata."
            exit 1
          fi
          if [ -n "${FALLBACK_EXPECTED_BUNDLE_ID:-}" ] || \
            [ -n "${FALLBACK_EXPECTED_PRODUCT_NAME:-}" ] || \
            [ -n "${FALLBACK_EXPECTED_SHORT_VERSION:-}" ] || \
            [ -n "${FALLBACK_EXPECTED_BUNDLE_VERSION:-}" ] || \
            [ -n "${FALLBACK_EXPECTED_EXECUTABLE:-}" ]; then
            if [ "$ACTUAL_FALLBACK_BUNDLE_ID" != "${FALLBACK_EXPECTED_BUNDLE_ID:-}" ] || \
              [ "$ACTUAL_FALLBACK_PRODUCT_NAME" != "${FALLBACK_EXPECTED_PRODUCT_NAME:-}" ] || \
              [ "$ACTUAL_FALLBACK_SHORT_VERSION" != "${FALLBACK_EXPECTED_SHORT_VERSION:-}" ] || \
              [ "$ACTUAL_FALLBACK_BUNDLE_VERSION" != "${FALLBACK_EXPECTED_BUNDLE_VERSION:-}" ] || \
              [ "$ACTUAL_FALLBACK_EXECUTABLE" != "${FALLBACK_EXPECTED_EXECUTABLE:-}" ]; then
              echo "::error::Restored fallback bundle identity does not match the downloaded fallback release asset."
              exit 1
            fi
          fi

          FALLBACK_MAIN_SNAPSHOT="$RUNNER_TEMP/evaos-rollback-fallback-main.snapshot"
          FALLBACK_MAIN_PIDS="$RUNNER_TEMP/evaos-rollback-fallback-main.pids"
          write_exact_app_main_pids \
            "$FALLBACK_APP" \
            "$ACTUAL_FALLBACK_EXECUTABLE" \
            "$FALLBACK_MAIN_SNAPSHOT" \
            "$FALLBACK_MAIN_PIDS"
          if [ -s "$FALLBACK_MAIN_PIDS" ]; then
            echo "::error::Fallback launch baseline was not clean after exact process cleanup."
            rm -f "$FALLBACK_MAIN_SNAPSHOT" "$FALLBACK_MAIN_PIDS"
            exit 1
          fi

          open -n "$FALLBACK_APP"
          FALLBACK_LAUNCH_DEADLINE=$((SECONDS + 15))
          while [ "$SECONDS" -lt "$FALLBACK_LAUNCH_DEADLINE" ]; do
            write_exact_app_main_pids \
              "$FALLBACK_APP" \
              "$ACTUAL_FALLBACK_EXECUTABLE" \
              "$FALLBACK_MAIN_SNAPSHOT" \
              "$FALLBACK_MAIN_PIDS"
            if [ -s "$FALLBACK_MAIN_PIDS" ]; then
              break
            fi
            sleep 1
          done
          if [ ! -s "$FALLBACK_MAIN_PIDS" ]; then
            echo "::error::Released fallback app did not launch after beta removal."
            rm -f "$FALLBACK_MAIN_SNAPSHOT" "$FALLBACK_MAIN_PIDS"
            exit 1
          fi
          FALLBACK_LAUNCH_PID=""
          while IFS= read -r process_id; do
            if [[ "$process_id" =~ ^[0-9]+$ ]]; then
              FALLBACK_LAUNCH_PID="$process_id"
              break
            fi
          done < "$FALLBACK_MAIN_PIDS"
          if [ -z "$FALLBACK_LAUNCH_PID" ]; then
            echo "::error::Released fallback app launch did not yield a valid exact-path process."
            rm -f "$FALLBACK_MAIN_SNAPSHOT" "$FALLBACK_MAIN_PIDS"
            exit 1
          fi
          FALLBACK_LAUNCH_DWELL_SECONDS=8
          for _fallback_dwell_second in 1 2 3 4 5 6 7 8; do
            sleep 1
            write_exact_app_main_pids \
              "$FALLBACK_APP" \
              "$ACTUAL_FALLBACK_EXECUTABLE" \
              "$FALLBACK_MAIN_SNAPSHOT" \
              "$FALLBACK_MAIN_PIDS"
            if ! /usr/bin/grep -Fx "$FALLBACK_LAUNCH_PID" "$FALLBACK_MAIN_PIDS" >/dev/null 2>&1; then
              echo "::error::Released fallback app did not remain running through the launch dwell."
              rm -f "$FALLBACK_MAIN_SNAPSHOT" "$FALLBACK_MAIN_PIDS"
              exit 1
            fi
          done
          echo "RC_FALLBACK_LAUNCH_VERIFIED=true" >> "$GITHUB_ENV"
          rm -f "$FALLBACK_MAIN_SNAPSHOT" "$FALLBACK_MAIN_PIDS"
          if ! terminate_exact_app_processes "$FALLBACK_APP" "$RUNNER_TEMP/evaos-rollback-fallback-postlaunch-cleanup"; then
            echo "RC_WORKBENCH_CLEANUP_SUCCEEDED=false" >> "$GITHUB_ENV"
            echo "::error::Exact fallback Workbench processes survived bounded postlaunch cleanup."
            exit 1
          fi

          /System/Library/Frameworks/CoreServices.framework/Frameworks/LaunchServices.framework/Support/lsregister -dump \
            | grep -Ei "evaos|workbench|${FALLBACK_APP_NAME%.app}" \
            > "$PROOF_DIR/launchservices-protocol-state.txt" || true

          {
            echo "PASS: candidate app rolled back; released fallback app launched; data/cache disposition recorded; protocol handler state inspected; broker login/session proof reference: $BROKER_SESSION_PROOF_REF."
            echo "Candidate app rolled back: /Applications/$BETA_APP_NAME"
            echo "Same-app upgrade: $ROLLBACK_SAME_APP"
            echo "Fallback app launched: $FALLBACK_APP"
            echo "Fallback exact bundle identity verified: true"
            echo "Fallback exact main-process path verified: true"
            echo "Fallback exact main-process dwell seconds: $FALLBACK_LAUNCH_DWELL_SECONDS"
            echo "data/cache disposition: GitHub runner is ephemeral; no user data migrated or deleted beyond beta app bundle removal."
            echo "protocol handler state: evaos-workbench / com.evaos.workbench; see launchservices-protocol-state.txt"
            echo "broker login/session: $BROKER_SESSION_PROOF_REF"
          } > "$PROOF_DIR/rollback-smoke.md"
          echo "RC_ROLLBACK_SUCCEEDED=true" >> "$GITHUB_ENV"

      - name: Finalize and verify RC proof
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || github.token }}
          TAG: ${{ github.event.inputs.tag }}
          EXPECTED_RELEASE_COMMIT: ${{ steps.provenance.outputs.tag_commit }}
          EVAOS_BETA_LOCAL_SIGNED_DMG_FALLBACK_ACK: ${{ github.event.inputs.local_signed_dmg_fallback_ack }}
          EVAOS_BETA_RC_RELEASE_ASSETS_DIR: release-assets
        run: |
          set -euo pipefail
          echo "RC_PHASE=finalize_proof" >> "$GITHUB_ENV"
          {
            echo "Support route: 100yenadmin/evaOS-GUI."
            echo "The released macOS app remains the fallback while beta is gated."
            echo "RC proof artifact: evaos-beta-rc-proof-$TAG"
          } > "$PROOF_DIR/support-notes.md"

          node - "$PROOF_DIR/evaos-beta-rc-proof.json" <<'NODE'
          const fs = require('fs');
          const manifestPath = process.argv[2];
          const manifest = JSON.parse(fs.readFileSync(manifestPath, 'utf8'));
          manifest.checks = manifest.checks.map((check) => ({ ...check, status: 'pass' }));
          manifest.macosX64 = {
            status: 'blocked',
            reason:
              'macOS x64 RC proof is not executed in the macOS arm64 canary; Intel distribution requires a separate signed x64 canary before offering x64 assets to users.',
          };
          fs.writeFileSync(manifestPath, `${JSON.stringify(manifest, null, 2)}\n`);
          NODE

          node scripts/evaosBetaReleaseGate.js verify-rc-proof "$PROOF_DIR" "$TAG"
          echo "RC_PHASE=upload_proof" >> "$GITHUB_ENV"

      - name: Upload RC proof packet
        uses: actions/upload-artifact@v4
        with:
          name: evaos-beta-rc-proof-${{ github.event.inputs.tag }}
          path: rc-proof
          if-no-files-found: error
          retention-days: 90

      - name: Write sanitized RC failure packet
        if: ${{ failure() && steps.prepare_proof.outcome == 'success' }}
        env:
          INSTALL_MUTATION_STARTED: ${{ steps.install_apps.outputs.mutation_started }}
          ROLLBACK_STEP_OUTCOME: ${{ steps.rollback_candidate.outcome }}
        run: |
          set -euo pipefail
          rm -rf rc-failure-proof
          mkdir -p rc-failure-proof
          node - rc-failure-proof/failure-summary.json <<'NODE'
          const fs = require('fs');
          const outputPath = process.argv[2];
          const allowedPhases = new Set([
            'prepare_proof',
            'verify_updater_zip',
            'install_candidate',
            'verify_signing',
            'launch_candidate',
            'pre_canary',
            'connector_start',
            'connector_qa',
            'rollback',
            'finalize_proof',
            'upload_proof',
          ]);
          const allowedReadiness = new Set([
            'not_started',
            'ready',
            'preexisting_state',
            'preexisting_listener',
            'process_exited',
            'token_missing',
            'token_invalid',
            'health_unreachable',
            'qa_failed',
            'cleanup_failed',
          ]);
          const strictBoolean = (name) => {
            const value = process.env[name];
            if (value !== 'true' && value !== 'false') throw new Error(`invalid ${name}`);
            return value === 'true';
          };
          const attempts = Number(process.env.RC_CONNECTOR_ATTEMPTS || '0');
          if (!Number.isInteger(attempts) || attempts < 0 || attempts > 100) {
            throw new Error('invalid connector attempt count');
          }
          const rawExitCode = process.env.RC_CONNECTOR_PROCESS_EXIT_CODE || '';
          const processExitCode = rawExitCode === '' ? null : Number(rawExitCode);
          if (
            processExitCode !== null &&
            (!Number.isInteger(processExitCode) || processExitCode < 0 || processExitCode > 255)
          ) {
            throw new Error('invalid connector process exit code');
          }
          const phase = allowedPhases.has(process.env.RC_PHASE) ? process.env.RC_PHASE : 'unknown';
          const readiness = allowedReadiness.has(process.env.RC_CONNECTOR_READINESS_CLASSIFICATION)
            ? process.env.RC_CONNECTOR_READINESS_CLASSIFICATION
            : 'unknown';
          const payload = {
            schema: 'evaos-beta-rc-sanitized-failure/v1',
            result: 'failed',
            phase,
            applicationMutationStarted: process.env.INSTALL_MUTATION_STARTED === 'true',
            connector: {
              startInvoked: strictBoolean('RC_CONNECTOR_START_INVOKED'),
              processRunningAtReadiness: strictBoolean('RC_CONNECTOR_PROCESS_RUNNING'),
              processExitCode,
              attempts,
              readiness,
              token: {
                exists: strictBoolean('RC_CONNECTOR_TOKEN_EXISTS'),
                regularFile: strictBoolean('RC_CONNECTOR_TOKEN_REGULAR'),
                ownerMatchesRunner: strictBoolean('RC_CONNECTOR_TOKEN_OWNER_MATCH'),
                mode0600: strictBoolean('RC_CONNECTOR_TOKEN_MODE_600'),
                nonempty: strictBoolean('RC_CONNECTOR_TOKEN_NONEMPTY'),
              },
              healthReachable: strictBoolean('RC_CONNECTOR_HEALTH_REACHABLE'),
              qaStarted: strictBoolean('RC_QA_STARTED'),
              qaSucceeded: strictBoolean('RC_QA_SUCCEEDED'),
              cleanupAttempted: strictBoolean('RC_CONNECTOR_CLEANUP_ATTEMPTED'),
              cleanupSucceeded: strictBoolean('RC_CONNECTOR_CLEANUP_SUCCEEDED'),
            },
            rollback: {
              attempted: strictBoolean('RC_ROLLBACK_ATTEMPTED'),
              workbenchCleanupAttempted: strictBoolean('RC_WORKBENCH_CLEANUP_ATTEMPTED'),
              workbenchCleanupSucceeded: strictBoolean('RC_WORKBENCH_CLEANUP_SUCCEEDED'),
              fallbackLaunchVerified: strictBoolean('RC_FALLBACK_LAUNCH_VERIFIED'),
              succeeded:
                strictBoolean('RC_ROLLBACK_SUCCEEDED') && process.env.ROLLBACK_STEP_OUTCOME === 'success',
            },
          };
          fs.writeFileSync(outputPath, `${JSON.stringify(payload, null, 2)}\n`, { mode: 0o600 });
          NODE

      - name: Upload sanitized RC failure packet
        if: ${{ failure() && steps.prepare_proof.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: evaos-beta-rc-failure-${{ github.event.inputs.tag }}
          path: rc-failure-proof
          if-no-files-found: error
          retention-days: 30

      - name: Summary
        if: ${{ always() }}
        env:
          TAG: ${{ github.event.inputs.tag }}
          FALLBACK_REPO: ${{ github.event.inputs.fallback_release_repo }}
          FALLBACK_TAG: ${{ github.event.inputs.fallback_release_tag }}
          JOB_STATUS: ${{ job.status }}
        run: |
          {
            echo "### evaOS Beta RC Canary"
            echo ""
            echo "- Tag: \`${TAG}\`"
            echo "- Fallback release: \`${FALLBACK_REPO}@${FALLBACK_TAG}\`"
            echo "- Result: \`${JOB_STATUS}\`"
            echo "- Proof artifact: \`evaos-beta-rc-proof-${TAG}\`"
            echo "- Sanitized failure artifact (failures only): \`evaos-beta-rc-failure-${TAG}\`"
          } >> "$GITHUB_STEP_SUMMARY"
