name: evaOS Beta RC Canary

on:
  workflow_dispatch:
    inputs:
      beta_rc_ack:
        description: 'Type evaos-beta-rc to acknowledge this canary installs and launches the candidate, then locally starts Full Access and Ask Permission without performing desktop actions.'
        required: true
        type: string
      tag:
        description: 'Existing non-dev evaOS beta release tag to verify.'
        required: true
        type: string
      fallback_release_repo:
        description: 'Repository containing the currently released fallback macOS app.'
        required: true
        type: string
      fallback_release_tag:
        description: 'Release tag for the currently released fallback macOS app.'
        required: true
        type: string
      fallback_asset_pattern:
        description: 'gh release download pattern for the fallback macOS app asset. ZIP and DMG are supported.'
        required: true
        default: '*.zip'
        type: string
      fallback_app_name:
        description: 'Installed fallback app bundle name, for example evaOS Workbench.app.'
        required: true
        type: string
      broker_session_proof_ref:
        description: 'Non-secret issue/packet reference proving broker login/session fallback state.'
        required: true
        type: string
      trusted_manifest_run_id:
        description: 'Optional workflow run id that uploaded the trusted release manifest artifact. Required for local-signed-dmg-fallback releases.'
        required: false
        type: string
      local_signed_dmg_fallback_ack:
        description: 'Type evaos-local-signed-dmg only when verifying locally finalized DMGs.'
        required: false
        default: ''
        type: string
      release_target_platforms:
        description: 'Release target platforms for asset verification: all keeps Windows/macOS/Linux; macos verifies x64+arm64 macOS; macos-arm64 verifies only Apple Silicon macOS.'
        required: false
        default: macos-arm64
        type: choice
        options:
          - all
          - macos
          - macos-arm64

permissions:
  contents: read
  actions: read

env:
  EVAOS_RELEASE_TARGET_PLATFORMS: ${{ inputs.release_target_platforms || vars.EVAOS_RELEASE_TARGET_PLATFORMS || 'macos-arm64' }}

jobs:
  rc-canary:
    name: Signed macOS arm64 RC proof
    runs-on: macos-14
    timeout-minutes: 45
    env:
      BETA_APP_NAME: evaOS Workbench.app
      PROOF_DIR: rc-proof
    steps:
      - name: Validate canary inputs
        env:
          ACK: ${{ github.event.inputs.beta_rc_ack }}
          TAG: ${{ github.event.inputs.tag }}
          BROKER_SESSION_PROOF_REF: ${{ github.event.inputs.broker_session_proof_ref }}
          LOCAL_SIGNED_DMG_FALLBACK_ACK: ${{ github.event.inputs.local_signed_dmg_fallback_ack }}
        run: |
          set -euo pipefail
          if [ "$ACK" != "evaos-beta-rc" ]; then
            echo "::error::Wrong RC canary acknowledgement. Type evaos-beta-rc."
            exit 1
          fi
          if [[ "$TAG" != evaos-beta-* ]]; then
            echo "::error::Refusing non-evaOS beta tag: $TAG"
            exit 1
          fi
          if [[ "$TAG" == *"-dev" || "$TAG" == *"-dev-"* || "$TAG" == *"-dev."* ]]; then
            echo "::error::Refusing development beta tag: $TAG"
            exit 1
          fi
          VERSION="${TAG#evaos-beta-}"
          VERSION="${VERSION#v}"
          if [[ "$VERSION" != *evaos-beta* ]]; then
            echo "::error::Refusing tag without evaos-beta version marker: $TAG"
            exit 1
          fi
          if [ -z "$BROKER_SESSION_PROOF_REF" ] || [[ "$BROKER_SESSION_PROOF_REF" == *"Bearer "* ]]; then
            echo "::error::broker_session_proof_ref must be a non-secret issue or packet reference."
            exit 1
          fi
          if [ -n "$LOCAL_SIGNED_DMG_FALLBACK_ACK" ] && [ "$LOCAL_SIGNED_DMG_FALLBACK_ACK" != "evaos-local-signed-dmg" ]; then
            echo "::error::Wrong local signed DMG fallback acknowledgement. Type evaos-local-signed-dmg."
            exit 1
          fi
          if [ "$(uname -m)" != "arm64" ]; then
            echo "::error::This RC canary is the macOS arm64 proof lane and must run on an arm64 runner."
            exit 1
          fi

      - name: Checkout release refs
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate release branch provenance
        id: provenance
        env:
          TAG: ${{ github.event.inputs.tag }}
          EVAOS_BETA_RELEASE_BRANCH: ${{ vars.EVAOS_BETA_RELEASE_BRANCH }}
        run: |
          set -euo pipefail
          if [ -z "${EVAOS_BETA_RELEASE_BRANCH:-}" ]; then
            echo "::error::EVAOS_BETA_RELEASE_BRANCH must be set before RC proof."
            exit 1
          fi

          git fetch origin "refs/tags/${TAG}:refs/tags/${TAG}" "refs/heads/${EVAOS_BETA_RELEASE_BRANCH}:refs/remotes/origin/${EVAOS_BETA_RELEASE_BRANCH}"
          TAG_COMMIT=$(git rev-list -n 1 "$TAG")
          if ! git merge-base --is-ancestor "$TAG_COMMIT" "origin/${EVAOS_BETA_RELEASE_BRANCH}"; then
            echo "::error::Tag $TAG ($TAG_COMMIT) is not reachable from approved release branch ${EVAOS_BETA_RELEASE_BRANCH}."
            exit 1
          fi

          echo "tag_commit=$TAG_COMMIT" >> $GITHUB_OUTPUT
          echo "Validated $TAG at $TAG_COMMIT against ${EVAOS_BETA_RELEASE_BRANCH}."

      - name: Download release assets
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || github.token }}
          TAG: ${{ github.event.inputs.tag }}
          TRUSTED_MANIFEST_RUN_ID: ${{ github.event.inputs.trusted_manifest_run_id }}
          LOCAL_SIGNED_DMG_FALLBACK_ACK: ${{ github.event.inputs.local_signed_dmg_fallback_ack }}
        run: |
          set -euo pipefail
          mkdir -p release-assets
          case "${EVAOS_RELEASE_TARGET_PLATFORMS}" in
            all)
              patterns=(
                --pattern "*.dmg"
                --pattern "*.exe"
                --pattern "*.msi"
                --pattern "*.deb"
                --pattern "*.zip"
                --pattern "*.yml"
                --pattern "evaos-beta-release-manifest.json"
              )
              ;;
            macos)
              patterns=(
                --pattern "*.dmg"
                --pattern "*.zip"
                --pattern "latest-mac.yml"
                --pattern "latest-arm64-mac.yml"
                --pattern "evaos-beta-release-manifest.json"
              )
              ;;
            macos-arm64)
              patterns=(
                --pattern "*arm64*.dmg"
                --pattern "*arm64*.zip"
                --pattern "latest-arm64-mac.yml"
                --pattern "evaos-beta-release-manifest.json"
              )
              ;;
            *)
              echo "::error::Unsupported EVAOS_RELEASE_TARGET_PLATFORMS: ${EVAOS_RELEASE_TARGET_PLATFORMS}"
              exit 1
              ;;
          esac
          gh release download "$TAG" \
            --repo "${{ github.repository }}" \
            --dir release-assets \
            "${patterns[@]}"
          ls -la release-assets

      - name: Download trusted release manifest artifact
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || github.token }}
          TAG: ${{ github.event.inputs.tag }}
          TRUSTED_MANIFEST_RUN_ID: ${{ github.event.inputs.trusted_manifest_run_id }}
          LOCAL_SIGNED_DMG_FALLBACK_ACK: ${{ github.event.inputs.local_signed_dmg_fallback_ack }}
        run: |
          set -euo pipefail
          if [ ! -f release-assets/evaos-beta-release-manifest.json ]; then
            echo "::error::Release is missing evaOS beta release manifest."
            exit 1
          fi

          RELEASE_RUN_ID=$(node -e "const fs=require('fs'); const m=JSON.parse(fs.readFileSync('release-assets/evaos-beta-release-manifest.json','utf8')); process.stdout.write(String(m.releaseRunId || ''));")
          RELEASE_PROVENANCE_MODE=$(node -e "const fs=require('fs'); const m=JSON.parse(fs.readFileSync('release-assets/evaos-beta-release-manifest.json','utf8')); process.stdout.write(String(m.releaseProvenance?.mode || 'github-release-workflow'));")
          if [ -z "$RELEASE_RUN_ID" ]; then
            echo "::error::Release manifest is missing releaseRunId."
            exit 1
          fi
          DOWNLOAD_RUN_ID="$RELEASE_RUN_ID"
          if [ "$RELEASE_PROVENANCE_MODE" = "local-signed-dmg-fallback" ]; then
            if [ "$LOCAL_SIGNED_DMG_FALLBACK_ACK" != "evaos-local-signed-dmg" ]; then
              echo "::error::Local signed DMG fallback release requires local_signed_dmg_fallback_ack=evaos-local-signed-dmg."
              exit 1
            fi
            if [ -z "$TRUSTED_MANIFEST_RUN_ID" ]; then
              echo "::error::Local signed DMG fallback release requires trusted_manifest_run_id."
              exit 1
            fi
            DOWNLOAD_RUN_ID="$TRUSTED_MANIFEST_RUN_ID"
          fi

          mkdir -p trusted-manifest
          gh run download "$DOWNLOAD_RUN_ID" \
            --repo "${{ github.repository }}" \
            --name "evaos-beta-release-manifest-${TAG}" \
            --dir trusted-manifest
          TRUSTED_MANIFEST_PATH=$(find trusted-manifest -type f -name evaos-beta-release-manifest.json | head -n 1)
          if [ -z "$TRUSTED_MANIFEST_PATH" ]; then
            echo "::error::Trusted manifest artifact did not contain evaos-beta-release-manifest.json."
            exit 1
          fi
          if [ "$TRUSTED_MANIFEST_PATH" != "trusted-manifest/evaos-beta-release-manifest.json" ]; then
            cp "$TRUSTED_MANIFEST_PATH" trusted-manifest/evaos-beta-release-manifest.json
          fi

      - name: Validate release manifest
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || github.token }}
          EXPECTED_RELEASE_COMMIT: ${{ steps.provenance.outputs.tag_commit }}
          EVAOS_BETA_TRUSTED_MANIFEST_PATH: trusted-manifest/evaos-beta-release-manifest.json
          EVAOS_BETA_LOCAL_SIGNED_DMG_FALLBACK_ACK: ${{ github.event.inputs.local_signed_dmg_fallback_ack }}
          EVAOS_RELEASE_TARGET_PLATFORMS: ${{ env.EVAOS_RELEASE_TARGET_PLATFORMS }}
        run: |
          set -euo pipefail
          TAG="${{ github.event.inputs.tag }}"
          VERSION="${TAG#evaos-beta-}"
          VERSION="${VERSION#v}"
          INCLUDE_WEB_CLI_ASSETS=0 MOCK_VERSION="$VERSION" bash scripts/verify-release-assets.sh release-assets
          node scripts/evaosBetaReleaseGate.js verify-manifest release-assets "${{ github.event.inputs.tag }}"

      - name: Download released fallback app
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || github.token }}
          FALLBACK_REPO: ${{ github.event.inputs.fallback_release_repo }}
          FALLBACK_TAG: ${{ github.event.inputs.fallback_release_tag }}
          FALLBACK_PATTERN: ${{ github.event.inputs.fallback_asset_pattern }}
        run: |
          set -euo pipefail
          mkdir -p fallback-assets
          gh release download "$FALLBACK_TAG" \
            --repo "$FALLBACK_REPO" \
            --dir fallback-assets \
            --pattern "$FALLBACK_PATTERN"
          FALLBACK_ASSET=$(find fallback-assets -type f \( -name "*.dmg" -o -name "*.zip" \) | sort | head -n 1)
          if [ -z "$FALLBACK_ASSET" ]; then
            echo "::error::Fallback release did not provide a ZIP or DMG with pattern $FALLBACK_PATTERN."
            exit 1
          fi
          echo "FALLBACK_ASSET=$FALLBACK_ASSET" >> $GITHUB_ENV
          ls -la fallback-assets

      - name: Prepare RC proof directory
        env:
          TAG: ${{ github.event.inputs.tag }}
        run: |
          set -euo pipefail
          rm -rf "$PROOF_DIR"
          mkdir -p "$PROOF_DIR/release-assets" "$PROOF_DIR/trusted-manifest"
          cp release-assets/evaos-beta-release-manifest.json "$PROOF_DIR/release-assets/evaos-beta-release-manifest.json"
          find release-assets -maxdepth 1 -type f -name "*.yml" -exec cp {} "$PROOF_DIR/release-assets/" \;
          cp trusted-manifest/evaos-beta-release-manifest.json "$PROOF_DIR/trusted-manifest/evaos-beta-release-manifest.json"
          node - release-assets/evaos-beta-release-manifest.json "$PROOF_DIR/release-assets/release-assets-reference.json" <<'NODE'
          const fs = require('fs');
          const [manifestPath, outputPath] = process.argv.slice(2);
          const manifest = JSON.parse(fs.readFileSync(manifestPath, 'utf8'));
          const reference = {
            schema: 'evaos-beta-release-assets-reference/v1',
            tag: manifest.tag,
            repository: manifest.repository,
            releaseRunId: manifest.releaseRunId,
            releaseCommit: manifest.releaseCommit,
            assets: (manifest.assets || []).map((asset) => ({
              name: asset.name,
              size: asset.size,
              sha256: asset.sha256,
            })),
          };
          fs.writeFileSync(outputPath, `${JSON.stringify(reference, null, 2)}\n`);
          NODE
          node scripts/evaosBetaReleaseGate.js write-rc-proof-template "$PROOF_DIR" "$TAG"

      - name: Verify updater ZIP signature and notarization
        env:
          TAG: ${{ github.event.inputs.tag }}
          TAG_COMMIT: ${{ steps.provenance.outputs.tag_commit }}
        run: |
          set -euo pipefail
          ZIP_NAME=$(node - release-assets/latest-arm64-mac.yml <<'NODE'
          const fs = require('fs');
          const metadataPath = process.argv[2];
          const text = fs.readFileSync(metadataPath, 'utf8');
          const refs = [];
          for (const line of text.split(/\r?\n/)) {
            const match = line.match(/^\s*(?:-\s*)?(?:path|url):\s*(.+?)\s*$/);
            if (!match) continue;
            let ref = match[1].trim().replace(/^['"]|['"]$/g, '');
            if (/^https?:\/\//i.test(ref)) ref = new URL(ref).pathname.split('/').pop();
            if (ref?.endsWith('.zip')) refs.push(ref);
          }
          const unique = [...new Set(refs)];
          if (unique.length !== 1 || !/arm64/i.test(unique[0])) {
            throw new Error('latest-arm64-mac.yml must identify exactly one arm64 updater ZIP.');
          }
          process.stdout.write(unique[0]);
          NODE
          )
          UPDATER_ZIP="release-assets/$ZIP_NAME"
          if [ ! -f "$UPDATER_ZIP" ]; then
            echo "::error::Updater metadata references missing arm64 ZIP: $ZIP_NAME"
            exit 1
          fi
          EXPECTED_SHA=$(node - release-assets/evaos-beta-release-manifest.json "$ZIP_NAME" <<'NODE'
          const fs = require('fs');
          const [manifestPath, assetName] = process.argv.slice(2);
          const manifest = JSON.parse(fs.readFileSync(manifestPath, 'utf8'));
          const asset = (manifest.assets || []).find((candidate) => candidate.name === assetName);
          if (!asset || !/^[0-9a-f]{64}$/i.test(String(asset.sha256 || ''))) {
            throw new Error(`Trusted manifest does not bind updater ZIP ${assetName}.`);
          }
          process.stdout.write(asset.sha256);
          NODE
          )
          ACTUAL_SHA=$(shasum -a 256 "$UPDATER_ZIP" | awk '{print $1}')
          if [ "$ACTUAL_SHA" != "$EXPECTED_SHA" ]; then
            echo "::error::Updater ZIP checksum does not match the trusted release manifest."
            exit 1
          fi

          EXTRACT_DIR="$RUNNER_TEMP/evaos-updater-zip-arm64"
          rm -rf "$EXTRACT_DIR"
          mkdir -p "$EXTRACT_DIR"
          ditto -x -k "$UPDATER_ZIP" "$EXTRACT_DIR"
          ZIP_APP="$EXTRACT_DIR/$BETA_APP_NAME"
          APP_ROOT_COUNT=$(find "$EXTRACT_DIR" -mindepth 1 -maxdepth 1 -type d -name '*.app' -print | wc -l | tr -d ' ')
          if [ ! -d "$ZIP_APP" ] || [ "$APP_ROOT_COUNT" != "1" ]; then
            echo "::error::Updater ZIP did not contain $BETA_APP_NAME."
            exit 1
          fi
          INFO_PLIST="$ZIP_APP/Contents/Info.plist"
          if [ ! -f "$INFO_PLIST" ]; then
            echo "::error::Updater ZIP is missing the canonical app Info.plist."
            exit 1
          fi
          /usr/libexec/PlistBuddy -c Print "$INFO_PLIST" >/dev/null
          if [[ ! "$TAG" =~ ^evaos-beta-v?([0-9]+\.[0-9]+\.[0-9]+)-evaos-beta(\.[0-9]+)?$ ]]; then
            echo "::error::Unable to derive the updater app version from tag $TAG."
            exit 1
          fi
          EXPECTED_VERSION="${BASH_REMATCH[1]}"
          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$INFO_PLIST")
          PRODUCT_NAME=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleName' "$INFO_PLIST")
          SHORT_VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$INFO_PLIST")
          BUNDLE_VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$INFO_PLIST")
          if [ "$BUNDLE_ID" != "com.evaos.workbench" ] || [ "$PRODUCT_NAME" != "evaOS Workbench" ] || [ "$SHORT_VERSION" != "$EXPECTED_VERSION" ] || [ "$BUNDLE_VERSION" != "$EXPECTED_VERSION" ]; then
            echo "::error::Updater ZIP app identity does not match the RC tag and canonical Workbench identity."
            exit 1
          fi

          codesign --verify --deep --strict --verbose=2 "$ZIP_APP" > "$PROOF_DIR/codesign-updater-zip-macos-arm64.txt" 2>&1
          xcrun stapler validate "$ZIP_APP" > "$PROOF_DIR/stapler-updater-zip-macos-arm64.txt" 2>&1
          spctl --assess --type execute --verbose "$ZIP_APP" > "$PROOF_DIR/spctl-updater-zip-macos-arm64.txt" 2>&1
          node - "$PROOF_DIR/updater-zip-macos-arm64.json" "$TAG" "$TAG_COMMIT" "$ZIP_NAME" "$ACTUAL_SHA" "$BETA_APP_NAME" "$BUNDLE_ID" "$PRODUCT_NAME" "$SHORT_VERSION" "$BUNDLE_VERSION" <<'NODE'
          const fs = require('fs');
          const [outputPath, tag, releaseCommit, assetName, sha256, appName, bundleId, productName, shortVersion, bundleVersion] = process.argv.slice(2);
          fs.writeFileSync(
            outputPath,
            `${JSON.stringify(
              {
                schema: 'evaos-updater-zip-trust/v2',
                tag,
                releaseCommit,
                assetName,
                sha256,
                appName,
                bundleId,
                productName,
                shortVersion,
                bundleVersion,
                codesignVerified: true,
                staplerVerified: true,
                gatekeeperVerified: true,
              },
              null,
              2
            )}\n`
          );
          NODE
          rm -rf "$EXTRACT_DIR"

      - name: Install fallback and beta apps
        env:
          FALLBACK_APP_NAME: ${{ github.event.inputs.fallback_app_name }}
        run: |
          set -euo pipefail
          install_app_from_dmg() {
            local dmg="$1"
            local app_name="$2"
            local mount_dir="$3"

            rm -rf "$mount_dir"
            mkdir -p "$mount_dir"
            hdiutil attach "$dmg" -nobrowse -quiet -mountpoint "$mount_dir"
            local app_path
            app_path=$(find "$mount_dir" -maxdepth 2 -type d -name "$app_name" | head -n 1)
            if [ -z "$app_path" ]; then
              echo "::error::DMG $dmg did not contain $app_name."
              hdiutil detach "$mount_dir" -quiet || true
              exit 1
            fi
            rm -rf "/Applications/$app_name"
            ditto "$app_path" "/Applications/$app_name"
            hdiutil detach "$mount_dir" -quiet
          }

          install_app_from_zip() {
            local zip="$1"
            local app_name="$2"
            local extract_dir="$3"

            rm -rf "$extract_dir"
            mkdir -p "$extract_dir"
            ditto -x -k "$zip" "$extract_dir"
            local app_path
            app_path=$(find "$extract_dir" -maxdepth 4 -type d -name "$app_name" | head -n 1)
            if [ -z "$app_path" ]; then
              echo "::error::ZIP $zip did not contain $app_name."
              exit 1
            fi
            rm -rf "/Applications/$app_name"
            ditto "$app_path" "/Applications/$app_name"
            rm -rf "$extract_dir"
          }

          install_fallback_app() {
            local asset="$1"
            local app_name="$2"

            case "$asset" in
              *.dmg)
                FALLBACK_ASSET_KIND=dmg
                echo "FALLBACK_ASSET_KIND=dmg" >> "$GITHUB_ENV"
                install_app_from_dmg "$asset" "$app_name" "$RUNNER_TEMP/fallback-dmg"
                ;;
              *.zip)
                FALLBACK_ASSET_KIND=zip
                echo "FALLBACK_ASSET_KIND=zip" >> "$GITHUB_ENV"
                install_app_from_zip "$asset" "$app_name" "$RUNNER_TEMP/fallback-zip"
                ;;
              *)
                echo "::error::Unsupported fallback asset type: $asset"
                exit 1
                ;;
            esac
          }

          install_fallback_app "$FALLBACK_ASSET" "$FALLBACK_APP_NAME"

          SAME_APP_UPGRADE=false
          if [ "$FALLBACK_APP_NAME" = "$BETA_APP_NAME" ]; then
            SAME_APP_UPGRADE=true
          fi
          echo "SAME_APP_UPGRADE=$SAME_APP_UPGRADE" >> "$GITHUB_ENV"
          FALLBACK_REINSTALL_REQUIRED=false
          if [ "$SAME_APP_UPGRADE" != "true" ] && [ "$FALLBACK_APP_NAME" = "evaOS Workbench Beta.app" ]; then
            FALLBACK_REINSTALL_REQUIRED=true
          fi
          echo "FALLBACK_REINSTALL_REQUIRED=$FALLBACK_REINSTALL_REQUIRED" >> "$GITHUB_ENV"

          BETA_DMG=$(find release-assets \( -name "*mac-arm64*.dmg" -o -name "*arm64*.dmg" \) -type f | sort | head -n 1)
          if [ -z "$BETA_DMG" ]; then
            echo "::error::Release assets do not include a macOS arm64 DMG."
            exit 1
          fi
          install_app_from_dmg "$BETA_DMG" "$BETA_APP_NAME" "$RUNNER_TEMP/beta-dmg"

          if [ "$SAME_APP_UPGRADE" != "true" ] && [ ! -d "/Applications/$FALLBACK_APP_NAME" ]; then
            echo "::error::Installing beta removed the released fallback app."
            exit 1
          fi
          if [ "$FALLBACK_REINSTALL_REQUIRED" = "true" ]; then
            rm -rf "/Applications/$FALLBACK_APP_NAME"
          fi
          if [ ! -d "/Applications/$BETA_APP_NAME" ]; then
            echo "::error::Beta app did not install."
            exit 1
          fi

          {
            if [ "$SAME_APP_UPGRADE" = "true" ]; then
              echo "PASS: beta DMG copied to /Applications/$BETA_APP_NAME as a same-app upgrade over the released fallback app."
            else
              echo "PASS: beta DMG copied to /Applications/$BETA_APP_NAME without replacing the released fallback app."
            fi
            echo "Fallback app: /Applications/$FALLBACK_APP_NAME"
            echo "Fallback asset: $FALLBACK_ASSET"
            echo "Fallback asset kind: ${FALLBACK_ASSET_KIND:-unknown}"
            echo "Beta app: /Applications/$BETA_APP_NAME"
            echo "Same-app upgrade: $SAME_APP_UPGRADE"
            echo "Fallback reinstall required: $FALLBACK_REINSTALL_REQUIRED"
          } > "$PROOF_DIR/install-smoke.md"

      - name: Verify signing and Gatekeeper
        run: |
          set -euo pipefail
          BETA_APP="/Applications/$BETA_APP_NAME"
          BETA_DMG=$(find release-assets \( -name "*mac-arm64*.dmg" -o -name "*arm64*.dmg" \) -type f | sort | head -n 1)
          if [ -z "$BETA_DMG" ]; then
            echo "::error::Release assets do not include a macOS arm64 DMG."
            exit 1
          fi
          codesign --verify --verbose=2 "$BETA_DMG" > "$PROOF_DIR/codesign-dmg-macos-arm64.txt" 2>&1
          xcrun stapler validate "$BETA_DMG" > "$PROOF_DIR/stapler-dmg-macos-arm64.txt" 2>&1
          spctl --assess --type open --context context:primary-signature --verbose "$BETA_DMG" > "$PROOF_DIR/spctl-dmg-macos-arm64.txt" 2>&1
          codesign --verify --deep --strict --verbose=2 "$BETA_APP" > "$PROOF_DIR/codesign-macos-arm64.txt" 2>&1
          xcrun stapler validate "$BETA_APP" > "$PROOF_DIR/stapler-macos-arm64.txt" 2>&1
          spctl --assess --type execute --verbose "$BETA_APP" > "$PROOF_DIR/spctl-macos-arm64.txt" 2>&1

      - name: Launch beta and audit feed isolation
        env:
          TAG_COMMIT: ${{ steps.provenance.outputs.tag_commit }}
        run: |
          set -euo pipefail
          BETA_APP="/Applications/$BETA_APP_NAME"
          BETA_PLIST="$BETA_APP/Contents/Info.plist"
          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$BETA_PLIST")
          PRODUCT_NAME=$(/usr/libexec/PlistBuddy -c 'Print CFBundleName' "$BETA_PLIST")
          SHORT_VERSION=$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$BETA_PLIST")
          BUNDLE_VERSION=$(/usr/libexec/PlistBuddy -c 'Print CFBundleVersion' "$BETA_PLIST")

          if [ "$BETA_APP" != "/Applications/evaOS Workbench.app" ]; then
            echo "::error::RC canary must install the candidate at /Applications/evaOS Workbench.app, got $BETA_APP"
            exit 1
          fi
          if [ "$BUNDLE_ID" != "com.evaos.workbench" ]; then
            echo "::error::Unexpected beta bundle id: $BUNDLE_ID"
            exit 1
          fi
          if [ "$PRODUCT_NAME" != "evaOS Workbench" ]; then
            echo "::error::Unexpected beta product name: $PRODUCT_NAME"
            exit 1
          fi
          if [[ ! "$SHORT_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::CFBundleShortVersionString must be numeric X.Y.Z, got $SHORT_VERSION"
            exit 1
          fi
          if [[ ! "$BUNDLE_VERSION" =~ ^[0-9]+(\.[0-9]+){0,2}$ ]]; then
            echo "::error::CFBundleVersion must be numeric, got $BUNDLE_VERSION"
            exit 1
          fi

          URL_SCHEMES=$(node - "$BETA_PLIST" <<'NODE'
          const { execFileSync } = require('child_process');
          const plistPath = process.argv[2];
          const raw = execFileSync('/usr/bin/plutil', ['-extract', 'CFBundleURLTypes', 'json', '-o', '-', plistPath], {
            encoding: 'utf8',
          });
          const urlTypes = JSON.parse(raw);
          const schemes = urlTypes.flatMap((entry) =>
            Array.isArray(entry.CFBundleURLSchemes) ? entry.CFBundleURLSchemes : []
          );
          process.stdout.write(schemes.join('\n'));
          NODE
          )
          if ! printf '%s\n' "$URL_SCHEMES" | grep -Fx 'evaos-workbench' >/dev/null; then
            echo "::error::Installed app does not declare evaos-workbench protocol scheme."
            printf '%s\n' "$URL_SCHEMES"
            exit 1
          fi
          if printf '%s\n' "$URL_SCHEMES" | grep -Fx 'evaos-workbench-beta' >/dev/null; then
            echo "::error::Installed app still declares stale evaos-workbench-beta protocol scheme."
            exit 1
          fi
          if [ -d "/Applications/evaOS Workbench Beta.app" ]; then
            echo "::error::Stale /Applications/evaOS Workbench Beta.app exists in RC canary."
            exit 1
          fi
          STALE_INDEXED_APPS="$(mdfind 'kMDItemCFBundleIdentifier == "com.evaos.workbench.beta"' || true)"
          if printf '%s\n' "$STALE_INDEXED_APPS" | grep -F '/Volumes/LEXAR/Codex/' >/dev/null; then
            echo "::error::Spotlight indexes stale Workbench beta apps under /Volumes/LEXAR/Codex."
            printf '%s\n' "$STALE_INDEXED_APPS"
            exit 1
          fi

          node - "$BETA_APP/Contents/Resources" "$RUNNER_TEMP/upstream-feed-grep.txt" <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const root = process.argv[2];
          const output = process.argv[3];
          const matches = [];
          const pattern = /github\.com\/iOfficeAI\/AionUi|iOfficeAI\/AionUi|aionui\.com/i;

          function walk(dir) {
            for (const name of fs.readdirSync(dir)) {
              const file = path.join(dir, name);
              const stat = fs.statSync(file);
              if (stat.isDirectory()) {
                if (name === 'Frameworks') continue;
                if (name === 'bundled-aioncore') continue;
                walk(file);
                continue;
              }
              if (!stat.isFile() || name.endsWith('.node') || stat.size > 100 * 1024 * 1024) continue;
              const text = fs.readFileSync(file, 'utf8');
              if (pattern.test(text)) matches.push(file);
            }
          }

          walk(root);
          fs.writeFileSync(output, matches.join('\n'));
          if (matches.length > 0) {
            console.error(`Beta app bundle still references upstream AionUi feed/support text:\n${matches.join('\n')}`);
            process.exit(1);
          }
          NODE

          open -n "$BETA_APP"
          sleep 8
          if ! pgrep -f "EvaOSWorkbench|evaOS Workbench" > /dev/null; then
            echo "::error::Beta app did not launch a detectable process."
            exit 1
          fi
          STALE_RUNNING_APPS="$(ps -axo pid=,command= | grep -E '/Volumes/LEXAR/Codex/.+\\.app/Contents/MacOS/(evaOS Workbench|EvaOSWorkbench)' || true)"
          if [ -n "$STALE_RUNNING_APPS" ]; then
            echo "::error::Stale Workbench app process is running from a Lexar proof/extract path."
            printf '%s\n' "$STALE_RUNNING_APPS"
            exit 1
          fi

          BRIDGE_COMMAND="$BETA_APP/Contents/Resources/Bridge/evaos-desktop-bridge"
          if [ ! -x "$BRIDGE_COMMAND" ]; then
            echo "::error::Installed Workbench bridge launcher is missing or not executable."
            exit 1
          fi
          PRE_CANARY_DIR="$PROOF_DIR/installed-candidate-pre-canary"
          CONNECTOR_CANARY_DIR="$PROOF_DIR/installed-candidate-connector"
          rm -rf "$PRE_CANARY_DIR" "$CONNECTOR_CANARY_DIR"
          "$BRIDGE_COMMAND" pre-canary \
            --json \
            --control-surface bridge-peekaboo \
            --expected-version "$SHORT_VERSION" \
            --expected-build "$BUNDLE_VERSION" \
            --expected-source-commit "$TAG_COMMIT" \
            --artifact-dir "$PRE_CANARY_DIR" \
            > "$PROOF_DIR/installed-candidate-pre-canary.stdout.json" \
            2> "$PROOF_DIR/installed-candidate-pre-canary.stderr.txt"
          cp "$PRE_CANARY_DIR/qa-report.json" "$PROOF_DIR/installed-candidate-pre-canary.json"

          TOKEN_FILE="$HOME/Library/Application Support/evaos-desktop-bridge/connector.token"
          for _attempt in $(seq 1 30); do
            if [ -s "$TOKEN_FILE" ] && curl --fail --silent --show-error --max-time 2 http://127.0.0.1:8765/health >/dev/null; then
              break
            fi
            sleep 1
          done
          if [ ! -s "$TOKEN_FILE" ]; then
            echo "::error::Installed Workbench did not create its connector token."
            exit 1
          fi
          if ! curl --fail --silent --show-error --max-time 2 http://127.0.0.1:8765/health >/dev/null; then
            echo "::error::Installed Workbench connector did not become reachable."
            exit 1
          fi
          CONNECTOR_TOKEN=$(tr -d '\r\n' < "$TOKEN_FILE")
          if [ -z "$CONNECTOR_TOKEN" ]; then
            echo "::error::Installed Workbench connector token is empty."
            exit 1
          fi
          set +e
          EVAOS_DESKTOP_BRIDGE_TOKEN="$CONNECTOR_TOKEN" "$BRIDGE_COMMAND" qa-canary \
            --connector-url http://127.0.0.1:8765 \
            --artifact-dir "$CONNECTOR_CANARY_DIR" \
            --version-under-test "$SHORT_VERSION" \
            --build-under-test "$BUNDLE_VERSION" \
            --source-commit-under-test "$TAG_COMMIT" \
            --surface connector \
            --suite control_start \
            --operator-ack-live-control \
            > "$PROOF_DIR/installed-candidate-connector.stdout.json" \
            2> "$PROOF_DIR/installed-candidate-connector.stderr.txt"
          QA_CANARY_EXIT=$?
          set -e
          if [ -f "$CONNECTOR_CANARY_DIR/qa-report.json" ]; then
            cp "$CONNECTOR_CANARY_DIR/qa-report.json" "$PROOF_DIR/installed-candidate-connector.json"
          fi
          TOKEN_SCAN_EXIT=0
          LC_ALL=C grep -R -F -- "$CONNECTOR_TOKEN" "$PROOF_DIR" >/dev/null 2>&1 || TOKEN_SCAN_EXIT=$?
          if [ "$TOKEN_SCAN_EXIT" -eq 0 ]; then
            echo "::error::Installed candidate proof leaked the connector token."
            unset CONNECTOR_TOKEN
            exit 1
          fi
          if [ "$TOKEN_SCAN_EXIT" -ne 1 ]; then
            echo "::error::Installed candidate proof token scan could not complete safely."
            unset CONNECTOR_TOKEN
            exit 1
          fi
          unset CONNECTOR_TOKEN
          if [ "$QA_CANARY_EXIT" -ne 0 ]; then
            echo "::error::Installed candidate connector canary failed; inspect the sanitized proof artifact."
            exit 1
          fi
          pkill -f "EvaOSWorkbench|evaOS Workbench" || true

          {
            echo "PASS: evaOS Workbench launched with stable Workbench identity and no upstream AionUi feed."
            echo "Bundle id: $BUNDLE_ID"
            echo "Product name: $PRODUCT_NAME"
            echo "Short version: $SHORT_VERSION"
            echo "Bundle version: $BUNDLE_VERSION"
            echo "Protocol scheme: evaos-workbench"
          } > "$PROOF_DIR/launch-smoke.md"

          {
            echo "PASS: protocol scheme evaos-workbench is declared by com.evaos.workbench."
            echo "Bundle id: $BUNDLE_ID"
            echo "Protocol scheme: evaos-workbench"
            echo "Declared schemes:"
            printf '%s\n' "$URL_SCHEMES"
          } > "$PROOF_DIR/protocol-identity.md"

          {
            echo "PASS: exact app path /Applications/evaOS Workbench.app used for RC canary install and launch."
            echo "PASS: no stale indexed Workbench apps under Lexar proof trees."
            echo "PASS: no stale running Workbench apps outside /Applications/evaOS Workbench.app."
            echo "PASS: Computer Use exact path rule recorded; signed installed-app product proof must still target /Applications/evaOS Workbench.app."
            echo "PASS: OpenClaw bridge tools selected unless Computer Use is explicitly mounted in that runtime."
          } > "$PROOF_DIR/installed-app-path-hygiene.md"

          {
            echo "PASS: update repo is 100yenadmin/evaOS-GUI and iOfficeAI/AionUi blocked for beta assets."
            echo "Artifact grep found no upstream feed/support references in app resources."
          } > "$PROOF_DIR/updater-feed-audit.md"

      - name: Roll back beta and verify fallback
        env:
          FALLBACK_APP_NAME: ${{ github.event.inputs.fallback_app_name }}
          BROKER_SESSION_PROOF_REF: ${{ github.event.inputs.broker_session_proof_ref }}
        run: |
          set -euo pipefail
          FALLBACK_APP="/Applications/$FALLBACK_APP_NAME"
          BETA_APP="/Applications/$BETA_APP_NAME"

          install_app_from_dmg() {
            local dmg="$1"
            local app_name="$2"
            local mount_dir="$3"

            rm -rf "$mount_dir"
            mkdir -p "$mount_dir"
            hdiutil attach "$dmg" -nobrowse -quiet -mountpoint "$mount_dir"
            local app_path
            app_path=$(find "$mount_dir" -maxdepth 2 -type d -name "$app_name" | head -n 1)
            if [ -z "$app_path" ]; then
              echo "::error::Fallback DMG $dmg did not contain $app_name."
              hdiutil detach "$mount_dir" -quiet || true
              exit 1
            fi
            rm -rf "/Applications/$app_name"
            ditto "$app_path" "/Applications/$app_name"
            hdiutil detach "$mount_dir" -quiet
          }

          install_app_from_zip() {
            local zip="$1"
            local app_name="$2"
            local extract_dir="$3"

            rm -rf "$extract_dir"
            mkdir -p "$extract_dir"
            ditto -x -k "$zip" "$extract_dir"
            local app_path
            app_path=$(find "$extract_dir" -maxdepth 4 -type d -name "$app_name" | head -n 1)
            if [ -z "$app_path" ]; then
              echo "::error::Fallback ZIP $zip did not contain $app_name."
              exit 1
            fi
            rm -rf "/Applications/$app_name"
            ditto "$app_path" "/Applications/$app_name"
          }

          rm -rf "$BETA_APP"
          if [ "${SAME_APP_UPGRADE:-false}" = "true" ] || [ "${FALLBACK_REINSTALL_REQUIRED:-false}" = "true" ]; then
            case "${FALLBACK_ASSET:-}" in
              *.dmg)
                install_app_from_dmg "$FALLBACK_ASSET" "$FALLBACK_APP_NAME" "$RUNNER_TEMP/rollback-fallback-dmg"
                ;;
              *.zip)
                install_app_from_zip "$FALLBACK_ASSET" "$FALLBACK_APP_NAME" "$RUNNER_TEMP/rollback-fallback-zip"
                ;;
              *)
                echo "::error::Unsupported fallback asset for rollback reinstall: ${FALLBACK_ASSET:-missing}"
                exit 1
                ;;
            esac
          else
            if [ -d "$BETA_APP" ]; then
              echo "::error::Beta app is still present after rollback removal."
              exit 1
            fi
          fi

          if [ ! -d "$FALLBACK_APP" ]; then
            echo "::error::Released fallback app is missing after rollback."
            exit 1
          fi

          open -n "$FALLBACK_APP"
          sleep 8
          if ! pgrep -f "${FALLBACK_APP_NAME%.app}" > /dev/null; then
            echo "::error::Released fallback app did not launch after beta removal."
            exit 1
          fi
          pkill -f "${FALLBACK_APP_NAME%.app}" || true

          /System/Library/Frameworks/CoreServices.framework/Frameworks/LaunchServices.framework/Support/lsregister -dump \
            | grep -Ei "evaos|workbench|${FALLBACK_APP_NAME%.app}" \
            > "$PROOF_DIR/launchservices-protocol-state.txt" || true

          {
            echo "PASS: candidate app rolled back; released fallback app launched; data/cache disposition recorded; protocol handler state inspected; broker login/session proof reference: $BROKER_SESSION_PROOF_REF."
            echo "Candidate app rolled back: /Applications/$BETA_APP_NAME"
            echo "Same-app upgrade: ${SAME_APP_UPGRADE:-false}"
            echo "Fallback app launched: $FALLBACK_APP"
            echo "data/cache disposition: GitHub runner is ephemeral; no user data migrated or deleted beyond beta app bundle removal."
            echo "protocol handler state: evaos-workbench / com.evaos.workbench; see launchservices-protocol-state.txt"
            echo "broker login/session: $BROKER_SESSION_PROOF_REF"
          } > "$PROOF_DIR/rollback-smoke.md"

      - name: Finalize and verify RC proof
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || github.token }}
          TAG: ${{ github.event.inputs.tag }}
          EXPECTED_RELEASE_COMMIT: ${{ steps.provenance.outputs.tag_commit }}
          EVAOS_BETA_LOCAL_SIGNED_DMG_FALLBACK_ACK: ${{ github.event.inputs.local_signed_dmg_fallback_ack }}
          EVAOS_BETA_RC_RELEASE_ASSETS_DIR: release-assets
        run: |
          set -euo pipefail
          {
            echo "Support route: 100yenadmin/evaOS-GUI."
            echo "The released macOS app remains the fallback while beta is gated."
            echo "RC proof artifact: evaos-beta-rc-proof-$TAG"
          } > "$PROOF_DIR/support-notes.md"

          node - "$PROOF_DIR/evaos-beta-rc-proof.json" <<'NODE'
          const fs = require('fs');
          const manifestPath = process.argv[2];
          const manifest = JSON.parse(fs.readFileSync(manifestPath, 'utf8'));
          manifest.checks = manifest.checks.map((check) => ({ ...check, status: 'pass' }));
          manifest.macosX64 = {
            status: 'blocked',
            reason:
              'macOS x64 RC proof is not executed in the macOS arm64 canary; Intel distribution requires a separate signed x64 canary before offering x64 assets to users.',
          };
          fs.writeFileSync(manifestPath, `${JSON.stringify(manifest, null, 2)}\n`);
          NODE

          node scripts/evaosBetaReleaseGate.js verify-rc-proof "$PROOF_DIR" "$TAG"

      - name: Upload RC proof packet
        uses: actions/upload-artifact@v4
        with:
          name: evaos-beta-rc-proof-${{ github.event.inputs.tag }}
          path: rc-proof
          if-no-files-found: error
          retention-days: 90

      - name: Summary
        env:
          TAG: ${{ github.event.inputs.tag }}
          FALLBACK_REPO: ${{ github.event.inputs.fallback_release_repo }}
          FALLBACK_TAG: ${{ github.event.inputs.fallback_release_tag }}
        run: |
          {
            echo "### evaOS Beta RC Canary"
            echo ""
            echo "- Tag: \`${TAG}\`"
            echo "- Fallback release: \`${FALLBACK_REPO}@${FALLBACK_TAG}\`"
            echo "- Proof artifact: \`evaos-beta-rc-proof-${TAG}\`"
          } >> $GITHUB_STEP_SUMMARY
