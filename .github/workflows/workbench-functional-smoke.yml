name: Workbench Functional Smoke

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to build
        required: true
        default: evaos/beta-rc-20260612
        type: string
      run_guardrails:
        description: Run evaOS guardrail audits before packaging
        required: false
        default: true
        type: boolean
      bridge_ref:
        description: evaos-desktop-bridge ref to bundle; defaults to EVAOS_DESKTOP_BRIDGE_SOURCE_REF repo variable
        required: false
        default: ''
        type: string

concurrency:
  group: workbench-functional-smoke-${{ github.event.inputs.ref }}
  cancel-in-progress: true

env:
  BUN_INSTALL_REGISTRY: https://registry.npmjs.org/
  CI: true
  CSC_IDENTITY_AUTO_DISCOVERY: false
  EVAOS_BETA_PUBLIC_RELEASE: 'false'
  EVAOS_BETA_REQUIRE_SIGNING: 'false'
  EVAOS_FINALIZE_MAC_DMG: 'false'
  EVAOS_DMG_CODESIGN: 'false'
  ELECTRON_BUILDER_COMPRESSION_LEVEL: '1'
  NODE_OPTIONS: '--max-old-space-size=8192'
  PEEKABOO_VERSION: '3.8.0'
  PEEKABOO_ASSET: 'peekaboo-macos-universal.tar.gz'
  PEEKABOO_SHA256: '5be06117ed861ac7a87ea1d1e552122db4231bf2cd618ec516d77c66acd39620'
  PEEKABOO_BINARY_SHA256: '4a5c7e28c263c84e406aa1853ef62cad3042b13f40a7a9e044ec74ec42933383'
  PEEKABOO_LICENSE_SHA256: '62316704df7426e5a79d2827ff8aca36e9abb3a73b8e68557030749ebefec667'
  PYTHON_RUNTIME_VERSION: '3.12.13'
  PYTHON_RUNTIME_RELEASE: '20260510'
  PYTHON_RUNTIME_ARM64_SHA256: '5a30271f8d345a5b02b0c9e4e31e0f1e1455a8e4a04fba95cd9762472abc3b17'
  PYTHON_RUNTIME_X64_SHA256: 'cd369e76973c3179bc578230d8615ab621968ed758c5e32f636eecef4ad79894'
  WORKBENCH_SMOKE_BRIDGE_REF: ${{ inputs.bridge_ref || vars.EVAOS_DESKTOP_BRIDGE_SOURCE_REF }}
  WORKBENCH_SMOKE_REF: ${{ inputs.ref }}

jobs:
  macos-arm64-app:
    name: macOS arm64 unpacked app
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Commit info
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          SHORT="$(git rev-parse --short HEAD)"
          echo "short=$SHORT" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Validate immutable bridge ref
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$WORKBENCH_SMOKE_BRIDGE_REF" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::Workbench functional smoke requires a full immutable evaos-desktop-bridge commit SHA."
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache Electron artifacts
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/.cache/electron
            ${{ runner.temp }}/.cache/electron-builder
            ~/.cache/electron
            ~/.cache/electron-builder
          key: workbench-functional-smoke-electron-arm64-${{ hashFiles('package.json', 'bun.lock') }}
          restore-keys: |
            workbench-functional-smoke-electron-arm64-

      - name: Install dependencies
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 10
          max_attempts: 3
          retry_wait_seconds: 30
          command: bun install --frozen-lockfile

      - name: Run postinstall
        run: bun run postinstall || true

      - name: Rebuild native modules for Electron
        run: bunx electron-builder install-app-deps
        env:
          npm_config_runtime: electron
          npm_config_disturl: https://electronjs.org/headers
          ELECTRON_CACHE: ${{ runner.temp }}/.cache/electron
          ELECTRON_BUILDER_CACHE: ${{ runner.temp }}/.cache/electron-builder

      - name: Install pinned Peekaboo fallback
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="${RUNNER_TEMP}/${PEEKABOO_ASSET}"
          TOOL_DIR="${RUNNER_TEMP}/peekaboo-${PEEKABOO_VERSION}"
          URL="https://github.com/openclaw/Peekaboo/releases/download/v${PEEKABOO_VERSION}/${PEEKABOO_ASSET}"
          curl --fail --location --retry 3 --output "$ARCHIVE" "$URL"
          printf '%s  %s\n' "$PEEKABOO_SHA256" "$ARCHIVE" | shasum -a 256 -c -
          mkdir -p "$TOOL_DIR"
          tar -xzf "$ARCHIVE" -C "$TOOL_DIR"
          PEEKABOO_BIN="$(find "$TOOL_DIR" -type f -name peekaboo -perm -111 -print -quit)"
          PEEKABOO_LICENSE="$(find "$TOOL_DIR" -type f -name LICENSE -print -quit)"
          if [ -z "$PEEKABOO_BIN" ] || [ ! -x "$PEEKABOO_BIN" ]; then
            echo "::error::Pinned Peekaboo helper asset did not contain an executable binary."
            exit 1
          fi
          if [ -z "$PEEKABOO_LICENSE" ] || [ ! -f "$PEEKABOO_LICENSE" ]; then
            echo "::error::Pinned Peekaboo helper asset did not contain its license notice."
            exit 1
          fi
          printf '%s  %s\n' "$PEEKABOO_BINARY_SHA256" "$PEEKABOO_BIN" | shasum -a 256 -c -
          printf '%s  %s\n' "$PEEKABOO_LICENSE_SHA256" "$PEEKABOO_LICENSE" | shasum -a 256 -c -
          case "$("$PEEKABOO_BIN" --version)" in
            "Peekaboo ${PEEKABOO_VERSION}"*) ;;
            *)
              echo "::error::Pinned Peekaboo helper reported an unexpected version."
              exit 1
              ;;
          esac
          {
            echo "EVAOS_PEEKABOO_BIN=$PEEKABOO_BIN"
            echo "EVAOS_PEEKABOO_LICENSE=$PEEKABOO_LICENSE"
            echo "EVAOS_REQUIRED_PEEKABOO_VERSION=$PEEKABOO_VERSION"
            echo "EVAOS_REQUIRED_PEEKABOO_SOURCE_SHA256=$PEEKABOO_BINARY_SHA256"
          } >> "$GITHUB_ENV"

      - name: Install pinned desktop bridge Python runtime
        shell: bash
        run: |
          set -euo pipefail
          scripts/prepareEvaosDesktopBridgePythonRuntime.sh arm64 "$GITHUB_ENV"

      - name: evaOS guardrail audit
        if: ${{ inputs.run_guardrails }}
        shell: bash
        run: |
          set -euo pipefail
          node scripts/evaosBetaReleaseGate.js audit-config
          node scripts/evaosUpstreamGuardrailAudit.js

      - name: Build unpacked app only
        shell: bash
        env:
          AIONUI_MANAGED_RESOURCES_BUNDLE: no-acp
          EVAOS_DESKTOP_BRIDGE_DISABLE_DEFAULT_CANDIDATES: '1'
          EVAOS_DESKTOP_BRIDGE_SOURCE_REF: ${{ env.WORKBENCH_SMOKE_BRIDGE_REF }}
          EVAOS_DESKTOP_BRIDGE_SOURCE_TOKEN: ${{ secrets.EVAOS_DESKTOP_BRIDGE_SOURCE_TOKEN || secrets.GH_TOKEN || secrets.GITHUB_TOKEN || github.token }}
        run: |
          set -euo pipefail
          echo "NODE_OPTIONS=${NODE_OPTIONS:-}"
          node scripts/build-with-builder.js arm64 --mac dir --arm64

      - name: Verify functional-smoke artifact shape
        id: verify
        shell: bash
        env:
          WORKBENCH_SMOKE_SHA: ${{ steps.commit.outputs.sha }}
        run: |
          set -euo pipefail
          APP_PATH="$(find out -type d -name '*.app' -print -quit)"
          if [ -z "$APP_PATH" ]; then
            echo "::error::No .app produced under out/"
            find out -maxdepth 3 -print || true
            exit 1
          fi

          BRIDGE="$APP_PATH/Contents/Resources/Bridge/evaos-desktop-bridge"
          BRIDGE_PEEKABOO="$APP_PATH/Contents/Resources/Bridge/bin/peekaboo"
          BRIDGE_HELPER="$APP_PATH/Contents/Resources/Bridge/bin/evaos-connector-helper"
          BRIDGE_PEEKABOO_LICENSE="$APP_PATH/Contents/Resources/Bridge/licenses/Peekaboo-LICENSE.txt"
          BRIDGE_MANIFEST="$APP_PATH/Contents/Resources/Bridge/manifest.json"
          BRIDGE_PYTHON="$APP_PATH/Contents/Resources/Bridge/python/bin/python3"
          BRIDGE_PYTHON_LICENSE="$APP_PATH/Contents/Resources/Bridge/licenses/CPython-LICENSE.txt"
          AIONCORE_DIR="$APP_PATH/Contents/Resources/bundled-aioncore"
          HUB_DIR="$APP_PATH/Contents/Resources/hub"

          test -x "$BRIDGE"
          test -x "$BRIDGE_PEEKABOO"
          test -x "$BRIDGE_HELPER"
          test -f "$BRIDGE_PEEKABOO_LICENSE"
          test -f "$BRIDGE_MANIFEST"
          test -x "$BRIDGE_PYTHON"
          test -f "$BRIDGE_PYTHON_LICENSE"
          test -d "$AIONCORE_DIR"
          test -d "$HUB_DIR"

          BUNDLE_ID="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP_PATH/Contents/Info.plist")"
          VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP_PATH/Contents/Info.plist")"
          BRIDGE_VERSION="$(node -e "const fs=require('fs'); const m=JSON.parse(fs.readFileSync(process.argv[1], 'utf8')); console.log(m.sourceCommit || m.commit || m.version || 'unknown')" "$BRIDGE_MANIFEST")"
          BUNDLED_PEEKABOO_VERSION="$(node -e "const fs=require('fs'); const m=JSON.parse(fs.readFileSync(process.argv[1], 'utf8')); console.log(m.bundledTools?.peekaboo?.version || 'unknown')" "$BRIDGE_MANIFEST")"
          BUNDLED_PEEKABOO_SOURCE_SHA256="$(node -e "const fs=require('fs'); const m=JSON.parse(fs.readFileSync(process.argv[1], 'utf8')); console.log(m.bundledTools?.peekaboo?.sourceSha256 || 'unknown')" "$BRIDGE_MANIFEST")"
          BUNDLED_PEEKABOO_LICENSE="$(node -e "const fs=require('fs'); const m=JSON.parse(fs.readFileSync(process.argv[1], 'utf8')); console.log(m.bundledTools?.peekaboo?.license || 'unknown')" "$BRIDGE_MANIFEST")"
          BUNDLED_PEEKABOO_LICENSE_PATH="$(node -e "const fs=require('fs'); const m=JSON.parse(fs.readFileSync(process.argv[1], 'utf8')); console.log(m.bundledTools?.peekaboo?.licensePath || 'unknown')" "$BRIDGE_MANIFEST")"
          BUNDLED_PEEKABOO_LICENSE_SHA256="$(node -e "const fs=require('fs'); const m=JSON.parse(fs.readFileSync(process.argv[1], 'utf8')); console.log(m.bundledTools?.peekaboo?.licenseSha256 || 'unknown')" "$BRIDGE_MANIFEST")"
          PACKAGED_PEEKABOO_SHA256="$(shasum -a 256 "$BRIDGE_PEEKABOO" | awk '{print $1}')"
          ACTUAL_PEEKABOO_LICENSE_SHA256="$(shasum -a 256 "$BRIDGE_PEEKABOO_LICENSE" | awk '{print $1}')"
          BUNDLED_PYTHON_VERSION="$(node -e "const fs=require('fs'); const m=JSON.parse(fs.readFileSync(process.argv[1], 'utf8')); console.log(m.bundledTools?.python?.version || 'unknown')" "$BRIDGE_MANIFEST")"
          BUNDLED_PYTHON_SOURCE_SHA256="$(node -e "const fs=require('fs'); const m=JSON.parse(fs.readFileSync(process.argv[1], 'utf8')); console.log(m.bundledTools?.python?.sourceSha256 || 'unknown')" "$BRIDGE_MANIFEST")"

          if [ "$BRIDGE_VERSION" != "$WORKBENCH_SMOKE_BRIDGE_REF" ]; then
            echo "::error::Bundled bridge manifest ($BRIDGE_VERSION) does not match requested bridge ref ($WORKBENCH_SMOKE_BRIDGE_REF)"
            exit 1
          fi
          if [ "$BUNDLED_PEEKABOO_VERSION" != "$PEEKABOO_VERSION" ]; then
            echo "::error::Bundled Peekaboo version ($BUNDLED_PEEKABOO_VERSION) does not match expected version ($PEEKABOO_VERSION)"
            exit 1
          fi
          case "$("$BRIDGE_PEEKABOO" --version)" in
            "Peekaboo ${PEEKABOO_VERSION}"*) ;;
            *)
              echo "::error::Packaged Peekaboo helper reported an unexpected version."
              exit 1
              ;;
          esac
          codesign --verify --strict "$BRIDGE_PEEKABOO"
          if [ "$BUNDLED_PEEKABOO_SOURCE_SHA256" != "$PEEKABOO_BINARY_SHA256" ]; then
            echo "::error::Bundled Peekaboo source digest does not match the pinned release binary."
            exit 1
          fi
          if [ "$BUNDLED_PEEKABOO_LICENSE" != "MIT" ] || [ "$BUNDLED_PEEKABOO_LICENSE_PATH" != "licenses/Peekaboo-LICENSE.txt" ]; then
            echo "::error::Bundled Peekaboo license metadata is missing or unexpected."
            exit 1
          fi
          if [ "$BUNDLED_PEEKABOO_LICENSE_SHA256" != "$ACTUAL_PEEKABOO_LICENSE_SHA256" ]; then
            echo "::error::Bundled Peekaboo license digest does not match the bridge manifest."
            exit 1
          fi
          if [ "$BUNDLED_PYTHON_VERSION" != "$PYTHON_RUNTIME_VERSION" ] || [ "$BUNDLED_PYTHON_SOURCE_SHA256" != "$PYTHON_RUNTIME_ARM64_SHA256" ]; then
            echo "::error::Bundled Python runtime identity does not match the pinned arm64 release."
            exit 1
          fi
          test "$(readlink "$BRIDGE_PYTHON")" = python3.12
          test "$(lipo -archs "$APP_PATH/Contents/Resources/Bridge/python/bin/python3.12")" = arm64
          env -i HOME="$HOME" PATH=/usr/bin:/bin:/usr/sbin:/sbin "$BRIDGE_PYTHON" -I -B -c 'import ApplicationServices, Cocoa, CoreText, Quartz'
          env -i HOME="$HOME" PATH=/usr/bin:/bin:/usr/sbin:/sbin "$BRIDGE" status --json | jq -e '.ok == true or .ok == false' >/dev/null

          echo "app_path=$APP_PATH" >> "$GITHUB_OUTPUT"
          echo "bundle_id=$BUNDLE_ID" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "bridge_version=$BRIDGE_VERSION" >> "$GITHUB_OUTPUT"

          {
            echo "## Workbench Functional Smoke"
            echo
            echo "- Ref: \`$WORKBENCH_SMOKE_REF\`"
            echo "- SHA: \`$WORKBENCH_SMOKE_SHA\`"
            echo "- App path: \`$APP_PATH\`"
            echo "- Version: \`$VERSION\`"
            echo "- Bundle ID: \`$BUNDLE_ID\`"
            echo "- Bridge manifest: \`$BRIDGE_VERSION\`"
            echo "- Requested bridge ref: \`$WORKBENCH_SMOKE_BRIDGE_REF\`"
            echo "- Bundled Peekaboo: \`$BUNDLED_PEEKABOO_VERSION\`"
            echo "- Peekaboo pinned-source SHA-256: \`$BUNDLED_PEEKABOO_SOURCE_SHA256\`"
            echo "- Peekaboo packaged SHA-256: \`$PACKAGED_PEEKABOO_SHA256\`"
            echo "- Bundled Peekaboo license: \`$BUNDLED_PEEKABOO_LICENSE\` (\`$BUNDLED_PEEKABOO_LICENSE_SHA256\`)"
            echo
            echo "This artifact is intentionally unsigned/unnotarized and contains no DMG or release metadata."
            echo "Use it for functional proof only. Public release still requires the normal signed/notarized gate."
            echo
            echo "### Size"
            echo '```'
            du -sh "$APP_PATH" out
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Archive unpacked app
        shell: bash
        env:
          WORKBENCH_APP_PATH: ${{ steps.verify.outputs.app_path }}
          WORKBENCH_SHORT_SHA: ${{ steps.commit.outputs.short }}
        run: |
          set -euo pipefail
          APP_PATH="$WORKBENCH_APP_PATH"
          ARTIFACT="workbench-functional-smoke-$WORKBENCH_SHORT_SHA-mac-arm64.zip"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "$ARTIFACT"
          shasum -a 256 "$ARTIFACT" | tee "$ARTIFACT.sha256"

      - name: Upload functional-smoke artifact
        uses: actions/upload-artifact@v4
        with:
          name: workbench-functional-smoke-macos-arm64-${{ steps.commit.outputs.short }}
          path: |
            workbench-functional-smoke-${{ steps.commit.outputs.short }}-mac-arm64.zip
            workbench-functional-smoke-${{ steps.commit.outputs.short }}-mac-arm64.zip.sha256
          retention-days: 7

          # Keep this file ending with a real newline; PR Code Quality checks
          # run against GitHub's generated merge ref.
