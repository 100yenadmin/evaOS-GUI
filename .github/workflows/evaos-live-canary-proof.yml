name: evaOS Live Canary Proof

on:
  workflow_dispatch:
    inputs:
      live_canary_ack:
        description: 'Type evaos-live-canary to acknowledge this uses staging evaOS sessions and may mutate staging approvals/browser runtimes.'
        required: true
        type: string
      run_live_canaries:
        description: 'Run the individual live canaries after strict readiness passes.'
        required: false
        default: false
        type: boolean
      run_followup_canaries:
        description: 'Also run non-release-blocking follow-up/admin canaries for trust surfaces, provider hub, people approvals, and Company Brain.'
        required: false
        default: false
        type: boolean
      run_mac_control_canary:
        description: 'Also run the staging-only selected-binding Mac-control canary.'
        required: false
        default: false
        type: boolean
      mac_control_canary_ack:
        description: 'Type evaos-mac-control-canary to acknowledge this creates and revokes one short-lived staging desktop session.'
        required: false
        default: ''
        type: string
      provision_fixtures:
        description: 'Provision fresh short-lived staging fixtures before strict readiness and live canaries.'
        required: false
        default: true
        type: boolean
      proof_ref:
        description: 'Non-secret issue or packet reference for this proof run.'
        required: true
        type: string
      runtime:
        description: 'Optional dashboard-surface runtime id for broker-runtime proof, for example openclaw, hermes, paperclip, or terminal. Leave empty for the required multi-surface proof.'
        required: false
        default: ''
        type: string
      customer_id:
        description: 'Optional explicit non-internal customer id for broker/runtime live proof. Do not use internal support/golden VM targets.'
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  live-canary-proof:
    name: Staging live canary proof
    runs-on: ubuntu-latest
    environment: evaos-staging
    timeout-minutes: 30
    env:
      PROOF_DIR: live-canary-proof
      AIONUI_EVAOS_FIXTURE_STATE_PATH: .evaos-live-canary-fixtures.json
      AIONUI_EVAOS_MAC_CONTROL_CANARY_STATE_PATH: .evaos-mac-control-canary-session.json
      AIONUI_EVAOS_FIXTURE_SUPABASE_URL: ${{ secrets.AIONUI_EVAOS_FIXTURE_SUPABASE_URL || secrets.SUPABASE_URL }}
      AIONUI_EVAOS_FIXTURE_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.AIONUI_EVAOS_FIXTURE_SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_SECRET_KEY }}
      AIONUI_EVAOS_FIXTURE_ADMIN_EMAIL: ${{ vars.AIONUI_EVAOS_FIXTURE_ADMIN_EMAIL || 'admin@100yen.org' }}
      AIONUI_EVAOS_FIXTURE_CUSTOMER_ID: ${{ inputs.customer_id || vars.AIONUI_EVAOS_BROKER_CANARY_CUSTOMER_ID || secrets.AIONUI_EVAOS_BROKER_CANARY_CUSTOMER_ID || vars.AIONUI_EVAOS_FIXTURE_CUSTOMER_ID || vars.AIONUI_EVAOS_RELEASE_CANARY_CUSTOMER_ID || secrets.AIONUI_EVAOS_RELEASE_CANARY_CUSTOMER_ID || vars.AIONUI_EVAOS_CUSTOMER_ID || 'golden' }}
      AIONUI_EVAOS_FIXTURE_WRONG_CUSTOMER_ID: ${{ vars.AIONUI_EVAOS_FIXTURE_WRONG_CUSTOMER_ID || vars.AIONUI_EVAOS_COMPANY_BRAIN_WRONG_CUSTOMER_ID || vars.AIONUI_EVAOS_BUSINESS_BROWSER_WRONG_CUSTOMER_ID || 'aionui-wrong-customer-proof' }}
      AIONUI_EVAOS_FIXTURE_TTL_MINUTES: ${{ vars.AIONUI_EVAOS_FIXTURE_TTL_MINUTES || '180' }}
      AIONUI_EVAOS_APPROVAL_DENY_ACK: evaos-deny-test
      AIONUI_EVAOS_BUSINESS_BROWSER_ACTION_ACK: evaos-browser-test
      AIONUI_EVAOS_RELEASE_CANARY_ACCOUNT_EMAIL: ${{ vars.AIONUI_EVAOS_RELEASE_CANARY_ACCOUNT_EMAIL }}
      AIONUI_EVAOS_RELEASE_CANARY_CUSTOMER_ID: ${{ vars.AIONUI_EVAOS_RELEASE_CANARY_CUSTOMER_ID || secrets.AIONUI_EVAOS_RELEASE_CANARY_CUSTOMER_ID }}
      AIONUI_EVAOS_RELEASE_CANARY_TARGET_KIND: ${{ vars.AIONUI_EVAOS_RELEASE_CANARY_TARGET_KIND }}
      AIONUI_EVAOS_RELEASE_CANARY_TARGET_LABEL: ${{ vars.AIONUI_EVAOS_RELEASE_CANARY_TARGET_LABEL }}
      AIONUI_EVAOS_RELEASE_CANARY_CUSTOMER_LABEL: ${{ vars.AIONUI_EVAOS_RELEASE_CANARY_CUSTOMER_LABEL }}
      AIONUI_EVAOS_RELEASE_CANARY_RUNTIME_OWNER: ${{ vars.AIONUI_EVAOS_RELEASE_CANARY_RUNTIME_OWNER }}
      AIONUI_EVAOS_BROKER_ENDPOINT: ${{ vars.AIONUI_EVAOS_BROKER_ENDPOINT || secrets.AIONUI_EVAOS_BROKER_ENDPOINT }}
      AIONUI_EVAOS_DESKTOP_SESSION: ${{ secrets.AIONUI_EVAOS_DESKTOP_SESSION }}
      AIONUI_EVAOS_BROKER_CANARY_CUSTOMER_ID: ${{ inputs.customer_id || vars.AIONUI_EVAOS_BROKER_CANARY_CUSTOMER_ID || secrets.AIONUI_EVAOS_BROKER_CANARY_CUSTOMER_ID }}
      AIONUI_EVAOS_BROKER_CANARY_DESKTOP_SESSION: ${{ secrets.AIONUI_EVAOS_BROKER_CANARY_DESKTOP_SESSION }}
      AIONUI_EVAOS_REQUIRE_BROKER_CANARY_TARGET: ${{ github.event.inputs.run_live_canaries }}
      AIONUI_EVAOS_CUSTOMER_ID: ${{ vars.AIONUI_EVAOS_CUSTOMER_ID || secrets.AIONUI_EVAOS_CUSTOMER_ID || vars.AIONUI_EVAOS_RELEASE_CANARY_CUSTOMER_ID || secrets.AIONUI_EVAOS_RELEASE_CANARY_CUSTOMER_ID }}
      AIONUI_EVAOS_RUNTIME: ${{ inputs.runtime || vars.AIONUI_EVAOS_RUNTIME }}
      AIONUI_EVAOS_BROKER_RUNTIME: ${{ inputs.runtime }}
      AIONUI_EVAOS_RUN_FOLLOWUP_CANARIES: ${{ github.event.inputs.run_followup_canaries }}
      AIONUI_EVAOS_APPROVAL_ID: ${{ vars.AIONUI_EVAOS_APPROVAL_ID || secrets.AIONUI_EVAOS_APPROVAL_ID }}
      AIONUI_EVAOS_REQUESTER_SESSION: ${{ secrets.AIONUI_EVAOS_REQUESTER_SESSION }}
      AIONUI_EVAOS_APPROVER_SESSION: ${{ secrets.AIONUI_EVAOS_APPROVER_SESSION }}
      AIONUI_EVAOS_REQUESTER_MEMBERSHIP_ID: ${{ vars.AIONUI_EVAOS_REQUESTER_MEMBERSHIP_ID }}
      AIONUI_EVAOS_APPROVAL_DENY_REASON: ${{ vars.AIONUI_EVAOS_APPROVAL_DENY_REASON }}
      AIONUI_EVAOS_DENIED_SESSION: ${{ secrets.AIONUI_EVAOS_DENIED_SESSION }}
      AIONUI_EVAOS_PROVIDER_REQUIRED_STATES: ${{ vars.AIONUI_EVAOS_PROVIDER_REQUIRED_STATES }}
      AIONUI_EVAOS_COMPANY_BRAIN_ACCOUNT_ID: ${{ vars.AIONUI_EVAOS_COMPANY_BRAIN_ACCOUNT_ID || secrets.AIONUI_EVAOS_COMPANY_BRAIN_ACCOUNT_ID }}
      AIONUI_EVAOS_COMPANY_BRAIN_QUERY: ${{ vars.AIONUI_EVAOS_COMPANY_BRAIN_QUERY || secrets.AIONUI_EVAOS_COMPANY_BRAIN_QUERY }}
      AIONUI_EVAOS_COMPANY_BRAIN_WRONG_CUSTOMER_ID: ${{ vars.AIONUI_EVAOS_COMPANY_BRAIN_WRONG_CUSTOMER_ID || secrets.AIONUI_EVAOS_COMPANY_BRAIN_WRONG_CUSTOMER_ID }}
      AIONUI_EVAOS_COMPANY_BRAIN_DENIED_SESSION: ${{ secrets.AIONUI_EVAOS_COMPANY_BRAIN_DENIED_SESSION }}
      AIONUI_EVAOS_COMPANY_BRAIN_REQUIRED_INGESTION_STATES: ${{ vars.AIONUI_EVAOS_COMPANY_BRAIN_REQUIRED_INGESTION_STATES }}
      AIONUI_EVAOS_BUSINESS_BROWSER_TEST_URL: ${{ vars.AIONUI_EVAOS_BUSINESS_BROWSER_TEST_URL || secrets.AIONUI_EVAOS_BUSINESS_BROWSER_TEST_URL }}
      AIONUI_EVAOS_BUSINESS_BROWSER_ALLOWED_HOSTS: ${{ vars.AIONUI_EVAOS_BUSINESS_BROWSER_ALLOWED_HOSTS }}
      AIONUI_EVAOS_BUSINESS_BROWSER_WRONG_CUSTOMER_ID: ${{ vars.AIONUI_EVAOS_BUSINESS_BROWSER_WRONG_CUSTOMER_ID || secrets.AIONUI_EVAOS_BUSINESS_BROWSER_WRONG_CUSTOMER_ID }}
      AIONUI_EVAOS_BUSINESS_BROWSER_DENIED_SESSION: ${{ secrets.AIONUI_EVAOS_BUSINESS_BROWSER_DENIED_SESSION }}
      AIONUI_EVAOS_RUN_MAC_CONTROL_CANARY: ${{ github.event.inputs.run_mac_control_canary }}
      AIONUI_EVAOS_MAC_CONTROL_CANARY_ACK: ${{ github.event.inputs.mac_control_canary_ack }}
      AIONUI_EVAOS_MAC_CONTROL_CANARY_ACCOUNT_EMAIL: ${{ secrets.AIONUI_EVAOS_MAC_CONTROL_CANARY_ACCOUNT_EMAIL }}
      AIONUI_EVAOS_MAC_CONTROL_CANARY_CUSTOMER_ID: ${{ secrets.AIONUI_EVAOS_MAC_CONTROL_CANARY_CUSTOMER_ID }}
      AIONUI_EVAOS_MAC_CONTROL_CANARY_ENDPOINT: ${{ secrets.AIONUI_EVAOS_MAC_CONTROL_CANARY_ENDPOINT }}
      AIONUI_EVAOS_MAC_CONTROL_CANARY_EXPECTED_CALLBACK_HOST: ${{ secrets.AIONUI_EVAOS_MAC_CONTROL_CANARY_EXPECTED_CALLBACK_HOST }}
      AIONUI_EVAOS_MAC_CONTROL_CANARY_SUPABASE_URL: ${{ secrets.AIONUI_EVAOS_MAC_CONTROL_CANARY_SUPABASE_URL }}
      AIONUI_EVAOS_MAC_CONTROL_CANARY_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.AIONUI_EVAOS_MAC_CONTROL_CANARY_SUPABASE_SERVICE_ROLE_KEY }}
      AIONUI_EVAOS_MAC_CONTROL_CANARY_TTL_MINUTES: '10'
      AIONUI_EVAOS_MAC_CONTROL_DEPLOYED_PROBE_OUTPUT: live-canary-proof/mac-control-deployed-route.json
      AIONUI_EVAOS_MAC_CONTROL_DEPLOYED_NEGATIVE_PROBE_OUTPUT: live-canary-proof/mac-control-runtime-negative.json
      EVAOS_LIVE_CANARY_CONTEXT_KEY_ID: ${{ vars.EVAOS_MAC_CONTROL_CONTEXT_KEY_ID }}
      EVAOS_LIVE_CANARY_RECEIPT_KEY_ID: ${{ vars.EVAOS_MAC_CONTROL_RECEIPT_KEY_ID }}
      EVAOS_LIVE_CANARY_RECEIPT_PUBLIC_KEY: ${{ vars.EVAOS_MAC_CONTROL_RECEIPT_PUBLIC_KEY }}
    steps:
      - name: Validate proof inputs
        env:
          ACK: ${{ github.event.inputs.live_canary_ack }}
          MAC_CONTROL_REQUESTED: ${{ github.event.inputs.run_mac_control_canary }}
          MAC_CONTROL_ACK: ${{ github.event.inputs.mac_control_canary_ack }}
          PROVISION_FIXTURES: ${{ github.event.inputs.provision_fixtures }}
          RUN_LIVE_CANARIES: ${{ github.event.inputs.run_live_canaries }}
          PROOF_REF: ${{ github.event.inputs.proof_ref }}
        run: |
          set -euo pipefail
          if [ "$ACK" != "evaos-live-canary" ]; then
            echo "::error::Wrong live canary acknowledgement. Type evaos-live-canary."
            exit 1
          fi
          if [ -z "$PROOF_REF" ] || [[ "$PROOF_REF" == *"Bearer "* || "$PROOF_REF" == *"eds_"* || "$PROOF_REF" == *"eyJ"* ]]; then
            echo "::error::proof_ref must be a non-secret issue, PR, or packet reference."
            exit 1
          fi
          if [ "$MAC_CONTROL_REQUESTED" = "true" ]; then
            if [ "$RUN_LIVE_CANARIES" != "true" ] || [ "$PROVISION_FIXTURES" != "true" ]; then
              echo "::error::The Mac-control canary requires run_live_canaries=true and provision_fixtures=true."
              exit 1
            fi
            if [ "$MAC_CONTROL_ACK" != "evaos-mac-control-canary" ]; then
              echo "::error::Wrong Mac-control canary acknowledgement. Type evaos-mac-control-canary."
              exit 1
            fi
          fi

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Prepare proof directory
        env:
          PROOF_REF: ${{ github.event.inputs.proof_ref }}
        run: |
          set -euo pipefail
          rm -rf "$PROOF_DIR"
          mkdir -p "$PROOF_DIR"
          {
            echo "# evaOS Live Canary Proof"
            echo ""
            echo "Proof reference: $PROOF_REF"
            echo "Repository: ${{ github.repository }}"
            echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "Environment: evaos-staging"
            echo "Run live canaries: ${{ github.event.inputs.run_live_canaries }}"
            echo "Run follow-up canaries: ${{ github.event.inputs.run_followup_canaries }}"
            echo "Run Mac-control canary: ${{ github.event.inputs.run_mac_control_canary }}"
            echo "Core broker surfaces: evaOS/openclaw, Hermes/hermes, Mission Control/paperclip, Shared Browser/browser, Terminal/terminal"
            echo "Business Browser action canary: follow-up only unless run_followup_canaries=true"
          } > "$PROOF_DIR/proof-run.md"

      - name: Provision reusable live canary fixtures
        if: github.event.inputs.run_live_canaries == 'true' && github.event.inputs.run_followup_canaries == 'true' && github.event.inputs.provision_fixtures == 'true'
        run: |
          set -euo pipefail
          node scripts/evaosProvisionLiveCanaryFixtures.js provision | awk -v out="$PROOF_DIR/fixture-provisioning.stdout.json" '
            /^::add-mask::/ { print; next }
            { print > out }
          '
          test -s "$PROOF_DIR/fixture-provisioning.stdout.json"
          if grep -q '^::add-mask::' "$PROOF_DIR/fixture-provisioning.stdout.json"; then
            echo "::error::Fixture proof artifact contains GitHub mask commands."
              exit 1
            fi

      - name: Provision core broker live canary credentials
        if: github.event.inputs.run_live_canaries == 'true' && github.event.inputs.run_followup_canaries != 'true' && github.event.inputs.provision_fixtures == 'true'
        run: |
          set -euo pipefail
          node scripts/evaosProvisionLiveCanaryFixtures.js provision-core-broker | awk -v out="$PROOF_DIR/core-broker-fixture-provisioning.stdout.json" '
            /^::add-mask::/ { print; next }
            { print > out }
          '
          test -s "$PROOF_DIR/core-broker-fixture-provisioning.stdout.json"
          if grep -q '^::add-mask::' "$PROOF_DIR/core-broker-fixture-provisioning.stdout.json"; then
            echo "::error::Core broker fixture proof artifact contains GitHub mask commands."
            exit 1
          fi

      - name: Provision Mac-control canary session
        if: github.event.inputs.run_live_canaries == 'true' && github.event.inputs.run_mac_control_canary == 'true' && github.event.inputs.provision_fixtures == 'true'
        run: |
          set -euo pipefail
          node scripts/evaosProvisionLiveCanaryFixtures.js provision-mac-control | awk -v out="$PROOF_DIR/mac-control-session-provisioning.stdout.json" '
            /^::add-mask::/ { print; next }
            { print > out }
          '
          test -s "$PROOF_DIR/mac-control-session-provisioning.stdout.json"
          if grep -q '^::add-mask::' "$PROOF_DIR/mac-control-session-provisioning.stdout.json"; then
            echo "::error::Mac-control session proof artifact contains GitHub mask commands."
            exit 1
          fi

      - name: Run strict readiness checklist
        run: |
          set -euo pipefail
          node scripts/evaosLiveCanaryReadiness.js --markdown > "$PROOF_DIR/readiness.md"
          node scripts/evaosLiveCanaryReadiness.js --strict > "$PROOF_DIR/readiness.json"

      - name: Run live canaries
        if: github.event.inputs.run_live_canaries == 'true'
        run: |
          set -euo pipefail
          node scripts/evaosBrokerLiveCanary.js > "$PROOF_DIR/broker-runtime-status.json"

      - name: Run selected-binding Mac-control canary
        if: github.event.inputs.run_live_canaries == 'true' && github.event.inputs.run_mac_control_canary == 'true'
        run: |
          set -euo pipefail
          node scripts/evaosBrokerLiveCanary.js --mac-control > "$PROOF_DIR/mac-control-runtime.json"

      - name: Run follow-up live canaries
        if: github.event.inputs.run_live_canaries == 'true' && github.event.inputs.run_followup_canaries == 'true'
        run: |
          set -euo pipefail
          node scripts/evaosBusinessBrowserLiveCanary.js > "$PROOF_DIR/business-browser.json"
          node scripts/evaosTrustSurfaceLiveCanary.js > "$PROOF_DIR/trust-surface.json"
          node scripts/evaosProviderHubLiveCanary.js > "$PROOF_DIR/provider-hub.json"
          node scripts/evaosPeopleApprovalLiveCanary.js > "$PROOF_DIR/people-approval-deny.json"
          node scripts/evaosCompanyBrainLiveCanary.js > "$PROOF_DIR/company-brain.json"

      - name: Cleanup reusable live canary fixtures
        if: always() && github.event.inputs.run_live_canaries == 'true' && github.event.inputs.run_followup_canaries == 'true' && github.event.inputs.provision_fixtures == 'true'
        run: |
          set -euo pipefail
          node scripts/evaosProvisionLiveCanaryFixtures.js cleanup > "$PROOF_DIR/fixture-cleanup.stdout.json"

      - name: Cleanup core broker live canary credentials
        if: always() && github.event.inputs.run_live_canaries == 'true' && github.event.inputs.run_followup_canaries != 'true' && github.event.inputs.provision_fixtures == 'true'
        run: |
          set -euo pipefail
          node scripts/evaosProvisionLiveCanaryFixtures.js cleanup > "$PROOF_DIR/core-broker-fixture-cleanup.stdout.json"

      - name: Cleanup Mac-control canary session
        if: always() && github.event.inputs.run_live_canaries == 'true' && github.event.inputs.run_mac_control_canary == 'true' && github.event.inputs.provision_fixtures == 'true'
        run: |
          set -euo pipefail
          cleanup_output="$PROOF_DIR/mac-control-session-cleanup.stdout.json"
          cleanup_temp="${cleanup_output}.tmp"
          rm -f "$cleanup_output" "$cleanup_temp"
          trap 'rm -f "$cleanup_temp"' EXIT
          node scripts/evaosProvisionLiveCanaryFixtures.js cleanup-mac-control > "$cleanup_temp"
          mv "$cleanup_temp" "$cleanup_output"
          trap - EXIT

      - name: Scan existing Mac-control proofs for safe diagnostic upload
        id: mac-control-partial-proof-scan
        if: always() && github.event.inputs.run_mac_control_canary == 'true'
        run: |
          set -euo pipefail
          node scripts/evaosScanMacControlProofs.js --allow-partial "$PROOF_DIR"

      - name: Require complete Mac-control proof set
        id: mac-control-complete-proof-scan
        if: success() && github.event.inputs.run_live_canaries == 'true' && github.event.inputs.run_mac_control_canary == 'true' && github.event.inputs.provision_fixtures == 'true' && steps.mac-control-partial-proof-scan.outcome == 'success'
        run: |
          set -euo pipefail
          node scripts/evaosScanMacControlProofs.js "$PROOF_DIR"

      - name: Write summary
        if: always()
        run: |
          {
            echo "### evaOS Live Canary Proof"
            echo ""
            echo "- Environment: \`evaos-staging\`"
            echo "- Proof artifact: \`evaos-live-canary-proof-${{ github.run_id }}\`"
            echo "- Individual canaries requested: \`${{ github.event.inputs.run_live_canaries }}\`"
            echo "- Follow-up canaries requested: \`${{ github.event.inputs.run_followup_canaries }}\`"
            echo "- Mac-control canary requested: \`${{ github.event.inputs.run_mac_control_canary }}\`"
            echo "- Fixture provisioning requested: \`${{ github.event.inputs.provision_fixtures }}\`"
            echo ""
            if [ -f "$PROOF_DIR/readiness.md" ]; then
              cat "$PROOF_DIR/readiness.md"
            else
              echo "Readiness output was not produced."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload live canary proof packet
        if: always() && (github.event.inputs.run_mac_control_canary != 'true' || steps.mac-control-partial-proof-scan.outcome == 'success')
        uses: actions/upload-artifact@v4
        with:
          name: evaos-live-canary-proof-${{ github.run_id }}
          path: live-canary-proof
          if-no-files-found: error
          retention-days: 30
