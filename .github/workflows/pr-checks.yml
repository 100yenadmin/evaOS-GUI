name: 'PR Checks'

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to run checks on'
        required: true
        type: string
      skip_build_test:
        description: 'Skip the build test job (saves ~45 min)'
        type: boolean
        required: false
        default: false
      run_windows_checks:
        description: 'Force Windows unit checks for this PR'
        type: boolean
        required: false
        default: false
      force_package_smoke:
        description: 'Force the packaged app smoke for this PR'
        type: boolean
        required: false
        default: false
  pull_request:
    types: [opened, synchronize, edited, closed, ready_for_review]
    branches: [main, dev]
    paths-ignore:
      - '.vscode/**'
      - '.github/ISSUE_TEMPLATE/**'

concurrency:
  group: pr-checks-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: read
  checks: write
  id-token: write

env:
  BUN_INSTALL_REGISTRY: 'https://registry.npmjs.org/'

jobs:
  # Cancel in-progress runs when PR is closed (merged or manually closed)
  cancel-if-closed:
    name: Cancel if PR closed
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - run: echo "PR closed, cancelling in-progress runs via concurrency."

  pr-check-plan:
    name: PR Check Plan
    if: github.event_name == 'workflow_dispatch' || (github.event.action != 'closed' && github.event.pull_request.draft == false)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run_windows_checks: ${{ steps.plan.outputs.run_windows_checks }}
      windows_reasons_json: ${{ steps.plan.outputs.windows_reasons_json }}
      run_package_smoke: ${{ steps.plan.outputs.run_package_smoke }}
      package_smoke_reasons_json: ${{ steps.plan.outputs.package_smoke_reasons_json }}
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Resolve PR context
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_DISPATCH_PR_NUMBER: ${{ inputs.pr_number }}
          PULL_REQUEST_BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            PR_INFO="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${WORKFLOW_DISPATCH_PR_NUMBER}")"
            HEAD_SHA="$(jq -r '.head.sha' <<< "$PR_INFO")"
            BASE_REF="$(jq -r '.base.ref' <<< "$PR_INFO")"
            git fetch --no-tags --depth=1 origin "refs/pull/${WORKFLOW_DISPATCH_PR_NUMBER}/head"
            git checkout --detach "$HEAD_SHA"
          else
            BASE_REF="$PULL_REQUEST_BASE_REF"
          fi
          echo "PR_BASE_REF=$BASE_REF" >> "$GITHUB_ENV"

      - name: List changed files
        id: changed-files
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_DISPATCH_PR_NUMBER: ${{ inputs.pr_number }}
          PULL_REQUEST_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            PR_NUMBER="$WORKFLOW_DISPATCH_PR_NUMBER"
          else
            PR_NUMBER="$PULL_REQUEST_NUMBER"
          fi

          gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files" --jq '.[].filename' | tee changed-files.txt

          PR_INFO="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")"
          EXPECTED_COUNT="$(jq -r '.changed_files' <<< "$PR_INFO")"
          BASE_REF="$(jq -r '.base.ref' <<< "$PR_INFO")"
          echo "base_ref=$BASE_REF" >> "$GITHUB_OUTPUT"

          RETURNED_COUNT="$(wc -l < changed-files.txt | tr -d '[:space:]')"
          if [ "$RETURNED_COUNT" != "$EXPECTED_COUNT" ]; then
            echo "::warning::PR file listing returned ${RETURNED_COUNT} of ${EXPECTED_COUNT} changed files; forcing gated checks."
            echo "force_package_smoke=true" >> "$GITHUB_OUTPUT"
            echo "force_windows_checks=true" >> "$GITHUB_OUTPUT"
          else
            echo "force_package_smoke=false" >> "$GITHUB_OUTPUT"
            echo "force_windows_checks=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout trusted base planner
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ steps.changed-files.outputs.base_ref }}
          path: trusted-base
          persist-credentials: false

      - name: Plan macOS-first PR checks
        id: plan
        shell: bash
        env:
          RUN_WINDOWS_CHECKS: ${{ inputs.run_windows_checks }}
          FORCE_PACKAGE_SMOKE_INPUT: ${{ inputs.force_package_smoke }}
          TRUSTED_BASE_REF: ${{ steps.changed-files.outputs.base_ref }}
          CHANGED_FILES_FORCE_WINDOWS_CHECKS: ${{ steps.changed-files.outputs.force_windows_checks }}
          CHANGED_FILES_FORCE_PACKAGE_SMOKE: ${{ steps.changed-files.outputs.force_package_smoke }}
        run: |
          set -euo pipefail
          TRUSTED_PLANNER="trusted-base/scripts/evaosPrCheckPlan.js"
          if [ ! -f "$TRUSTED_PLANNER" ]; then
            echo "::warning::Trusted PR check planner is missing on ${TRUSTED_BASE_REF}; forcing all gated checks."
            {
              echo "run_windows_checks=true"
              echo 'windows_reasons_json=["trusted planner missing on base ref; fail closed"]'
              echo "run_package_smoke=true"
              echo 'package_smoke_reasons_json=["trusted planner missing on base ref; fail closed"]'
            } | tee pr-check-plan.out
            cat pr-check-plan.out >> "$GITHUB_OUTPUT"
            exit 0
          fi

          FORCE_PACKAGE_SMOKE="$FORCE_PACKAGE_SMOKE_INPUT"
          if [ "$CHANGED_FILES_FORCE_PACKAGE_SMOKE" = "true" ]; then
            FORCE_PACKAGE_SMOKE=true
          fi
          if [ "$CHANGED_FILES_FORCE_WINDOWS_CHECKS" = "true" ]; then
            RUN_WINDOWS_CHECKS=true
          fi
          export FORCE_PACKAGE_SMOKE RUN_WINDOWS_CHECKS
          node "$TRUSTED_PLANNER" github-output < changed-files.txt | tee pr-check-plan.out
          cat pr-check-plan.out >> "$GITHUB_OUTPUT"

      - name: Publish check plan summary
        shell: bash
        env:
          RUN_WINDOWS_CHECKS: ${{ steps.plan.outputs.run_windows_checks }}
          WINDOWS_REASONS_JSON: ${{ steps.plan.outputs.windows_reasons_json }}
          RUN_PACKAGE_SMOKE: ${{ steps.plan.outputs.run_package_smoke }}
          PACKAGE_SMOKE_REASONS_JSON: ${{ steps.plan.outputs.package_smoke_reasons_json }}
        run: |
          {
            printf '## PR check plan\n'
            printf 'Windows checks: %s\n' "$RUN_WINDOWS_CHECKS"
            printf 'Windows reasons: %s\n' "$WINDOWS_REASONS_JSON"
            printf 'Package smoke: %s\n' "$RUN_PACKAGE_SMOKE"
            printf 'Package smoke reasons: %s\n' "$PACKAGE_SMOKE_REASONS_JSON"
          } >> "$GITHUB_STEP_SUMMARY"

  # Job 1: Code quality checks (TypeScript, Oxlint, Oxfmt)
  code-quality:
    name: Code Quality
    if: github.event_name == 'workflow_dispatch' || (github.event.action != 'closed' && github.event.pull_request.draft == false)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve PR context
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_DISPATCH_PR_NUMBER: ${{ inputs.pr_number }}
          PULL_REQUEST_BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            PR_INFO="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${WORKFLOW_DISPATCH_PR_NUMBER}")"
            HEAD_SHA="$(jq -r '.head.sha' <<< "$PR_INFO")"
            BASE_REF="$(jq -r '.base.ref' <<< "$PR_INFO")"
            git fetch --no-tags --depth=1 origin "refs/pull/${WORKFLOW_DISPATCH_PR_NUMBER}/head"
            git checkout --detach "$HEAD_SHA"
          else
            BASE_REF="$PULL_REQUEST_BASE_REF"
          fi
          echo "PR_BASE_REF=$BASE_REF" >> "$GITHUB_ENV"

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'

      - name: Setup bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: latest
          cache: true

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run postinstall
        run: npm run postinstall || true

      - name: Install prek
        run: npm install -g @j178/prek

      - name: Run prek checks
        run: prek run --from-ref origin/${{ env.PR_BASE_REF }} --to-ref HEAD

  # Job 2: Unit tests for the macOS-first beta lane.
  unit-tests:
    name: Unit Tests (${{ matrix.os }})
    if: github.event_name == 'workflow_dispatch' || (github.event.action != 'closed' && github.event.pull_request.draft == false)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14]
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Resolve PR context
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_DISPATCH_PR_NUMBER: ${{ inputs.pr_number }}
          PULL_REQUEST_BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            PR_INFO="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${WORKFLOW_DISPATCH_PR_NUMBER}")"
            HEAD_SHA="$(jq -r '.head.sha' <<< "$PR_INFO")"
            BASE_REF="$(jq -r '.base.ref' <<< "$PR_INFO")"
            git fetch --no-tags --depth=1 origin "refs/pull/${WORKFLOW_DISPATCH_PR_NUMBER}/head"
            git checkout --detach "$HEAD_SHA"
          else
            BASE_REF="$PULL_REQUEST_BASE_REF"
          fi
          echo "PR_BASE_REF=$BASE_REF" >> "$GITHUB_ENV"

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'

      - name: Setup bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: latest
          cache: true

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run postinstall
        run: npm run postinstall || true

      - name: Run extension system tests
        run: bunx vitest run

  windows-unit-tests:
    name: Unit Tests (windows-2022)
    needs: pr-check-plan
    if: needs.pr-check-plan.outputs.run_windows_checks == 'true'
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Resolve PR context
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_DISPATCH_PR_NUMBER: ${{ inputs.pr_number }}
          PULL_REQUEST_BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            PR_INFO="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${WORKFLOW_DISPATCH_PR_NUMBER}")"
            HEAD_SHA="$(jq -r '.head.sha' <<< "$PR_INFO")"
            BASE_REF="$(jq -r '.base.ref' <<< "$PR_INFO")"
            git fetch --no-tags --depth=1 origin "refs/pull/${WORKFLOW_DISPATCH_PR_NUMBER}/head"
            git checkout --detach "$HEAD_SHA"
          else
            BASE_REF="$PULL_REQUEST_BASE_REF"
          fi
          echo "PR_BASE_REF=$BASE_REF" >> "$GITHUB_ENV"

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'

      - name: Setup bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: latest
          cache: true

      - name: Disable Windows Defender
        shell: pwsh
        run: |
          Set-MpPreference -DisableRealtimeMonitoring $true
          Add-MpPreference -ExclusionPath "${{ github.workspace }}"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run postinstall
        run: npm run postinstall || true

      - name: Run extension system tests
        run: bunx vitest run

  # Job 3: Coverage test (Linux only)
  coverage-tests:
    name: Coverage Test
    if: github.event_name == 'workflow_dispatch' || (github.event.action != 'closed' && github.event.pull_request.draft == false)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Resolve PR context
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_DISPATCH_PR_NUMBER: ${{ inputs.pr_number }}
          PULL_REQUEST_BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            PR_INFO="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${WORKFLOW_DISPATCH_PR_NUMBER}")"
            HEAD_SHA="$(jq -r '.head.sha' <<< "$PR_INFO")"
            BASE_REF="$(jq -r '.base.ref' <<< "$PR_INFO")"
            git fetch --no-tags --depth=1 origin "refs/pull/${WORKFLOW_DISPATCH_PR_NUMBER}/head"
            git checkout --detach "$HEAD_SHA"
          else
            BASE_REF="$PULL_REQUEST_BASE_REF"
          fi
          echo "PR_BASE_REF=$BASE_REF" >> "$GITHUB_ENV"

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'

      - name: Setup bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: latest
          cache: true

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run postinstall
        run: npm run postinstall || true

      - name: Run coverage tests
        id: coverage
        continue-on-error: true
        run: bun run test:coverage

      - name: Upload coverage to Codecov (Linux coverage only)
        id: codecov-upload
        if: always() && hashFiles('coverage/lcov.info') != '' && github.repository == '100yenadmin/evaOS-GUI'
        uses: codecov/codecov-action@04b047e8bb82a0c002c8312c1c880fbc6a999d45
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          use_oidc: ${{ secrets.CODECOV_TOKEN == '' }}
          files: coverage/lcov.info
          fail_ci_if_error: false
          verbose: true
      - name: Skip Codecov upload when preconditions are not met
        if: always() && hashFiles('coverage/lcov.info') != '' && github.repository != '100yenadmin/evaOS-GUI'
        shell: bash
        run: |
          echo 'Skipping Codecov upload due to unmet preconditions.'
          echo "Repository: ${{ github.repository }}"
      - name: Coverage result summary
        if: always()
        shell: bash
        env:
          COVERAGE_OUTCOME: ${{ steps.coverage.outcome }}
          CODECOV_UPLOAD_OUTCOME: ${{ steps.codecov-upload.outcome }}
        run: |
          if [ "$COVERAGE_OUTCOME" = "failure" ]; then
            echo "::warning::Coverage tests failed (non-blocking). Check logs for failed test details."
          fi

          {
            if [ "$COVERAGE_OUTCOME" = "failure" ]; then
              echo "## Coverage check (non-blocking warning)"
              echo "Coverage command failed in this run. Please review test failures in logs."
              if [ -f coverage/lcov.info ]; then
                if [ "$CODECOV_UPLOAD_OUTCOME" = "success" ]; then
                  echo "Codecov upload completed."
                else
                  echo "Codecov upload did not complete; outcome: ${CODECOV_UPLOAD_OUTCOME:-unknown}."
                fi
              else
                echo "lcov.info not found, Codecov upload was skipped."
              fi
            else
              echo "## Coverage check"
              echo "Coverage command passed."
              if [ "$CODECOV_UPLOAD_OUTCOME" = "success" ]; then
                echo "Uploaded Linux (ubuntu-latest) coverage to Codecov."
              elif [ -f coverage/lcov.info ]; then
                echo "Codecov upload skipped or did not complete; outcome: ${CODECOV_UPLOAD_OUTCOME:-unknown}."
              else
                echo "Coverage passed but lcov.info is missing; Codecov upload was skipped."
              fi
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage artifacts
        if: always() && hashFiles('coverage/lcov.info') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: coverage-report
          path: coverage/
          if-no-files-found: warn

  i18n-check:
    name: I18n Check
    if: github.event_name == 'workflow_dispatch' || (github.event.action != 'closed' && github.event.pull_request.draft == false)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Resolve PR context
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_DISPATCH_PR_NUMBER: ${{ inputs.pr_number }}
          PULL_REQUEST_BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            PR_INFO="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${WORKFLOW_DISPATCH_PR_NUMBER}")"
            HEAD_SHA="$(jq -r '.head.sha' <<< "$PR_INFO")"
            BASE_REF="$(jq -r '.base.ref' <<< "$PR_INFO")"
            git fetch --no-tags --depth=1 origin "refs/pull/${WORKFLOW_DISPATCH_PR_NUMBER}/head"
            git checkout --detach "$HEAD_SHA"
          else
            BASE_REF="$PULL_REQUEST_BASE_REF"
          fi
          echo "PR_BASE_REF=$BASE_REF" >> "$GITHUB_ENV"

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'

      - name: Setup bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: latest
          cache: true

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run postinstall
        run: npm run postinstall || true

      - name: Run i18n validation (warning-only)
        id: i18n
        shell: bash
        run: |
          set -o pipefail
          node scripts/check-i18n.js 2>&1 | tee i18n-check.log

      - name: Publish i18n summary
        if: always()
        shell: bash
        env:
          I18N_OUTCOME: ${{ steps.i18n.outcome }}
        run: |
          {
            echo "## i18n validation"
            if [ "$I18N_OUTCOME" = "failure" ]; then
              echo "i18n validation failed. Please review errors below."
            elif [ -f i18n-check.log ] && grep -q "⚠️" i18n-check.log; then
              echo "Missing/incomplete translations found. Please review warnings below."
            else
              echo "No i18n warnings detected."
            fi
            echo ""
            echo "<details><summary>i18n log</summary>"
            echo ""
            echo '```text'
            if [ -f i18n-check.log ]; then
              cat i18n-check.log
            else
              echo "i18n-check.log was not produced."
            fi
            echo '```'
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

  # Job 4: Apple Silicon unpacked app smoke for packaging/resource changes.
  # DMG/ZIP installers remain release-only; PR smoke verifies packaged resource
  # shape with an unpacked .app that may be ad-hoc signed by packaging hooks.
  thin-app-smoke-macos-arm64:
    name: Thin App Smoke (macos-arm64)
    needs: pr-check-plan
    if: needs.pr-check-plan.outputs.run_package_smoke == 'true' && inputs.skip_build_test != true
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Resolve PR context
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_DISPATCH_PR_NUMBER: ${{ inputs.pr_number }}
          PULL_REQUEST_BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            PR_INFO="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${WORKFLOW_DISPATCH_PR_NUMBER}")"
            HEAD_SHA="$(jq -r '.head.sha' <<< "$PR_INFO")"
            BASE_REF="$(jq -r '.base.ref' <<< "$PR_INFO")"
            git fetch --no-tags --depth=1 origin "refs/pull/${WORKFLOW_DISPATCH_PR_NUMBER}/head"
            git checkout --detach "$HEAD_SHA"
          else
            BASE_REF="$PULL_REQUEST_BASE_REF"
          fi
          echo "PR_BASE_REF=$BASE_REF" >> "$GITHUB_ENV"

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'

      - name: Setup bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: latest
          cache: true

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run postinstall
        run: npm run postinstall || true

      - name: Verify renderer dependency manifest
        run: node scripts/evaosVerifyRendererDependencyPrune.js --verify-package-json

      - name: Get Electron version
        id: electron-version
        shell: bash
        run: |
          ELECTRON_VERSION=$(node -p "require('./package.json').devDependencies.electron.replace(/[\^~]/g, '')")
          echo "version=$ELECTRON_VERSION" >> "$GITHUB_OUTPUT"
          echo "Electron version: $ELECTRON_VERSION"

      # Restore Electron/Electron-Builder caches before install-app-deps
      - name: Cache Electron artifacts
        id: electron-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ${{ runner.temp }}/.cache/electron
            ${{ runner.temp }}/.cache/electron-builder
            ~/.cache/electron
            ~/.cache/electron-builder
          key: electron-cache-macos-arm64-${{ hashFiles('package.json', 'bun.lock') }}
          restore-keys: |
            electron-cache-macos-arm64-

      - name: Cache status
        env:
          ELECTRON_CACHE_HIT: ${{ steps.electron-cache.outputs.cache-hit }}
        run: printf 'electron-cache-hit=%s\n' "$ELECTRON_CACHE_HIT"

      - name: Rebuild native modules for Electron
        run: bunx electron-builder install-app-deps
        env:
          npm_config_runtime: electron
          npm_config_disturl: https://electronjs.org/headers
          ELECTRON_CACHE: ${{ runner.temp }}/.cache/electron
          ELECTRON_BUILDER_CACHE: ${{ runner.temp }}/.cache/electron-builder

      - name: Build unpacked app only
        shell: bash
        run: |
          echo "=========================================="
          echo "THIN APP SMOKE: macos-arm64"
          echo "=========================================="
          node scripts/build-with-builder.js arm64 --mac dir --arm64
          echo "✓Unpacked app build passed for macos-arm64"
        env:
          NODE_OPTIONS: '--max-old-space-size=8192'
          npm_config_arch: arm64
          npm_config_target_arch: arm64
          npm_config_runtime: electron
          npm_config_target: ${{ steps.electron-version.outputs.version }}
          npm_config_disturl: https://electronjs.org/headers
          CI: true

      - name: Verify unpacked app resource shape
        shell: bash
        env:
          PACKAGE_SMOKE_REASONS: ${{ needs.pr-check-plan.outputs.package_smoke_reasons_json }}
        run: |
          set -euo pipefail
          echo "=========================================="
          echo "VERIFY UNPACKED APP RESOURCE SHAPE"
          echo "=========================================="
          APP_PATH="$(find out -type d -name '*.app' -print -quit)"
          if [ -z "$APP_PATH" ]; then
            echo "::error::No .app produced under out/"
            find out -maxdepth 3 -print || true
            exit 1
          fi

          AIONCORE_DIR="$APP_PATH/Contents/Resources/bundled-aioncore"
          HUB_DIR="$APP_PATH/Contents/Resources/hub"

          for required_dir in "$AIONCORE_DIR" "$HUB_DIR"; do
            if [ ! -d "$required_dir" ]; then
              echo "::error::Missing required packaged resource directory: $required_dir"
              find "$APP_PATH/Contents/Resources" -maxdepth 2 -print || true
              exit 1
            fi
          done

          AIONCORE_BIN="$AIONCORE_DIR/darwin-arm64/aioncore"
          AIONCORE_MANIFEST="$AIONCORE_DIR/darwin-arm64/manifest.json"
          if [ ! -x "$AIONCORE_BIN" ]; then
            echo "::error::Missing executable bundled aioncore: $AIONCORE_BIN"
            find "$AIONCORE_DIR" -maxdepth 3 -print || true
            exit 1
          fi
          if [ ! -f "$AIONCORE_MANIFEST" ]; then
            echo "::error::Missing bundled aioncore manifest: $AIONCORE_MANIFEST"
            find "$AIONCORE_DIR" -maxdepth 3 -print || true
            exit 1
          fi

          HUB_INDEX="$HUB_DIR/index.json"
          HUB_MANIFEST="$HUB_DIR/manifest.json"
          HUB_ZIP="$(find "$HUB_DIR" -maxdepth 1 -type f -name '*.zip' -print -quit)"
          if [ ! -f "$HUB_INDEX" ] || [ ! -f "$HUB_MANIFEST" ] || [ -z "$HUB_ZIP" ]; then
            echo "::error::Hub resources are incomplete; expected index.json, manifest.json, and at least one extension zip"
            find "$HUB_DIR" -maxdepth 2 -print || true
            exit 1
          fi

          BUNDLE_ID="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP_PATH/Contents/Info.plist")"
          VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP_PATH/Contents/Info.plist")"
          node scripts/evaosVerifyRendererDependencyPrune.js "$APP_PATH"

          {
            echo "## Thin app smoke"
            echo
            echo "- App path: \`$APP_PATH\`"
            echo "- Version: \`$VERSION\`"
            echo "- Bundle ID: \`$BUNDLE_ID\`"
            echo "- Package smoke reasons: \`$PACKAGE_SMOKE_REASONS\`"
            echo "- Renderer dependency prune: verified \`app.asar\` and \`app.asar.unpacked/node_modules\`"
            echo
            echo "This PR artifact is intentionally unpacked and may be ad-hoc/non-Developer-ID signed by packaging hooks. It produces no DMG, no release metadata, no notarization/stapling proof, no TCC or permission proof, and no public release proof."
            echo
            echo "### Size"
            echo '```'
            du -sh "$APP_PATH" out
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # Job 5: Test release scripts (fast, no build required)
  release-script-test:
    name: Release Script Test
    if: github.event.action != 'closed' && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Create mock build artifacts
        shell: bash
        run: bash scripts/create-mock-release-artifacts.sh build-artifacts

      - name: Run prepare-release-assets script
        shell: bash
        env:
          MOCK_VERSION: '1.0.0'
        run: bash scripts/prepare-release-assets.sh build-artifacts release-assets

      - name: Validate script output
        shell: bash
        run: bash scripts/verify-release-assets.sh release-assets
