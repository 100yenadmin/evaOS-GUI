name: Mac Access Private RC

on:
  workflow_dispatch:
    inputs:
      private_rc_ack:
        description: 'Type mac-access-private-rc to acknowledge that this creates a private Actions artifact only.'
        required: true
        type: string
      candidate_build:
        description: 'Monotonic positive CFBundleVersion for this private v0.1.0 candidate.'
        required: true
        type: string
      rollback_key_id:
        description: 'Broker rollback-verification key ID embedded in this private candidate.'
        required: true
        type: string
      rollback_public_key_base64url:
        description: 'Broker rollback-verification Ed25519 public key (unpadded base64url, 32 decoded bytes).'
        required: true
        type: string
      deployment_profile:
        description: 'Build an intentionally unconfigured artifact or pin the isolated Mac Access staging endpoints and public keys.'
        required: true
        default: unconfigured
        type: choice
        options:
          - unconfigured
          - staging
permissions:
  contents: read

concurrency:
  group: mac-access-private-rc-${{ github.ref }}-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  package:
    name: Signed private RC (${{ matrix.xcode_arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - runtime_arch: arm64
            xcode_arch: arm64
            artifact_arch: arm64
            runner: macos-15
          - runtime_arch: x64
            xcode_arch: x86_64
            artifact_arch: x86_64
            runner: macos-15-intel

    env:
      MAC_ACCESS_EXPECTED_TEAM_ID: TC6MS3T6NN
      MAC_ACCESS_SPARKLE_FEED_URL: ${{ vars.MAC_ACCESS_SPARKLE_FEED_URL }}
      MAC_ACCESS_SPARKLE_PUBLIC_ED_KEY: ${{ vars.MAC_ACCESS_SPARKLE_PUBLIC_ED_KEY }}
      MAC_ACCESS_ROLLBACK_KEY_ID: ${{ inputs.rollback_key_id || vars.MAC_ACCESS_PRIVATE_RC_ROLLBACK_KEY_ID }}
      MAC_ACCESS_ROLLBACK_PUBLIC_KEY_BASE64URL: ${{ inputs.rollback_public_key_base64url || vars.MAC_ACCESS_PRIVATE_RC_ROLLBACK_PUBLIC_KEY_BASE64URL }}
      MAC_ACCESS_CANDIDATE_BUILD: ${{ inputs.candidate_build || github.run_number }}
      MAC_ACCESS_DEPLOYMENT_PROFILE: ${{ inputs.deployment_profile || 'unconfigured' }}
      MAC_ACCESS_PAIRING_ENDPOINT: ${{ inputs.deployment_profile == 'staging' && vars.MAC_ACCESS_STAGING_PAIRING_ENDPOINT || '' }}
      MAC_ACCESS_RELAY_URL: ${{ inputs.deployment_profile == 'staging' && vars.MAC_ACCESS_STAGING_RELAY_URL || '' }}
      MAC_ACCESS_COMMAND_KEY_ID: ${{ inputs.deployment_profile == 'staging' && vars.MAC_ACCESS_STAGING_COMMAND_KEY_ID || '' }}
      MAC_ACCESS_COMMAND_PUBLIC_KEY_BASE64URL: ${{ inputs.deployment_profile == 'staging' && vars.MAC_ACCESS_STAGING_COMMAND_PUBLIC_KEY_BASE64URL || '' }}
      MAC_ACCESS_EXECUTION_CONTEXT_KEY_ID: ${{ inputs.deployment_profile == 'staging' && vars.MAC_ACCESS_STAGING_EXECUTION_CONTEXT_KEY_ID || '' }}
      MAC_ACCESS_EXECUTION_CONTEXT_PUBLIC_KEY_BASE64URL: ${{ inputs.deployment_profile == 'staging' && vars.MAC_ACCESS_STAGING_EXECUTION_CONTEXT_PUBLIC_KEY_BASE64URL || '' }}
      MAC_ACCESS_REQUIRE_PRIVATE_RUNTIME: '1'
      MAC_ACCESS_EXPECTED_ARCH: ${{ matrix.xcode_arch }}

    steps:
      - name: Check out exact dispatch commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Fail closed on acknowledgement and private update configuration
        env:
          PRIVATE_RC_ACK: ${{ inputs.private_rc_ack || 'mac-access-private-rc' }}
        run: |
          set -euo pipefail
          test "$PRIVATE_RC_ACK" = 'mac-access-private-rc'
          test "$GITHUB_REF_TYPE" = 'branch'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 <<'PY'
          import base64
          import os
          import re
          import urllib.parse

          feed = os.environ.get('MAC_ACCESS_SPARKLE_FEED_URL', '').strip()
          public_key = os.environ.get('MAC_ACCESS_SPARKLE_PUBLIC_ED_KEY', '').strip()
          rollback_key_id = os.environ.get('MAC_ACCESS_ROLLBACK_KEY_ID', '').strip()
          rollback_public_key = os.environ.get('MAC_ACCESS_ROLLBACK_PUBLIC_KEY_BASE64URL', '').strip()
          candidate_build = os.environ.get('MAC_ACCESS_CANDIDATE_BUILD', '').strip()
          deployment_profile = os.environ.get('MAC_ACCESS_DEPLOYMENT_PROFILE', '').strip()
          deployment_inputs = {
              name: os.environ.get(name, '').strip()
              for name in (
                  'MAC_ACCESS_PAIRING_ENDPOINT',
                  'MAC_ACCESS_RELAY_URL',
                  'MAC_ACCESS_COMMAND_KEY_ID',
                  'MAC_ACCESS_COMMAND_PUBLIC_KEY_BASE64URL',
                  'MAC_ACCESS_EXECUTION_CONTEXT_KEY_ID',
                  'MAC_ACCESS_EXECUTION_CONTEXT_PUBLIC_KEY_BASE64URL',
              )
          }
          if any(
              canonical != os.environ.get(name, '')
              for name, canonical in (
                  ('MAC_ACCESS_SPARKLE_FEED_URL', feed),
                  ('MAC_ACCESS_SPARKLE_PUBLIC_ED_KEY', public_key),
                  ('MAC_ACCESS_ROLLBACK_KEY_ID', rollback_key_id),
                  ('MAC_ACCESS_ROLLBACK_PUBLIC_KEY_BASE64URL', rollback_public_key),
                  ('MAC_ACCESS_CANDIDATE_BUILD', candidate_build),
                  ('MAC_ACCESS_DEPLOYMENT_PROFILE', deployment_profile),
                  *deployment_inputs.items(),
              )
          ):
              raise SystemExit('Mac Access private-RC update inputs must already be canonical and whitespace-free.')
          parsed = urllib.parse.urlsplit(feed)
          if (
              parsed.scheme != 'https'
              or not parsed.hostname
              or parsed.username
              or parsed.password
              or parsed.query
              or parsed.fragment
              or any(character.isspace() for character in feed)
              or 'mac-access' not in parsed.path.lower()
              or 'workbench' in feed.lower()
          ):
              raise SystemExit(
                  'sparkle_feed_url must be a dedicated query-free HTTPS Mac Access appcast URL.'
              )
          try:
              decoded = base64.b64decode(public_key, validate=True)
          except ValueError as error:
              raise SystemExit('sparkle_public_ed_key must be valid base64.') from error
          if len(decoded) != 32:
              raise SystemExit('sparkle_public_ed_key must decode to exactly 32 bytes.')
          if not re.fullmatch(r'[A-Za-z0-9._:-]{1,128}', rollback_key_id):
              raise SystemExit('rollback_key_id must be a bounded broker key identifier.')
          if not re.fullmatch(r'[A-Za-z0-9_-]{43}', rollback_public_key):
              raise SystemExit('rollback_public_key_base64url must be canonical unpadded base64url.')
          decoded_rollback_key = base64.urlsafe_b64decode(rollback_public_key + '=')
          if len(decoded_rollback_key) != 32:
              raise SystemExit('rollback_public_key_base64url must decode to exactly 32 bytes.')
          if not re.fullmatch(r'[1-9][0-9]{0,8}', candidate_build):
              raise SystemExit('candidate_build must be a canonical positive decimal with at most nine digits.')
          if deployment_profile not in {'unconfigured', 'staging'}:
              raise SystemExit('deployment_profile must be unconfigured or staging.')
          if deployment_profile == 'unconfigured':
              if any(deployment_inputs.values()):
                  raise SystemExit(
                      'Unconfigured Mac Access candidates must not embed staging endpoints or keys.'
                  )
          else:
              if not all(deployment_inputs.values()):
                  raise SystemExit(
                      'Staging Mac Access candidates require both endpoints and both public-key roles.'
                  )
              pairing = urllib.parse.urlsplit(deployment_inputs['MAC_ACCESS_PAIRING_ENDPOINT'])
              relay = urllib.parse.urlsplit(deployment_inputs['MAC_ACCESS_RELAY_URL'])
              if (
                  pairing.scheme != 'https'
                  or not pairing.hostname
                  or pairing.username
                  or pairing.password
                  or pairing.query
                  or pairing.fragment
              ):
                  raise SystemExit('Mac Access staging pairing endpoint must be canonical HTTPS.')
              if (
                  relay.scheme != 'wss'
                  or not relay.hostname
                  or relay.username
                  or relay.password
                  or relay.path != '/mac-access-relay/v1'
                  or relay.query
                  or relay.fragment
              ):
                  raise SystemExit(
                      'Mac Access staging relay URL must be canonical WSS at /mac-access-relay/v1.'
                  )
              key_ids = (
                  deployment_inputs['MAC_ACCESS_COMMAND_KEY_ID'],
                  deployment_inputs['MAC_ACCESS_EXECUTION_CONTEXT_KEY_ID'],
              )
              if any(not re.fullmatch(r'[A-Za-z0-9][A-Za-z0-9._:-]{0,127}', value)
                     for value in key_ids) or key_ids[0] == key_ids[1]:
                  raise SystemExit('Mac Access staging key IDs must be distinct bounded identifiers.')
              public_keys = (
                  deployment_inputs['MAC_ACCESS_COMMAND_PUBLIC_KEY_BASE64URL'],
                  deployment_inputs['MAC_ACCESS_EXECUTION_CONTEXT_PUBLIC_KEY_BASE64URL'],
              )
              if any(not re.fullmatch(r'[A-Za-z0-9_-]{43}', value) for value in public_keys):
                  raise SystemExit(
                      'Mac Access staging public keys must be canonical unpadded base64url.'
                  )
              decoded_keys = tuple(
                  base64.urlsafe_b64decode(value + '=') for value in public_keys
              )
              if any(len(value) != 32 for value in decoded_keys) or decoded_keys[0] == decoded_keys[1]:
                  raise SystemExit(
                      'Mac Access staging public keys must be distinct 32-byte Ed25519 keys.'
                  )
          PY
          {
            echo "MAC_ACCESS_SIGNING_KEYCHAIN=$RUNNER_TEMP/mac-access-private-rc-signing.keychain-db"
            echo "MAC_ACCESS_NOTARY_API_KEY_PATH=$RUNNER_TEMP/mac-access-private-rc-notary-api-key.p8"
            echo "MAC_ACCESS_HELPER_PROFILE_PATH=$RUNNER_TEMP/mac-access-helper-developer-id.provisionprofile"
            echo "MAC_ACCESS_EVIDENCE_DIR=$RUNNER_TEMP/mac-access-private-rc-${{ matrix.artifact_arch }}"
            echo "MAC_ACCESS_ARTIFACT_MANIFEST=$RUNNER_TEMP/mac-access-private-rc-${{ matrix.artifact_arch }}/mac-access-artifact.json"
            echo "MAC_ACCESS_SBOM=$RUNNER_TEMP/mac-access-private-rc-${{ matrix.artifact_arch }}/mac-access-sbom.spdx.json"
            echo "MAC_ACCESS_NOTARY_RESULT=$RUNNER_TEMP/mac-access-private-rc-${{ matrix.artifact_arch }}/notary-submission.json"
          } >> "$GITHUB_ENV"
          node <<'NODE' >> "$GITHUB_ENV"
          const crypto = require('node:crypto');
          const {
            EXPECTED_COMPATIBILITY,
            ROLE_CONTRACTS,
            canonicalJSON,
          } = require('./packages/mac-access/scripts/release/manifest');

          const sha256 = (value) => crypto.createHash('sha256').update(value).digest('hex');
          const helper = ROLE_CONTRACTS.helper;
          const values = {
            MAC_ACCESS_SECURITY_EPOCH: EXPECTED_COMPATIBILITY.securityEpoch,
            MAC_ACCESS_CREDENTIAL_SECURITY_EPOCH: EXPECTED_COMPATIBILITY.credentialEpoch,
            MAC_ACCESS_SCHEMA_READER_VERSION: EXPECTED_COMPATIBILITY.schemaReaderVersion,
            MAC_ACCESS_SCHEMA_WRITER_VERSION: EXPECTED_COMPATIBILITY.schemaWriterVersion,
            MAC_ACCESS_HELPER_ENTITLEMENTS_SHA256: sha256(canonicalJSON(helper.expectedEntitlements)),
            MAC_ACCESS_HELPER_RELATION_SHA256: sha256(canonicalJSON(helper.relationship)),
          };
          for (const [name, value] of Object.entries(values)) console.log(`${name}=${value}`);
          NODE

      - name: Fail closed on Developer ID and Apple API secrets
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          MAC_ACCESS_SPARKLE_PRIVATE_KEY: ${{ secrets.MAC_ACCESS_SPARKLE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          missing=()
          for name in \
            BUILD_CERTIFICATE_BASE64 \
            P12_PASSWORD \
            APPLE_API_KEY_BASE64 \
            APPLE_API_KEY_ID \
            APPLE_API_ISSUER \
            MAC_ACCESS_SPARKLE_PRIVATE_KEY; do
            if [ -z "${!name:-}" ]; then
              missing+=("$name")
            fi
          done
          if [ "${#missing[@]}" -ne 0 ]; then
            echo "::error::Mac Access private RC is missing required repository secrets: ${missing[*]}"
            exit 1
          fi

      - name: Prepare hash-pinned private Python runtime
        run: scripts/prepareEvaosDesktopBridgePythonRuntime.sh "${{ matrix.runtime_arch }}" "$GITHUB_ENV"

      - name: Build standalone Release bundle
        run: |
          set -euo pipefail
          DERIVED_DATA_PATH="$RUNNER_TEMP/MacAccessPrivateRCDerivedData"
          xcodebuild \
            -project packages/mac-access/MacAccess.xcodeproj \
            -scheme MacAccess \
            -configuration Release \
            -derivedDataPath "$DERIVED_DATA_PATH" \
            CODE_SIGNING_ALLOWED=NO \
            ARCHS="${{ matrix.xcode_arch }}" \
            ONLY_ACTIVE_ARCH=YES \
            MARKETING_VERSION=0.1.0 \
            CURRENT_PROJECT_VERSION="$MAC_ACCESS_CANDIDATE_BUILD" \
            MAC_ACCESS_UPDATE_FEED_URL="$MAC_ACCESS_SPARKLE_FEED_URL" \
            MAC_ACCESS_UPDATE_PUBLIC_ED_KEY="$MAC_ACCESS_SPARKLE_PUBLIC_ED_KEY" \
            MAC_ACCESS_SOURCE_COMMIT="$GITHUB_SHA" \
            MAC_ACCESS_SECURITY_EPOCH="$MAC_ACCESS_SECURITY_EPOCH" \
            MAC_ACCESS_CREDENTIAL_SECURITY_EPOCH="$MAC_ACCESS_CREDENTIAL_SECURITY_EPOCH" \
            MAC_ACCESS_SCHEMA_READER_VERSION="$MAC_ACCESS_SCHEMA_READER_VERSION" \
            MAC_ACCESS_SCHEMA_WRITER_VERSION="$MAC_ACCESS_SCHEMA_WRITER_VERSION" \
            MAC_ACCESS_ROLLBACK_KEY_ID="$MAC_ACCESS_ROLLBACK_KEY_ID" \
            MAC_ACCESS_ROLLBACK_PUBLIC_KEY_BASE64URL="$MAC_ACCESS_ROLLBACK_PUBLIC_KEY_BASE64URL" \
            MAC_ACCESS_HELPER_ENTITLEMENTS_SHA256="$MAC_ACCESS_HELPER_ENTITLEMENTS_SHA256" \
            MAC_ACCESS_HELPER_RELATION_SHA256="$MAC_ACCESS_HELPER_RELATION_SHA256" \
            MAC_ACCESS_PAIRING_ENDPOINT="$MAC_ACCESS_PAIRING_ENDPOINT" \
            MAC_ACCESS_RELAY_URL="$MAC_ACCESS_RELAY_URL" \
            MAC_ACCESS_COMMAND_KEY_ID="$MAC_ACCESS_COMMAND_KEY_ID" \
            MAC_ACCESS_COMMAND_PUBLIC_KEY_BASE64URL="$MAC_ACCESS_COMMAND_PUBLIC_KEY_BASE64URL" \
            MAC_ACCESS_EXECUTION_CONTEXT_KEY_ID="$MAC_ACCESS_EXECUTION_CONTEXT_KEY_ID" \
            MAC_ACCESS_EXECUTION_CONTEXT_PUBLIC_KEY_BASE64URL="$MAC_ACCESS_EXECUTION_CONTEXT_PUBLIC_KEY_BASE64URL" \
            clean build
          APP_PATH="$DERIVED_DATA_PATH/Build/Products/Release/evaOS Mac Access.app"
          test -d "$APP_PATH"
          HELPER_INFO="$APP_PATH/Contents/XPCServices/evaOS Mac Access Helper.xpc/Contents/Info.plist"
          test "$(/usr/libexec/PlistBuddy -c 'Print :MacAccessPairingEndpoint' "$HELPER_INFO")" = "$MAC_ACCESS_PAIRING_ENDPOINT"
          test "$(/usr/libexec/PlistBuddy -c 'Print :MacAccessRelayURL' "$HELPER_INFO")" = "$MAC_ACCESS_RELAY_URL"
          test "$(/usr/libexec/PlistBuddy -c 'Print :MacAccessCommandKeyID' "$HELPER_INFO")" = "$MAC_ACCESS_COMMAND_KEY_ID"
          test "$(/usr/libexec/PlistBuddy -c 'Print :MacAccessCommandPublicKeyBase64URL' "$HELPER_INFO")" = "$MAC_ACCESS_COMMAND_PUBLIC_KEY_BASE64URL"
          test "$(/usr/libexec/PlistBuddy -c 'Print :MacAccessExecutionContextKeyID' "$HELPER_INFO")" = "$MAC_ACCESS_EXECUTION_CONTEXT_KEY_ID"
          test "$(/usr/libexec/PlistBuddy -c 'Print :MacAccessExecutionContextPublicKeyBase64URL' "$HELPER_INFO")" = "$MAC_ACCESS_EXECUTION_CONTEXT_PUBLIC_KEY_BASE64URL"
          echo "MAC_ACCESS_APP_PATH=$APP_PATH" >> "$GITHUB_ENV"
          echo "MAC_ACCESS_SPARKLE_BIN_DIR=$DERIVED_DATA_PATH/SourcePackages/artifacts/sparkle/Sparkle/bin" >> "$GITHUB_ENV"
          packages/mac-access/scripts/verify-bundle-layout.sh "$APP_PATH"
          packages/mac-connector-core/scripts/runEmbeddedProof.sh \
            "$GITHUB_WORKSPACE" \
            "$EVAOS_DESKTOP_BRIDGE_PYTHON_RUNTIME_DIR" \
            "$RUNNER_TEMP/mac-access-core-proof"

      - name: Materialize ephemeral release credentials
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$MAC_ACCESS_SIGNING_KEYCHAIN"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"
          CERTIFICATE_PATH="$RUNNER_TEMP/mac-access-private-rc-certificate.p12"
          API_KEY_PATH="$MAC_ACCESS_NOTARY_API_KEY_PATH"

          printf '%s' "$BUILD_CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE_PATH"
          printf '%s' "$APPLE_API_KEY_BASE64" | base64 --decode > "$API_KEY_PATH"
          chmod 600 "$CERTIFICATE_PATH" "$API_KEY_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 7200 "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" \
            -k "$KEYCHAIN_PATH" \
            -P "$P12_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security >/dev/null
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          rm -f "$CERTIFICATE_PATH"

          SIGNING_IDENTITY="$(
            security find-identity -v -p codesigning "$KEYCHAIN_PATH" \
              | awk '/Developer ID Application:/ && /\(TC6MS3T6NN\)/ {print $2; exit}'
          )"
          if ! printf '%s' "$SIGNING_IDENTITY" | grep -Eq '^[A-Fa-f0-9]{40}$'; then
            echo '::error::The repository certificate does not contain the approved Mac Access Developer ID identity.'
            exit 1
          fi

          PREFLIGHT_TARGET="$RUNNER_TEMP/mac-access-codesign-preflight"
          cp /usr/bin/true "$PREFLIGHT_TARGET"
          /usr/bin/codesign \
            --force \
            --sign "$SIGNING_IDENTITY" \
            --timestamp \
            --options runtime \
            --keychain "$KEYCHAIN_PATH" \
            "$PREFLIGHT_TARGET"
          /usr/bin/codesign --verify --strict "$PREFLIGHT_TARGET"
          rm -f "$PREFLIGHT_TARGET"

          echo "MAC_ACCESS_SIGNING_IDENTITY=$SIGNING_IDENTITY" >> "$GITHUB_ENV"

      - name: Obtain exact helper Developer ID provisioning profile
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          CERTIFICATE_SERIAL="$(
            security find-certificate \
              -c 'Developer ID Application: Andrew Ryan (TC6MS3T6NN)' \
              -p \
              "$MAC_ACCESS_SIGNING_KEYCHAIN" \
              | openssl x509 -noout -serial \
              | sed -E 's/^serial=//; s/[^A-Fa-f0-9]//g'
          )"
          printf '%s' "$CERTIFICATE_SERIAL" | grep -Eq '^[A-Fa-f0-9]+$'
          node packages/mac-access/scripts/release/ensure-helper-profile.js \
            --key "$MAC_ACCESS_NOTARY_API_KEY_PATH" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER" \
            --certificate-serial "$CERTIFICATE_SERIAL" \
            --output "$MAC_ACCESS_HELPER_PROFILE_PATH"
          test -s "$MAC_ACCESS_HELPER_PROFILE_PATH"
          test "$(stat -f '%Lp' "$MAC_ACCESS_HELPER_PROFILE_PATH")" = '600'
          security cms -D -i "$MAC_ACCESS_HELPER_PROFILE_PATH" > /dev/null

      - name: Preflight Apple notarization credentials
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          xcrun notarytool history \
            --key "$MAC_ACCESS_NOTARY_API_KEY_PATH" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER" \
            --output-format json \
            --no-progress > /dev/null

      - name: Sign inside-out and create frozen identity evidence
        run: |
          set -euo pipefail
          rm -rf "$MAC_ACCESS_EVIDENCE_DIR"
          mkdir -p "$MAC_ACCESS_EVIDENCE_DIR"
          packages/mac-access/scripts/release/sign-bundle.js sign \
            --app "$MAC_ACCESS_APP_PATH" \
            --identity "$MAC_ACCESS_SIGNING_IDENTITY" \
            --keychain "$MAC_ACCESS_SIGNING_KEYCHAIN" \
            --helper-profile "$MAC_ACCESS_HELPER_PROFILE_PATH" \
            --manifest "$MAC_ACCESS_ARTIFACT_MANIFEST" \
            --sbom "$MAC_ACCESS_SBOM" \
            --source-sha "$GITHUB_SHA"

      - name: Notarize the exact signed bundle
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          SUBMISSION_ZIP="$RUNNER_TEMP/mac-access-private-rc-notary-${{ matrix.artifact_arch }}.zip"
          rm -f "$SUBMISSION_ZIP"
          ditto -c -k --sequesterRsrc --keepParent "$MAC_ACCESS_APP_PATH" "$SUBMISSION_ZIP"
          SUBMISSION_SHA256="$(shasum -a 256 "$SUBMISSION_ZIP" | awk '{print $1}')"
          xcrun notarytool submit "$SUBMISSION_ZIP" \
            --key "$MAC_ACCESS_NOTARY_API_KEY_PATH" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER" \
            --wait \
            --timeout 30m \
            --output-format json \
            --no-progress > "$MAC_ACCESS_NOTARY_RESULT"
          NOTARY_STATUS="$(node -e "const value=require(process.argv[1]); process.stdout.write(value.status || '')" "$MAC_ACCESS_NOTARY_RESULT")"
          NOTARY_ID="$(node -e "const value=require(process.argv[1]); process.stdout.write(value.id || '')" "$MAC_ACCESS_NOTARY_RESULT")"
          test "$NOTARY_STATUS" = 'Accepted'
          printf '%s' "$NOTARY_ID" | grep -Eq '^[0-9A-Fa-f-]{36}$'
          echo "MAC_ACCESS_SUBMISSION_SHA256=$SUBMISSION_SHA256" >> "$GITHUB_ENV"
          rm -f "$SUBMISSION_ZIP"

      - name: Staple and verify the notarized bundle
        run: |
          set -euo pipefail
          xcrun stapler staple "$MAC_ACCESS_APP_PATH" \
            > "$MAC_ACCESS_EVIDENCE_DIR/stapler-staple.txt" 2>&1
          xcrun stapler validate "$MAC_ACCESS_APP_PATH" \
            > "$MAC_ACCESS_EVIDENCE_DIR/stapler-validate.txt" 2>&1
          codesign --verify --deep --strict --verbose=4 "$MAC_ACCESS_APP_PATH" \
            > "$MAC_ACCESS_EVIDENCE_DIR/codesign-verify.txt" 2>&1
          spctl --assess --type execute --verbose=4 "$MAC_ACCESS_APP_PATH" \
            > "$MAC_ACCESS_EVIDENCE_DIR/gatekeeper-assess.txt" 2>&1
          packages/mac-access/scripts/release/sign-bundle.js record \
            --app "$MAC_ACCESS_APP_PATH" \
            --manifest "$MAC_ACCESS_ARTIFACT_MANIFEST" \
            --sbom "$MAC_ACCESS_SBOM" \
            --source-sha "$GITHUB_SHA"
          packages/mac-access/scripts/release/sign-bundle.js verify \
            --app "$MAC_ACCESS_APP_PATH" \
            --manifest "$MAC_ACCESS_ARTIFACT_MANIFEST" \
            --sbom "$MAC_ACCESS_SBOM"
          packages/mac-access/scripts/verify-bundle-layout.sh --signed "$MAC_ACCESS_APP_PATH"

      - name: Create exact final ZIP, checksum, and private-RC manifest
        env:
          MAC_ACCESS_SPARKLE_PRIVATE_KEY: ${{ secrets.MAC_ACCESS_SPARKLE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$MAC_ACCESS_APP_PATH/Contents/Info.plist")"
          FINAL_ZIP="$MAC_ACCESS_EVIDENCE_DIR/evaOS-Mac-Access-${VERSION}-private-rc-${{ matrix.artifact_arch }}.zip"
          rm -f "$FINAL_ZIP"
          ditto -c -k --sequesterRsrc --keepParent "$MAC_ACCESS_APP_PATH" "$FINAL_ZIP"
          FINAL_ZIP_SHA256="$(shasum -a 256 "$FINAL_ZIP" | awk '{print $1}')"
          FINAL_ZIP_SIZE="$(stat -f '%z' "$FINAL_ZIP")"
          printf '%s  %s\n' "$FINAL_ZIP_SHA256" "$(basename "$FINAL_ZIP")" \
            > "$MAC_ACCESS_EVIDENCE_DIR/CHECKSUMS.txt"

          test -x "$MAC_ACCESS_SPARKLE_BIN_DIR/generate_appcast"
          test -x "$MAC_ACCESS_SPARKLE_BIN_DIR/sign_update"
          APPCAST_ARCHIVE_DIR="$RUNNER_TEMP/mac-access-private-appcast-${{ matrix.artifact_arch }}"
          rm -rf "$APPCAST_ARCHIVE_DIR"
          mkdir -p "$APPCAST_ARCHIVE_DIR"
          cp "$FINAL_ZIP" "$APPCAST_ARCHIVE_DIR/$(basename "$FINAL_ZIP")"
          cp packages/mac-access/Resources/ReleaseNotes/private-rc.md \
            "$APPCAST_ARCHIVE_DIR/$(basename "$FINAL_ZIP" .zip).md"
          DOWNLOAD_URL_PREFIX="${MAC_ACCESS_SPARKLE_FEED_URL%/*}/"
          printf '%s' "$MAC_ACCESS_SPARKLE_PRIVATE_KEY" | \
            "$MAC_ACCESS_SPARKLE_BIN_DIR/generate_appcast" \
              --ed-key-file - \
              --download-url-prefix "$DOWNLOAD_URL_PREFIX" \
              --channel mac-access-private-rc \
              --maximum-deltas 0 \
              --embed-release-notes \
              -o "$MAC_ACCESS_EVIDENCE_DIR/appcast.xml" \
              "$APPCAST_ARCHIVE_DIR"
          packages/mac-access/scripts/release/appcast.js inject \
            --appcast "$MAC_ACCESS_EVIDENCE_DIR/appcast.xml" \
            --manifest "$MAC_ACCESS_ARTIFACT_MANIFEST" \
            --archive "$FINAL_ZIP" \
            --source-sha "$GITHUB_SHA"
          printf '%s' "$MAC_ACCESS_SPARKLE_PRIVATE_KEY" | \
            "$MAC_ACCESS_SPARKLE_BIN_DIR/sign_update" \
              --ed-key-file - \
              --disable-signing-warning \
              "$MAC_ACCESS_EVIDENCE_DIR/appcast.xml" >/dev/null
          printf '%s' "$MAC_ACCESS_SPARKLE_PRIVATE_KEY" | \
            "$MAC_ACCESS_SPARKLE_BIN_DIR/sign_update" \
              --verify \
              --ed-key-file - \
              "$MAC_ACCESS_EVIDENCE_DIR/appcast.xml"
          rm -rf "$APPCAST_ARCHIVE_DIR"

          export VERSION FINAL_ZIP FINAL_ZIP_SHA256 FINAL_ZIP_SIZE
          node <<'NODE'
          const crypto = require('node:crypto');
          const fs = require('node:fs');
          const path = require('node:path');

          function sha256(filePath) {
            return crypto.createHash('sha256').update(fs.readFileSync(filePath)).digest('hex');
          }

          function evidenceFile(name) {
            const filePath = path.join(process.env.MAC_ACCESS_EVIDENCE_DIR, name);
            return { file: name, sha256: sha256(filePath) };
          }

          const artifactManifest = JSON.parse(fs.readFileSync(process.env.MAC_ACCESS_ARTIFACT_MANIFEST, 'utf8'));
          const notary = JSON.parse(fs.readFileSync(process.env.MAC_ACCESS_NOTARY_RESULT, 'utf8'));
          const publicKeySHA256 = crypto
            .createHash('sha256')
            .update(Buffer.from(process.env.MAC_ACCESS_SPARKLE_PUBLIC_ED_KEY, 'base64'))
            .digest('hex');
          const finalManifest = {
            schema: 'evaos.mac_access.private_rc_manifest.v1',
            proofBoundary: 'private-github-actions-artifact-only',
            source: {
              repository: process.env.GITHUB_REPOSITORY,
              commit: process.env.GITHUB_SHA,
              ref: process.env.GITHUB_REF,
              workflow: process.env.GITHUB_WORKFLOW,
              runID: process.env.GITHUB_RUN_ID,
              runAttempt: process.env.GITHUB_RUN_ATTEMPT,
            },
            candidate: {
              product: 'evaOS Mac Access',
              version: process.env.VERSION,
              architecture: '${{ matrix.artifact_arch }}',
              appBundleID: 'com.evaos.mac-access',
              helperBundleID: 'com.evaos.mac-access.helper',
              connectorBundleID: 'com.evaos.mac-access.connector',
              approvedTeamID: process.env.MAC_ACCESS_EXPECTED_TEAM_ID,
              artifactManifestSHA256: sha256(process.env.MAC_ACCESS_ARTIFACT_MANIFEST),
              sbomSHA256: sha256(process.env.MAC_ACCESS_SBOM),
              signedBundleTreeSHA256: artifactManifest.artifact.bundleTree.sha256,
              helperProvisioningProfile: artifactManifest.signing.roles.helper.provisioningProfile,
            },
            updateConfiguration: {
              channel: 'mac-access-private-rc',
              feedURL: process.env.MAC_ACCESS_SPARKLE_FEED_URL,
              publicEdKeySHA256: publicKeySHA256,
              privateAppcastSHA256: sha256(path.join(process.env.MAC_ACCESS_EVIDENCE_DIR, 'appcast.xml')),
              signedAppcast: true,
              exactArchiveBound: true,
              appcastPublished: false,
            },
            rollbackProof: {
              authorizationAvailable: false,
              exercised: false,
              blocker: 'https://github.com/electricsheephq/evaos-ws-proxy/issues/76',
            },
            notarization: {
              tool: 'notarytool',
              submissionID: notary.id,
              status: notary.status,
              submittedArchiveSHA256: process.env.MAC_ACCESS_SUBMISSION_SHA256,
              stapled: true,
              stapleValidated: true,
              gatekeeperAccepted: true,
            },
            evidenceFiles: {
              artifactManifest: evidenceFile('mac-access-artifact.json'),
              sbom: evidenceFile('mac-access-sbom.spdx.json'),
              notarySubmission: evidenceFile('notary-submission.json'),
              codesignVerification: evidenceFile('codesign-verify.txt'),
              stapleResult: evidenceFile('stapler-staple.txt'),
              stapleValidation: evidenceFile('stapler-validate.txt'),
              gatekeeperAssessment: evidenceFile('gatekeeper-assess.txt'),
              checksums: evidenceFile('CHECKSUMS.txt'),
              privateAppcast: evidenceFile('appcast.xml'),
            },
            finalArtifact: {
              file: path.basename(process.env.FINAL_ZIP),
              sha256: process.env.FINAL_ZIP_SHA256,
              size: Number(process.env.FINAL_ZIP_SIZE),
            },
            verification: {
              developerID: true,
              hardenedRuntime: true,
              designatedRequirements: true,
              helperRelationship: true,
              entitlements: true,
              helperProvisioningProfile: true,
              privateRuntime: true,
              coreSourceBinding: true,
              dependencyLicenseInventory: true,
              sbom: true,
            },
            publication: {
              actionsArtifactOnly: true,
              githubReleaseCreated: false,
              tagCreated: false,
              publicFeedMutated: false,
              workbenchReleaseMutated: false,
              betaV2136Mutated: false,
            },
          };
          fs.writeFileSync(
            path.join(process.env.MAC_ACCESS_EVIDENCE_DIR, 'private-rc-final-manifest.json'),
            `${JSON.stringify(finalManifest, null, 2)}\n`
          );
          NODE

          node <<'NODE'
          const crypto = require('node:crypto');
          const fs = require('node:fs');
          const path = require('node:path');
          const evidence = process.env.MAC_ACCESS_EVIDENCE_DIR;
          const manifest = JSON.parse(fs.readFileSync(path.join(evidence, 'private-rc-final-manifest.json'), 'utf8'));
          const finalZip = path.join(evidence, manifest.finalArtifact.file);
          const actual = crypto.createHash('sha256').update(fs.readFileSync(finalZip)).digest('hex');
          const appcast = fs.readFileSync(path.join(evidence, 'appcast.xml'), 'utf8');
          const evidenceFilesMatch = Object.values(manifest.evidenceFiles).every((entry) => {
            const bytes = fs.readFileSync(path.join(evidence, entry.file));
            return crypto.createHash('sha256').update(bytes).digest('hex') === entry.sha256;
          });
          if (
            manifest.schema !== 'evaos.mac_access.private_rc_manifest.v1' ||
            manifest.source.commit !== process.env.GITHUB_SHA ||
            manifest.notarization.status !== 'Accepted' ||
            manifest.finalArtifact.sha256 !== actual ||
            !manifest.updateConfiguration.signedAppcast ||
            !manifest.updateConfiguration.exactArchiveBound ||
            manifest.rollbackProof.authorizationAvailable ||
            manifest.rollbackProof.exercised ||
            manifest.rollbackProof.blocker !== 'https://github.com/electricsheephq/evaos-ws-proxy/issues/76' ||
            !appcast.includes(`</evaos:artifact_sha256>`) ||
            !appcast.includes(`<evaos:artifact_sha256>${actual}</evaos:artifact_sha256>`) ||
            !appcast.includes('sparkle:edSignature=') ||
            !evidenceFilesMatch ||
            !manifest.publication.actionsArtifactOnly ||
            manifest.publication.githubReleaseCreated ||
            manifest.publication.tagCreated ||
            manifest.publication.publicFeedMutated ||
            manifest.publication.workbenchReleaseMutated ||
            manifest.publication.betaV2136Mutated
          ) {
            throw new Error('Mac Access private-RC final evidence failed closed.');
          }
          NODE

      - name: Upload private-RC evidence artifact only
        uses: actions/upload-artifact@v4
        with:
          name: mac-access-private-rc-${{ matrix.artifact_arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/mac-access-private-rc-${{ matrix.artifact_arch }}
          if-no-files-found: error
          retention-days: 7

      - name: Remove ephemeral release credentials
        if: always()
        run: |
          set +e
          if [ -n "${MAC_ACCESS_SIGNING_KEYCHAIN:-}" ]; then
            security delete-keychain "$MAC_ACCESS_SIGNING_KEYCHAIN" >/dev/null 2>&1
          fi
          rm -f \
            "${MAC_ACCESS_NOTARY_API_KEY_PATH:-}" \
            "${MAC_ACCESS_HELPER_PROFILE_PATH:-}" \
            "$RUNNER_TEMP/mac-access-private-rc-certificate.p12"
